# Financial statements from the official filings APIs (DART for Korea, SEC EDGAR for the US).
# Manual only. Reference material; nothing here touches the paper ledger or the rules.
name: fundamentals

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated symbols: 005930.KS, 096530.KQ, AAPL, BRK-B'
        required: true
      years:
        description: 'Years of annual history'
        default: '5'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: trading/requirements.txt
      - run: pip install -r trading/requirements.txt
      - uses: actions/cache@v4
        with:
          path: trading/.cache/dart
          key: fundamentals-dart-${{ github.run_id }}
          restore-keys: fundamentals-dart-
      - name: SEC reachability probe (temporary)
        env:
          EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT || format('beomstar-swing {0}@users.noreply.github.com', github.actor) }}
        run: |
          for u in https://www.sec.gov/files/company_tickers.json https://www.sec.gov/include/ticker.txt https://data.sec.gov/api/xbrl/companyfacts/CIK0000320193.json https://data.sec.gov/submissions/CIK0000320193.json "https://efts.sec.gov/LATEST/search-index?q=apple&forms=10-K"; do
            code=$(curl -sS -o body.txt -w '%{http_code}' -A "$EDGAR_USER_AGENT" -H 'Accept-Encoding: gzip, deflate' "$u" || echo ERR)
            echo "$u -> $code ($(head -c 200 body.txt | tr '\n' ' '))"
          done
      - name: Report
        working-directory: trading
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          # SEC requires a contact in the User-Agent. Repo variable EDGAR_USER_AGENT
          # ("beomstar-swing you@example.com") wins; else the actor's GitHub noreply address.
          EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT || format('beomstar-swing {0}@users.noreply.github.com', github.actor) }}
        run: |
          python tools/fundamentals_report.py --symbols "${{ github.event.inputs.symbols }}" --years "${{ github.event.inputs.years }}" --out reports --cache-dir .cache | tee report.txt
          cat report.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fundamentals-${{ github.run_id }}
          path: trading/reports/
          retention-days: 30
