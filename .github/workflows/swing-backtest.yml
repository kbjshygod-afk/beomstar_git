# Runs the swing-rules engine tests and a 10-year portfolio backtest per market.
# Results are pushed to the `swing-results` branch (never to the working branch).
name: swing-backtest

on:
  push:
    branches: [claude/github-top-10-skills-k1u8yp]
    paths: ['trading/**', '.github/workflows/swing-backtest.yml']
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'Limit symbols per market for a smoke run (0 = all)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: swing-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: trading/requirements.txt
      - run: pip install -r trading/requirements.txt
      - run: python -m pytest trading/tests -q

  backtest:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        market: [SP500, NDX100, KOSPI, KOSDAQ, CRYPTO]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: trading/requirements.txt
      - run: pip install -r trading/requirements.txt
      - name: Dates
        id: dates
        run: |
          echo "end=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "test_start=$(date -u -d '10 years ago' +%F)" >> "$GITHUB_OUTPUT"
          echo "start=$(date -u -d '12 years ago' +%F)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: trading/.cache
          key: swing-data-${{ matrix.market }}-${{ steps.dates.outputs.week }}
      - name: Backtest (RS percentile = scanner rule; RS proxy = TradingView rule)
        working-directory: trading
        env:
          MAX_SYMBOLS: ${{ github.event.inputs.max_symbols || '0' }}
        run: |
          set -o pipefail
          EXTRA=""
          if [ "$MAX_SYMBOLS" != "0" ]; then EXTRA="--max-symbols $MAX_SYMBOLS"; fi
          python -m swing_engine.backtest --market ${{ matrix.market }} \
            --start ${{ steps.dates.outputs.start }} --end ${{ steps.dates.outputs.end }} \
            --test-start ${{ steps.dates.outputs.test_start }} --rs-mode both -v \
            --cache-dir .cache --out results/${{ matrix.market }} $EXTRA 2>&1 | tee results-${{ matrix.market }}.log
      - name: Signal study (every signal traded alone, for pattern analysis)
        working-directory: trading
        env:
          MAX_SYMBOLS: ${{ github.event.inputs.max_symbols || '0' }}
        run: |
          EXTRA=""
          if [ "$MAX_SYMBOLS" != "0" ]; then EXTRA="--max-symbols $MAX_SYMBOLS"; fi
          python -m swing_engine.signal_study --market ${{ matrix.market }} \
            --start ${{ steps.dates.outputs.start }} --end ${{ steps.dates.outputs.end }} \
            --test-start ${{ steps.dates.outputs.test_start }} \
            --cache-dir .cache --out results/${{ matrix.market }}/signals.csv $EXTRA
      - name: Print summaries
        if: always()
        working-directory: trading
        run: |
          for f in results/*/summary.md; do echo "===== $f"; cat "$f"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing-results-${{ matrix.market }}
          path: |
            trading/results/
            trading/results-*.log
          if-no-files-found: warn

  publish:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: swing-results-*
          path: out
          merge-multiple: true
      - name: Push results to the swing-results branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "swing-backtest[bot]"
          git config --global user.email "swing-backtest@users.noreply.github.com"
          git init -q pub && cd pub
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin swing-results; then git checkout -q -b swing-results FETCH_HEAD; else git checkout -q --orphan swing-results; fi
          run_dir="runs/$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          mkdir -p "$run_dir" && cp -r ../out/. "$run_dir/"
          rm -rf latest && mkdir -p latest && cp -r ../out/. latest/
          git add -A
          git commit -q -m "Backtest results ${GITHUB_SHA::7} ($run_dir)" || { echo "nothing to commit"; exit 0; }
          git push -q origin swing-results
