# Temporary: prints raw Yahoo daily bars around the UTC day boundary to diagnose missing last bars.
name: swing-diag
on:
  push:
    branches: [claude/github-top-10-skills-k1u8yp]
    paths: ['.github/workflows/swing-diag.yml', 'trading/tools/yahoo_diag.py']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: trading/requirements.txt
      - run: pip install -r trading/requirements.txt
      - working-directory: trading
        run: python tools/yahoo_diag.py
