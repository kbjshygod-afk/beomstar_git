# Daily paper trading of the swing-rules engine.
# Signals are committed to the `paper-trading` branch right after each market's close,
# before the next session's open, so the git history proves no signal was changed afterwards.
# Scheduled runs only start once this file is on the repository's default branch.
#
# Every market runs every 2 hours, dispatched by swing-paper-keeper.yml, with this schedule
# as a backup. GitHub starts scheduled runs hours late and sometimes not at all (2026-09-28:
# the Monday KRX run never started), so each close gets several chances before the next open.
# Reruns are idempotent: a market whose close is already committed, or whose session is still
# open, commits nothing.
name: swing-paper

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      markets:
        description: 'Markets to run (space separated)'
        default: 'SP500 NDX100 KOSPI KOSDAQ CRYPTO'
      tries:
        description: 'Tries per stock market while its data is not ready (10 min apart)'
        default: '3'
      alert_test:
        description: 'Signal alert: post the newest signal of each alert market even if it is not new (true/false)'
        default: 'false'
  push:
    branches: [claude/github-top-10-skills-k1u8yp]
    paths: ['trading/swing_engine/paper.py', 'trading/tools/signal_alert.py', '.github/workflows/swing-paper.yml']

permissions:
  contents: write
  issues: write           # signal alerts are issue comments (trading/tools/signal_alert.py)

env:
  # Markets whose newly committed signal files are announced after each run
  # (docs/swing-improvement-policy.md R7): Slack when the SLACK_WEBHOOK_URL secret exists,
  # otherwise a comment on the issue "<market> 모의투자 신호 알림", which GitHub notifies the owner about.
  ALERT_MARKETS: KOSDAQ

concurrency:
  group: swing-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: trading/requirements.txt
      - run: pip install -r trading/requirements.txt
      - name: Pick markets
        id: m
        run: |
          if [ -n "${{ github.event.inputs.markets }}" ]; then m="${{ github.event.inputs.markets }}"
          else m="SP500 NDX100 KOSPI KOSDAQ CRYPTO"; fi
          echo "markets=$m" >> "$GITHUB_OUTPUT"
          # data not ready (exit 75): scheduled and keeper runs (tries=1) leave it to the next run
          # 2 hours later; manual and trial runs retry stocks in place (crypto lags by hours)
          if [ "${{ github.event_name }}" = "schedule" ]; then tries=1; else tries="${{ github.event.inputs.tries || '3' }}"; fi
          echo "tries=$tries" >> "$GITHUB_OUTPUT"; echo "wait=600" >> "$GITHUB_OUTPUT"
          # push-triggered runs are trials: they write to a separate branch
          if [ "${{ github.event_name }}" = "push" ]; then echo "branch=paper-trading-trial" >> "$GITHUB_OUTPUT"; else echo "branch=paper-trading" >> "$GITHUB_OUTPUT"; fi
      - name: Check out the ledger branch
        id: ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.m.outputs.branch }}
        run: |
          git config --global user.name "swing-paper[bot]"
          git config --global user.email "swing-paper@users.noreply.github.com"
          git init -q ledger && cd ledger
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q origin "$BRANCH"; then git checkout -q -b "$BRANCH" FETCH_HEAD; else git checkout -q --orphan "$BRANCH"; fi
          # the signal alert announces the signal files committed after this point
          echo "head=$(git rev-parse --verify -q HEAD || true)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: trading/.cache
          key: swing-paper-data-${{ github.run_id }}
          restore-keys: swing-paper-data-
      - name: Run paper trading
        working-directory: trading
        env:
          BRANCH: ${{ steps.m.outputs.branch }}
          TRIES: ${{ steps.m.outputs.tries }}
          WAIT: ${{ steps.m.outputs.wait }}
        run: |
          status=0
          for market in ${{ steps.m.outputs.markets }}; do
            echo "::group::$market"
            attempt=1
            while :; do
              rc=0
              python -m swing_engine.paper --market "$market" --ledger-dir ../ledger/paper \
                --cache-dir .cache --push-branch "$BRANCH" -v || rc=$?
              if [ "$rc" -eq 75 ] && [ "$market" != "CRYPTO" ] && [ "$attempt" -lt "$TRIES" ]; then
                echo "::warning::$market data not ready (attempt $attempt/$TRIES), retrying in ${WAIT}s"
                rm -rf .cache                     # refetch instead of reusing the incomplete download
                sleep "$WAIT"; attempt=$((attempt + 1)); continue
              fi
              break
            done
            if [ "$rc" -eq 75 ]; then
              echo "::warning::$market data not ready on Yahoo yet; nothing committed, the next 2-hourly run retries"
            elif [ "$rc" -ne 0 ]; then echo "::error::$market failed (exit $rc)"; status=1; fi
            echo "::endgroup::"
          done
          exit $status
      - name: Signal alert
        # One message per signal file this run committed (new day or revision); a run that
        # committed nothing sends nothing. Trial (push) runs only print the message.
        if: ${{ !cancelled() && steps.ledger.outcome == 'success' }}
        working-directory: trading
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SINCE: ${{ steps.ledger.outputs.head }}
          BRANCH: ${{ steps.m.outputs.branch }}
          FLAGS: ${{ steps.m.outputs.branch != 'paper-trading' && '--dry-run' || '' }} ${{ github.event.inputs.alert_test == 'true' && '--latest' || '' }}
        run: |
          for market in $ALERT_MARKETS; do
            python tools/signal_alert.py --ledger ../ledger/paper --market "$market" --since "$SINCE" \
              --report-url "https://github.com/$GH_REPO/blob/$BRANCH/paper/$market/report.md" $FLAGS
          done
      - name: Summary
        if: always()
        run: |
          for f in ledger/paper/*/report.md; do [ -f "$f" ] && { echo "===== $f"; cat "$f"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; }; done
