<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a56db" />
<meta name="robots" content="noindex" />
<link rel="icon" href="/beomstar_git/language-teacher/icons/favicon-32.png" type="image/png" sizes="32x32" />
<title>페이지를 찾을 수 없어요 · 랭귀지 스타터</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; background: linear-gradient(135deg, #1e3a8a, #1a56db 60%, #3b82f6); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif; color: #1e293b; }
  main { background: #f8fafc; border-radius: 22px; max-width: 420px; width: 100%; padding: 26px 20px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
  .ico { font-size: 48px; }
  h1 { font-size: 19px; margin: 10px 0 6px; }
  p { font-size: 14px; line-height: 1.7; color: #64748b; margin: 0 0 16px; }
  a.btn { display: block; background: #1a56db; color: #fff; text-decoration: none; font-weight: 800; border-radius: 14px; padding: 13px; margin-top: 8px; }
  a.ghost { background: #fff; color: #1a56db; border: 1.5px solid #1a56db; }
</style>
</head>
<body>
<main>
  <div class="ico">🧭</div>
  <h1>앗, 이 주소에는 페이지가 없어요</h1>
  <p>주소가 바뀌었거나 한 글자가 틀렸을 수 있어요.<br>학습 기록은 그대로 있어요.</p>
  <a class="btn" href="/beomstar_git/language-teacher/">🚀 랭귀지 스타터 열기</a>
  <a class="btn ghost" href="/beomstar_git/">처음 화면으로</a>
</main>
<script>
  // 비슷한 주소면 알맞은 곳으로 바로 보내기(대소문자·옛 이름)
  (function () {
    var p = location.pathname.toLowerCase();
    var to = /language-?teacher|starter/.test(p) ? '/beomstar_git/language-teacher/'
      : /daily-?english|quest/.test(p) ? '/beomstar_git/daily-english-quest/'
      : /chinese|nihao/.test(p) ? '/beomstar_git/chinese-teacher/'
      : /spanish|hola/.test(p) ? '/beomstar_git/spanish-teacher/'
      : /english-?teacher|emma/.test(p) ? '/beomstar_git/english-teacher/' : '';
    if (to && p.indexOf(to) !== 0) location.replace(to + location.search);
  })();
</script>
</body>
</html>
