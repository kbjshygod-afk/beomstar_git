<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>니하오 중국어 - 왕초보 기초 회화</title>
    <style>
        :root {
            --primary: #d92332;
            --primary-dark: #a01526;
            --gold: #f0a500;
            --gold-light: #fff4d6;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --red-soft: #fdf0f0;
            --hanzi-font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Malgun Gothic", sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
            background: linear-gradient(135deg, #b31217 0%, #e52d27 55%, #f0a500 130%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            color: var(--text);
        }
        .app {
            width: 100%; max-width: 680px;
            background: var(--bg);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            overflow: hidden;
            display: flex; flex-direction: column;
            height: 94vh; max-height: 860px;
        }
        /* ── Header ─────────────────────────── */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; padding: 14px 20px;
            display: flex; align-items: center; gap: 12px;
            flex-shrink: 0;
        }
        .avatar {
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.2); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; flex-shrink: 0;
        }
        .header h1 { font-size: 17px; font-weight: 700; }
        .header p  { font-size: 11.5px; opacity: 0.85; margin-top: 2px; }
        .header-right { margin-left: auto; text-align: right; font-size: 12px; line-height: 1.5; white-space: nowrap; }
        /* ── Content ────────────────────────── */
        .content { flex: 1; overflow-y: auto; padding: 16px; }
        .content::-webkit-scrollbar { width: 6px; }
        .content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        /* ── Tab bar ────────────────────────── */
        .tabbar {
            display: flex; border-top: 1px solid var(--border);
            background: var(--card); flex-shrink: 0;
        }
        .tab {
            flex: 1; padding: 9px 4px 10px; text-align: center;
            font-size: 11px; color: var(--text-light); cursor: pointer;
            border: none; background: none; font-family: inherit;
            position: relative;
        }
        .tab .ico { display: block; font-size: 20px; margin-bottom: 2px; }
        .tab.active { color: var(--primary); font-weight: 700; }
        .tab .badge {
            position: absolute; top: 3px; right: calc(50% - 24px);
            background: var(--error); color: white; font-size: 10px; font-weight: 700;
            min-width: 17px; height: 17px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center; padding: 0 4px;
        }
        /* ── Common cards ───────────────────── */
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; margin-bottom: 12px;
        }
        .section-title { font-size: 14px; font-weight: 700; margin: 18px 0 10px; color: var(--text); }
        .muted { color: var(--text-light); font-size: 12.5px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: var(--primary); color: white; border: none;
            padding: 12px 20px; border-radius: 12px; font-size: 15px; font-weight: 700;
            cursor: pointer; font-family: inherit; transition: transform .08s, opacity .15s;
        }
        .btn:active { transform: scale(0.97); }
        .btn.block { width: 100%; }
        .btn.ghost { background: white; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn.gray { background: #eef2f7; color: var(--text); }
        .btn.small { padding: 8px 14px; font-size: 13px; border-radius: 10px; }
        .btn:disabled { opacity: .45; cursor: default; }
        .play-btn {
            background: var(--red-soft); border: 1px solid #f3cdd1; color: var(--primary);
            width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
            font-size: 14px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .play-btn:active { transform: scale(.92); }
        .play-btn.slow { font-size: 15px; }
        /* ── Home ───────────────────────────── */
        .stats-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .stat {
            flex: 1; background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 10px 6px; text-align: center;
        }
        .stat .num { font-size: 17px; font-weight: 800; color: var(--primary); }
        .stat .lbl { font-size: 10.5px; color: var(--text-light); margin-top: 2px; }
        .continue-card {
            background: linear-gradient(135deg, var(--primary), #e8542f);
            color: white; border-radius: 16px; padding: 16px; margin-bottom: 6px;
            cursor: pointer;
        }
        .continue-card .cc-label { font-size: 11px; opacity: .85; }
        .continue-card .cc-title { font-size: 17px; font-weight: 800; margin: 4px 0 2px; }
        .continue-card .cc-goal { font-size: 12px; opacity: .9; }
        .guide-banner {
            background: var(--gold-light); border: 1px solid #f2d98c;
            border-radius: 12px; padding: 10px 14px; font-size: 13px;
            margin: 10px 0 4px; cursor: pointer; color: #7a5b00; font-weight: 600;
        }
        .unit-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
        .unit-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
        .unit-icon {
            width: 44px; height: 44px; border-radius: 12px; background: var(--red-soft);
            display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
        }
        .unit-head .u-title { font-size: 15px; font-weight: 700; }
        .unit-head .u-sub { font-size: 11.5px; color: var(--text-light); margin-top: 2px; }
        .unit-right { margin-left: auto; text-align: right; flex-shrink: 0; }
        .unit-right .u-prog { font-size: 12px; font-weight: 700; color: var(--primary); }
        .unit-right .chev { font-size: 11px; color: var(--text-light); }
        .prog-bar { height: 5px; background: #f1f5f9; }
        .prog-bar > div { height: 100%; background: linear-gradient(90deg, var(--primary), var(--gold)); transition: width .3s; }
        .lesson-list { border-top: 1px solid var(--border); }
        .lesson-row {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
        }
        .lesson-row:last-child { border-bottom: none; }
        .lesson-row.locked { opacity: .5; cursor: default; }
        .lesson-num {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
            background: #eef2f7; color: var(--text-light);
        }
        .lesson-row.done .lesson-num { background: var(--success); color: white; }
        .lesson-row.current .lesson-num { background: var(--primary); color: white; }
        .lesson-row .l-title { font-size: 14px; font-weight: 600; }
        .lesson-row .l-goal { font-size: 11.5px; color: var(--text-light); margin-top: 1px; }
        .lesson-row .l-state { margin-left: auto; font-size: 15px; flex-shrink: 0; }
        /* ── Lesson view ────────────────────── */
        .lesson-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .back-btn {
            background: white; border: 1px solid var(--border); border-radius: 10px;
            width: 34px; height: 34px; font-size: 16px; cursor: pointer; flex-shrink: 0;
        }
        .lesson-top .lt-title { font-size: 16px; font-weight: 800; }
        .lesson-top .lt-sub { font-size: 11.5px; color: var(--text-light); }
        .steps { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
        .step-chip {
            padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
            background: white; border: 1.5px solid var(--border); color: var(--text-light);
            cursor: pointer; font-family: inherit;
        }
        .step-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
        .step-chip.done { border-color: var(--success); color: var(--success); }
        .word-row {
            display: flex; align-items: center; gap: 12px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
        }
        .word-main { flex: 1; min-width: 0; }
        .hanzi { font-family: var(--hanzi-font); font-weight: 600; }
        .word-row .hanzi { font-size: 24px; }
        .word-row .pinyin { font-size: 13px; color: var(--primary); font-weight: 600; margin-top: 1px; }
        .word-row .kopron { font-size: 11.5px; color: #b07b00; margin-top: 1px; }
        .word-row .ko { font-size: 13px; color: var(--text-light); margin-top: 2px; }
        .word-btns { display: flex; gap: 6px; flex-shrink: 0; }
        .sent-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .sent-card .hanzi { font-size: 20px; line-height: 1.5; }
        .sent-card .pinyin { font-size: 13.5px; color: var(--primary); font-weight: 600; margin-top: 3px; }
        .sent-card .kopron { font-size: 12px; color: #b07b00; margin-top: 2px; }
        .sent-card .ko { font-size: 13.5px; color: var(--text); margin-top: 5px; }
        .sent-card .note { font-size: 12px; color: var(--text-light); margin-top: 6px; background: #f8fafc; border-radius: 8px; padding: 7px 10px; }
        .sent-head { display: flex; align-items: flex-start; gap: 10px; }
        .sent-head .word-btns { margin-left: auto; }
        .tip-box {
            background: var(--gold-light); border: 1px solid #f2d98c; border-radius: 12px;
            padding: 12px 14px; font-size: 13px; margin: 14px 0 8px; line-height: 1.6;
        }
        .tip-box b { color: #7a5b00; }
        .culture-box {
            background: #eef6ff; border: 1px solid #cfe3fa; border-radius: 12px;
            padding: 12px 14px; font-size: 13px; margin: 14px 0 8px; line-height: 1.6;
        }
        /* dialogue */
        .dlg-situation { font-size: 12.5px; color: var(--text-light); background: white; border: 1px dashed var(--border); border-radius: 10px; padding: 9px 12px; margin-bottom: 12px; }
        .bubble-row { display: flex; margin-bottom: 10px; gap: 8px; }
        .bubble-row.right { flex-direction: row-reverse; }
        .bubble-ava {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 16px;
            background: #eef2f7;
        }
        .bubble-row.right .bubble-ava { background: var(--red-soft); }
        .bubble { max-width: 82%; border-radius: 14px; padding: 10px 12px; cursor: pointer; }
        .bubble-row.left  .bubble { background: white; border: 1px solid var(--border); border-top-left-radius: 4px; }
        .bubble-row.right .bubble { background: var(--red-soft); border: 1px solid #f3cdd1; border-top-right-radius: 4px; }
        .bubble .b-name { font-size: 10.5px; color: var(--text-light); margin-bottom: 3px; font-weight: 700; }
        .bubble .hanzi { font-size: 17px; line-height: 1.45; }
        .bubble .pinyin { font-size: 12px; color: var(--primary); font-weight: 600; margin-top: 2px; }
        .bubble .ko { font-size: 12px; color: var(--text-light); margin-top: 3px; }
        /* grammar */
        .gram-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
        .gram-card .g-title { font-size: 14.5px; font-weight: 800; margin-bottom: 6px; }
        .gram-card .g-explain { font-size: 13px; line-height: 1.65; color: var(--text); white-space: pre-line; }
        .gram-ex { display: flex; align-items: center; gap: 10px; background: #f8fafc; border-radius: 10px; padding: 9px 11px; margin-top: 8px; }
        .gram-ex .hanzi { font-size: 16px; }
        .gram-ex .pinyin { font-size: 11.5px; color: var(--primary); font-weight: 600; }
        .gram-ex .ko { font-size: 11.5px; color: var(--text-light); }
        /* ── Quiz ───────────────────────────── */
        .quiz-prog { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .quiz-prog .qp-bar { flex: 1; height: 8px; background: #eef2f7; border-radius: 4px; overflow: hidden; }
        .quiz-prog .qp-bar > div { height: 100%; background: var(--primary); transition: width .25s; }
        .quiz-prog .qp-txt { font-size: 12px; font-weight: 700; color: var(--text-light); white-space: nowrap; }
        .quiz-q { font-size: 15.5px; font-weight: 700; line-height: 1.5; margin-bottom: 14px; }
        .quiz-audio { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
        .quiz-audio .btn { border-radius: 999px; }
        .choice-btn {
            display: block; width: 100%; text-align: left;
            background: var(--card); border: 1.5px solid var(--border); border-radius: 12px;
            padding: 13px 14px; font-size: 14.5px; margin-bottom: 8px; cursor: pointer;
            font-family: inherit; color: var(--text); transition: border-color .12s;
        }
        .choice-btn .hanzi { font-size: 16px; }
        .choice-btn:not(:disabled):hover { border-color: #cbd5e1; }
        .choice-btn.correct { border-color: var(--success); background: #ecfdf5; font-weight: 700; }
        .choice-btn.wrong { border-color: var(--error); background: #fef2f2; }
        .choice-btn:disabled { cursor: default; }
        .arrange-area {
            min-height: 54px; background: var(--card); border: 1.5px dashed var(--border);
            border-radius: 12px; padding: 9px; margin-bottom: 12px;
            display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
        }
        .arrange-area.ok { border-color: var(--success); background: #ecfdf5; }
        .arrange-area.bad { border-color: var(--error); background: #fef2f2; }
        .token {
            background: var(--red-soft); border: 1px solid #f3cdd1; color: var(--text);
            border-radius: 10px; padding: 8px 13px; font-size: 17px; cursor: pointer;
            font-family: var(--hanzi-font); font-weight: 600;
        }
        .token-bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .token-bank .token { background: white; border: 1.5px solid var(--border); }
        .token-bank .token.used { opacity: .25; pointer-events: none; }
        .explain-box {
            border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.6; margin: 12px 0;
        }
        .explain-box.good { background: #ecfdf5; border: 1px solid #b7e4d0; }
        .explain-box.bad  { background: #fef2f2; border: 1px solid #f5c6c6; }
        .explain-box .eb-head { font-weight: 800; margin-bottom: 4px; font-size: 14px; }
        .explain-box .eb-answer { margin: 6px 0; }
        .explain-box .hanzi { font-size: 16px; }
        /* quiz result */
        .result-hero { text-align: center; padding: 26px 10px 18px; }
        .result-hero .r-emoji { font-size: 52px; }
        .result-hero .r-score { font-size: 34px; font-weight: 900; margin: 8px 0 2px; }
        .result-hero .r-msg { font-size: 14px; color: var(--text-light); }
        .wrong-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; font-size: 13px; }
        .wrong-item .hanzi { font-size: 15px; }
        /* ── SRS review ─────────────────────── */
        .flash-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 20px;
            padding: 40px 20px; text-align: center; margin-bottom: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }
        .flash-card .hanzi { font-size: 46px; }
        .flash-card .pinyin { font-size: 19px; color: var(--primary); font-weight: 700; margin-top: 10px; }
        .flash-card .kopron { font-size: 14px; color: #b07b00; margin-top: 4px; }
        .flash-card .ko { font-size: 17px; margin-top: 10px; }
        .grade-row { display: flex; gap: 10px; }
        .grade-row .btn { flex: 1; }
        .btn.fail { background: #fef2f2; color: var(--error); border: 1.5px solid #f5c6c6; }
        .btn.pass { background: #ecfdf5; color: #067a57; border: 1.5px solid #b7e4d0; }
        /* ── Tone trainer ───────────────────── */
        .tone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .tone-cell { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; text-align: center; }
        .tone-cell .t-name { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
        .tone-cell .t-desc { font-size: 11px; color: var(--text-light); margin-bottom: 6px; }
        .tone-cell svg { width: 100%; height: 46px; }
        .tone-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tone-choice .choice-btn { text-align: center; margin-bottom: 0; }
        /* ── Guide ──────────────────────────── */
        .guide-step { display: flex; gap: 12px; margin-bottom: 12px; }
        .guide-step .gs-num {
            width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: white;
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0;
        }
        .guide-step .gs-body b { font-size: 14px; }
        .guide-step .gs-body p { font-size: 12.5px; color: var(--text-light); margin-top: 3px; line-height: 1.55; }
        .road-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .road-row:last-child { border-bottom: none; }
        .road-row .rr-badge {
            background: var(--red-soft); color: var(--primary); font-weight: 800; font-size: 11px;
            border-radius: 8px; padding: 4px 8px; white-space: nowrap; flex-shrink: 0;
        }
        .road-row.now .rr-badge { background: var(--primary); color: white; }
        .road-row .rr-desc { color: var(--text-light); font-size: 11.5px; margin-top: 1px; }
        /* ── Settings ───────────────────────── */
        .set-row { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid #f1f5f9; }
        .set-row:last-child { border-bottom: none; }
        .set-row .s-title { font-size: 14px; font-weight: 600; }
        .set-row .s-desc { font-size: 11.5px; color: var(--text-light); margin-top: 2px; }
        .set-row .s-ctl { margin-left: auto; flex-shrink: 0; }
        .switch { position: relative; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider {
            position: absolute; inset: 0; background: #cbd5e1; border-radius: 13px;
            transition: .2s; cursor: pointer;
        }
        .switch .slider:before {
            content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%;
            background: white; top: 3px; left: 3px; transition: .2s;
        }
        .switch input:checked + .slider { background: var(--success); }
        .switch input:checked + .slider:before { transform: translateX(20px); }
        input[type=range] { width: 130px; accent-color: var(--primary); }
        .notice {
            background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px;
            padding: 10px 14px; font-size: 12.5px; color: #9a3412; margin-bottom: 12px; line-height: 1.5;
        }
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-light); font-size: 14px; line-height: 1.7; }
        .empty-state .es-emoji { font-size: 46px; margin-bottom: 10px; }
        @media (max-width: 480px) {
            body { padding: 0; }
            .app { border-radius: 0; height: 100vh; max-height: none; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="avatar">🐼</div>
        <div>
            <h1>니하오 중국어</h1>
            <p>왕초보를 위한 기초 회화 · 발음부터 여행 회화까지</p>
        </div>
        <div class="header-right" id="headerStats"></div>
    </div>
    <div class="content" id="main"></div>
    <div class="tabbar" id="tabbar"></div>
</div>

<script src="data.js"></script>
<script>
'use strict';
/* ═══════════════════ 데이터 준비 ═══════════════════ */
const DATA = (window.ZW_DATA && window.ZW_DATA.units) ? window.ZW_DATA : null;
const UNITS = DATA ? DATA.units : [];
const ALL = UNITS.flatMap(u => u.lessons.map(l => ({ ...l, unitId: u.unitId, unitTitle: u.title, unitIcon: u.icon })));
const LESSON_BY_ID = Object.fromEntries(ALL.map((l, i) => [l.id, i]));
const PASS_RATE = 0.7;
const SRS_INTERVALS = { 1: 1, 2: 2, 3: 4, 4: 7, 5: 15 };  // box → days
const STEP_NAMES = ['단어', '핵심 문장', '회화', '문법', '퀴즈'];

/* ═══════════════════ 저장소 ═══════════════════ */
const LS_KEY = 'nihao_zh_v1';
let store = loadStore();
function loadStore() {
    let d = {};
    try { d = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { d = {}; }
    return {
        completed: d.completed || {},          // lessonId → {score,total,date}
        srs: d.srs || {},                      // key → {hanzi,pinyin,ko,koPron,box,due}
        streak: d.streak || { last: '', count: 0 },
        settings: Object.assign({ koPron: true, rate: 1, freeNav: false }, d.settings || {}),
    };
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(store)); }
function todayStr(offset = 0) {
    const d = new Date(); d.setDate(d.getDate() + offset);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function touchStreak() {
    const t = todayStr(), y = todayStr(-1), s = store.streak;
    if (s.last === t) return;
    s.count = (s.last === y) ? s.count + 1 : 1;
    s.last = t; save();
}

/* ═══════════════════ 유틸 ═══════════════════ */
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function mulberry32(seed) {
    return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
function seededShuffle(arr, seed) {
    const a = arr.slice(), rnd = mulberry32(seed);
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }

/* ═══════════════════ TTS (중국어 발음) ═══════════════════ */
let zhVoice = null;
function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
}
function ttsAvailable() { return 'speechSynthesis' in window; }
function stopSpeak() { if (ttsAvailable()) speechSynthesis.cancel(); }
function speak(text, rate = 1) {
    if (!ttsAvailable()) return;
    stopSpeak();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    if (zhVoice) u.voice = zhVoice;
    u.rate = Math.max(0.4, rate * store.settings.rate);
    speechSynthesis.speak(u);
}
let seqPlaying = false;
function speakSeq(texts, onDone) {
    if (!ttsAvailable()) return;
    stopSpeak(); seqPlaying = true;
    let i = 0;
    const next = () => {
        if (!seqPlaying || i >= texts.length) { seqPlaying = false; if (onDone) onDone(); return; }
        const u = new SpeechSynthesisUtterance(texts[i++]);
        u.lang = 'zh-CN'; if (zhVoice) u.voice = zhVoice;
        u.rate = 0.92 * store.settings.rate;
        u.onend = () => setTimeout(next, 420);
        u.onerror = () => { seqPlaying = false; if (onDone) onDone(); };
        speechSynthesis.speak(u);
    };
    next();
}

/* ═══════════════════ 진행 상태 헬퍼 ═══════════════════ */
function isDone(id) { return !!store.completed[id]; }
function isUnlocked(idx) {
    if (store.settings.freeNav) return true;
    if (idx === 0) return true;
    return isDone(ALL[idx - 1].id);
}
function nextLessonIdx() {
    for (let i = 0; i < ALL.length; i++) if (!isDone(ALL[i].id)) return i;
    return -1;
}
function doneCount() { return ALL.filter(l => isDone(l.id)).length; }
function srsKey(w) { return w.hanzi + '|' + (w.pinyin || ''); }
function dueCards() {
    const t = todayStr();
    return Object.entries(store.srs).filter(([, c]) => c.due <= t).map(([k, c]) => ({ key: k, ...c }));
}
function addWordsToSrs(lesson) {
    const t = todayStr();
    (lesson.words || []).forEach(w => {
        const k = srsKey(w);
        if (!store.srs[k]) store.srs[k] = { hanzi: w.hanzi, pinyin: w.pinyin, ko: w.ko, koPron: w.koPron || '', box: 1, due: t };
    });
    save();
}

/* ═══════════════════ 퀴즈 엔진 ═══════════════════ */
function renderQuiz(body, l) {
    if (!S.quiz) {
        const done = store.completed[l.id];
        body.innerHTML = '<div class="card" style="text-align:center;padding:28px 18px">' +
            '<div style="font-size:44px">📝</div>' +
            '<div style="font-size:17px;font-weight:800;margin:10px 0 4px">확인 퀴즈</div>' +
            '<div class="muted">총 ' + (l.quiz || []).length + '문항 · ' + Math.round(PASS_RATE * 100) + '% 이상 맞히면 통과!<br>통과하면 이 레슨의 단어가 복습함에 자동으로 담겨요.</div>' +
            (done ? '<div style="margin-top:8px;font-size:13px;color:var(--success);font-weight:700">✅ 이미 통과한 레슨이에요 (최고 ' + done.score + '/' + done.total + '점) — 다시 풀어도 좋아요!</div>' : '') +
            '<button class="btn" id="startQuiz" style="margin-top:16px">퀴즈 시작하기</button></div>';
        document.getElementById('startQuiz').addEventListener('click', () => {
            S.quiz = { i: 0, score: 0, answered: false, wrong: [], sel: [] };
            renderQuiz(body, l);
        });
        return;
    }
    const q = S.quiz;
    const items = l.quiz || [];
    if (q.i >= items.length) { renderQuizResult(body, l); return; }
    const item = items[q.i];
    const seed = hashStr(l.id) + q.i * 97;

    let h = '<div class="quiz-prog"><div class="qp-bar"><div style="width:' + (q.i / items.length * 100) + '%"></div></div>' +
        '<div class="qp-txt">' + (q.i + 1) + ' / ' + items.length + '</div></div>';
    h += '<div class="quiz-q">' + esc(item.q) + '</div>';

    if (item.type === 'listen' || item.type === 'tone') {
        h += '<div class="quiz-audio">' +
            '<button class="btn small" id="qPlay">🔊 듣기</button>' +
            '<button class="btn small ghost" id="qPlaySlow">🐢 느리게</button></div>';
    }
    if (item.type === 'arrange') {
        h += '<div class="arrange-area" id="arrArea">' +
            (q.sel.length ? q.sel.map((t, i) => '<span class="token" data-sel="' + i + '">' + esc(t) + '</span>').join('') :
                '<span class="muted" style="padding:4px 6px">아래 단어를 순서대로 눌러 문장을 만드세요</span>') + '</div>';
        const bank = seededShuffle(item.tokens.map((t, i) => ({ t, i })), seed);
        h += '<div class="token-bank">' + bank.map(b => {
            const used = q.selSrc && q.selSrc.includes(b.i);
            return '<span class="token' + (used ? ' used' : '') + '" data-bank="' + b.i + '">' + esc(b.t) + '</span>';
        }).join('') + '</div>';
        h += '<button class="btn block" id="arrCheck"' + (q.sel.length === item.tokens.length ? '' : ' disabled') + '>확인하기</button>';
    } else {
        const tone = item.type === 'tone';
        h += '<div class="' + (tone ? 'tone-choice' : '') + '">';
        item.choices.forEach((c, ci) => {
            h += '<button class="choice-btn" data-choice="' + ci + '"><span class="hanzi">' + esc(c) + '</span></button>';
        });
        h += '</div>';
    }
    h += '<div id="qFeedback"></div>';
    body.innerHTML = h;

    const playText = item.hanzi || '';
    const qp = document.getElementById('qPlay');
    if (qp) { qp.addEventListener('click', () => speak(playText, 0.95)); }
    const qps = document.getElementById('qPlaySlow');
    if (qps) { qps.addEventListener('click', () => speak(playText, 0.55)); }

    if (item.type === 'arrange') {
        if (!q.selSrc) q.selSrc = [];
        body.querySelectorAll('[data-bank]').forEach(el => el.addEventListener('click', () => {
            if (q.answered) return;
            const bi = parseInt(el.dataset.bank, 10);
            if (q.selSrc.includes(bi)) return;
            q.sel.push(item.tokens[bi]); q.selSrc.push(bi);
            renderQuiz(body, l);
        }));
        body.querySelectorAll('[data-sel]').forEach(el => el.addEventListener('click', () => {
            if (q.answered) return;
            const si = parseInt(el.dataset.sel, 10);
            q.sel.splice(si, 1); q.selSrc.splice(si, 1);
            renderQuiz(body, l);
        }));
        const ck = document.getElementById('arrCheck');
        if (ck) ck.addEventListener('click', () => {
            if (q.answered) return;
            const user = q.sel.join('');
            const answer = item.tokens.join('');
            const ok = user === answer;
            ck.disabled = true;
            answerFeedback(ok, item,
                '<div class="eb-answer">정답: <span class="hanzi">' + esc(answer) + '</span><br>' +
                '<span style="color:var(--primary);font-weight:600">' + esc(item.pinyin || '') + '</span></div>');
        });
    } else {
        body.querySelectorAll('[data-choice]').forEach(el => el.addEventListener('click', () => {
            const ci = parseInt(el.dataset.choice, 10);
            const ok = ci === item.answer;
            body.querySelectorAll('[data-choice]').forEach((b, bi) => {
                b.disabled = true;
                if (bi === item.answer) b.classList.add('correct');
                else if (bi === ci && !ok) b.classList.add('wrong');
            });
            answerFeedback(ok, item, '');
        }));
    }

    function answerFeedback(ok, item, extraHtml) {
        if (q.answered) return;
        q.answered = true;
        if (ok) q.score++;
        else q.wrong.push({ item, idx: q.i });
        if (item.type === 'arrange') { if (ok) speak(item.tokens.join(''), 0.95); }
        else if (ok && (item.type === 'listen' || item.type === 'tone')) speak(item.hanzi, 0.95);
        const fb = document.getElementById('qFeedback');
        fb.innerHTML = '<div class="explain-box ' + (ok ? 'good' : 'bad') + '">' +
            '<div class="eb-head">' + (ok ? '⭕ 정답이에요!' : '❌ 아쉬워요!') + '</div>' + extraHtml +
            ((item.hanzi && item.type !== 'arrange') ? '<div class="eb-answer"><span class="hanzi">' + esc(item.hanzi) + '</span> <span style="color:var(--primary);font-weight:600">' + esc(item.pinyin || '') + '</span></div>' : '') +
            esc(item.explain || '') + '</div>' +
            '<button class="btn block" id="qNext">' + (q.i + 1 >= items.length ? '결과 보기' : '다음 문제 →') + '</button>';
        const arr = document.getElementById('arrArea');
        if (arr) arr.classList.add(ok ? 'ok' : 'bad');
        document.getElementById('qNext').addEventListener('click', () => {
            q.i++; q.answered = false; q.sel = []; q.selSrc = [];
            renderQuiz(body, l);
        });
        fb.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
}

function renderQuizResult(body, l) {
    const q = S.quiz;
    const items = l.quiz || [];
    const total = items.length;
    const pass = q.score / total >= PASS_RATE;
    if (pass) {
        const prev = store.completed[l.id];
        if (!prev || q.score > prev.score) store.completed[l.id] = { score: q.score, total, date: todayStr() };
        else store.completed[l.id].date = todayStr();
        addWordsToSrs(l);
        touchStreak();
        save();
    }
    const gIdx = S.lessonIdx;
    const hasNext = gIdx + 1 < ALL.length;
    let h = '<div class="result-hero">' +
        '<div class="r-emoji">' + (pass ? (q.score === total ? '🏆' : '🎉') : '💪') + '</div>' +
        '<div class="r-score" style="color:' + (pass ? 'var(--success)' : 'var(--error)') + '">' + q.score + ' / ' + total + '</div>' +
        '<div class="r-msg">' + (pass ?
            (q.score === total ? '완벽해요! 만점입니다!' : '통과! 잘하고 있어요 👏') + '<br>이 레슨 단어들이 복습함에 담겼어요.' :
            Math.round(PASS_RATE * 100) + '% 이상 맞혀야 통과예요.<br>단어와 회화를 다시 보고 도전해 보세요!') + '</div></div>';

    if (q.wrong.length) {
        h += '<div class="section-title">틀린 문제 다시 보기</div>';
        q.wrong.forEach(w => {
            const it = w.item;
            h += '<div class="wrong-item"><b>Q' + (w.idx + 1) + '.</b> ' + esc(it.q) +
                (it.hanzi ? '<div style="margin-top:5px"><span class="hanzi">' + esc(it.hanzi) + '</span> <span style="color:var(--primary)">' + esc(it.pinyin || '') + '</span></div>' : '') +
                (it.type === 'arrange' ? '<div style="margin-top:5px">정답: <span class="hanzi">' + esc(it.tokens.join('')) + '</span></div>' :
                    '<div style="margin-top:5px">정답: <b>' + esc(it.choices[it.answer]) + '</b></div>') +
                '<div class="muted" style="margin-top:4px">' + esc(it.explain || '') + '</div></div>';
        });
    }
    h += '<div style="display:flex;gap:10px;margin-top:14px">';
    if (pass) {
        if (hasNext) h += '<button class="btn block" id="rNext">다음 레슨 →</button>';
        h += '<button class="btn block ' + (hasNext ? 'ghost' : '') + '" id="rHome">학습 경로로</button>';
    } else {
        h += '<button class="btn block" id="rRetry">다시 도전!</button>' +
            '<button class="btn block ghost" id="rStudy">단어 다시 보기</button>';
    }
    h += '</div>';
    body.innerHTML = h;
    const rn = document.getElementById('rNext');
    if (rn) rn.addEventListener('click', () => openLesson(gIdx + 1));
    const rh = document.getElementById('rHome');
    if (rh) rh.addEventListener('click', () => { S.quiz = null; go('home'); });
    const rr = document.getElementById('rRetry');
    if (rr) rr.addEventListener('click', () => { S.quiz = { i: 0, score: 0, answered: false, wrong: [], sel: [], selSrc: [] }; renderQuiz(body, l); });
    const rs = document.getElementById('rStudy');
    if (rs) rs.addEventListener('click', () => { S.quiz = null; S.step = 0; renderStep(); });
}

function renderReview() {
    if (!S.review) {
        const due = dueCards();
        const totalCards = Object.keys(store.srs).length;
        if (!totalCards) {
            $main.innerHTML = '<div class="empty-state"><div class="es-emoji">🃏</div><b>아직 복습할 단어가 없어요</b><br>레슨 퀴즈를 통과하면 배운 단어가<br>자동으로 복습함에 담깁니다!</div>';
            return;
        }
        if (!due.length) {
            const boxes = [0, 0, 0, 0, 0];
            Object.values(store.srs).forEach(c => boxes[c.box - 1]++);
            $main.innerHTML = '<div class="empty-state"><div class="es-emoji">🎉</div><b>오늘 복습 끝!</b><br>모든 단어를 복습했어요. 내일 또 만나요.<br><br>' +
                '<div class="muted">단어함 현황 — 총 ' + totalCards + '장<br>' +
                boxes.map((b, i) => (i + 1) + '단계 ' + b + '장').join(' · ') + '</div></div>';
            return;
        }
        $main.innerHTML = '<div class="card" style="text-align:center;padding:28px 18px">' +
            '<div style="font-size:44px">🃏</div>' +
            '<div style="font-size:17px;font-weight:800;margin:10px 0 4px">오늘의 복습</div>' +
            '<div class="muted">복습 대기 <b>' + due.length + '장</b> · 총 보유 ' + totalCards + '장<br>' +
            '과학적 간격 반복(SRS)으로 잊기 직전에 다시 만나요.<br>기억했으면 다음 단계로, 못 했으면 1단계부터 다시!</div>' +
            '<button class="btn" id="startReview" style="margin-top:16px">복습 시작 (' + due.length + '장)</button></div>';
        document.getElementById('startReview').addEventListener('click', () => {
            S.review = { queue: seededShuffle(due, hashStr(todayStr())), i: 0, flipped: false, okCnt: 0, failCnt: 0 };
            renderReview();
        });
        return;
    }
    const r = S.review;
    if (r.i >= r.queue.length) {
        touchStreak();
        $main.innerHTML = '<div class="result-hero"><div class="r-emoji">🎉</div>' +
            '<div class="r-score" style="color:var(--success)">' + r.okCnt + ' / ' + (r.okCnt + r.failCnt) + '</div>' +
            '<div class="r-msg">오늘의 복습 완료! 기억한 카드는 더 긴 간격으로,<br>놓친 카드는 내일 다시 만나요.</div></div>' +
            '<button class="btn block" id="revHome">학습 경로로</button>';
        document.getElementById('revHome').addEventListener('click', () => { S.review = null; go('home'); });
        return;
    }
    const c = r.queue[r.i];
    let h = '<div class="quiz-prog"><div class="qp-bar"><div style="width:' + (r.i / r.queue.length * 100) + '%"></div></div>' +
        '<div class="qp-txt">' + (r.i + 1) + ' / ' + r.queue.length + '</div></div>';
    h += '<div class="flash-card"><div class="hanzi">' + esc(c.hanzi) + '</div>';
    if (r.flipped) {
        h += '<div class="pinyin">' + esc(c.pinyin) + '</div>' +
            (store.settings.koPron && c.koPron ? '<div class="kopron">[' + esc(c.koPron) + ']</div>' : '') +
            '<div class="ko">' + esc(c.ko) + '</div>';
    }
    h += '<div style="margin-top:14px"><button class="play-btn" id="fcPlay" style="width:44px;height:44px;font-size:18px">▶</button> ' +
        '<button class="play-btn slow" id="fcPlaySlow" style="width:44px;height:44px;font-size:18px">🐢</button></div></div>';
    if (!r.flipped) {
        h += '<button class="btn block" id="fcFlip">뜻 확인하기</button>' +
            '<div class="muted" style="text-align:center;margin-top:10px">발음을 듣고, 뜻을 먼저 떠올려 본 다음 확인하세요!</div>';
    } else {
        h += '<div class="grade-row">' +
            '<button class="btn fail" id="fcFail">❌ 몰랐어요</button>' +
            '<button class="btn pass" id="fcPass">✅ 기억했어요</button></div>' +
            '<div class="muted" style="text-align:center;margin-top:10px">현재 ' + c.box + '단계 → 기억하면 ' + Math.min(5, c.box + 1) + '단계 (' + SRS_INTERVALS[Math.min(5, c.box + 1)] + '일 뒤)</div>';
    }
    $main.innerHTML = h;
    document.getElementById('fcPlay').addEventListener('click', () => speak(c.hanzi, 0.95));
    document.getElementById('fcPlaySlow').addEventListener('click', () => speak(c.hanzi, 0.55));
    const ff = document.getElementById('fcFlip');
    if (ff) ff.addEventListener('click', () => { r.flipped = true; renderReview(); });
    const fp = document.getElementById('fcPass');
    if (fp) fp.addEventListener('click', () => grade(true));
    const fl = document.getElementById('fcFail');
    if (fl) fl.addEventListener('click', () => grade(false));

    function grade(ok) {
        const card = store.srs[c.key];
        if (card) {
            if (ok) { card.box = Math.min(5, card.box + 1); card.due = todayStr(SRS_INTERVALS[card.box]); }
            else { card.box = 1; card.due = todayStr(1); }
            save();
        }
        if (ok) r.okCnt++; else r.failCnt++;
        r.i++; r.flipped = false;
        renderReview();
    }
}

    document.getElementById('tPlaySlow').addEventListener('click', () => speak(cur.syl.h, 0.55));

        if (ok) t.score++;
        $main.querySelectorAll('[data-tone]').forEach((bb, bi) => {
            bb.disabled = true;

            else if (bi === sel && !ok) bb.classList.add('wrong');

        document.getElementById('tFeedback').innerHTML =
            '<div class="explain-box ' + (ok ? 'good' : 'bad') + '"><div class="eb-head">' + (ok ? '⭕ 정답!' : '❌ 아쉬워요!') + '</div>' +

            '<button class="btn block" id="tNext">' + (t.i + 1 >= TOTAL ? '결과 보기' : '다음 문제 →') + '</button>';
        speak(cur.syl.h, 0.9);
        document.getElementById('tNext').addEventListener('click', () => { t.i++; t.cur = null; t.answered = false; renderTone(); });
    }));
}

        gs(1, '매일 15분, 한 레슨씩', '언어는 벼락치기가 안 돼요. 하루 한 레슨(약 15분)이면 한 달 안에 전 과정을 마칠 수 있어요. 연속 학습 🔥 기록을 지켜 보세요!') +
        gs(2, '무조건 소리 내어 따라 하기', '🔊 버튼으로 원어민 발음을 듣고, 큰 소리로 3번씩 따라 읽으세요. 눈으로만 보면 절대 입이 트이지 않아요. 🐢 느리게 듣기로 성조를 정확히!') +
        gs(3, '퀴즈로 확인하고 통과하기', '각 레슨 끝의 퀴즈를 70% 이상 맞혀야 다음 레슨이 열려요. 틀려도 괜찮아요 — 해설을 읽고 다시 도전하면 더 오래 기억에 남아요.') +
        gs(4, '복습함으로 어제 배운 걸 지키기', '통과한 레슨의 단어는 🃏 복습함에 자동 저장돼요. 과학적으로 검증된 간격 반복(SRS) 방식이라, 잊어버리기 직전에 다시 만나게 됩니다. 새 레슨보다 복습 먼저!') +
        '</div>';

    h += '<div class="section-title">🗺️ 이 앱의 커리큘럼 (표준 학습 순서)</div><div class="card">';
    UNITS.forEach(u => {
        const done = u.lessons.filter(l => isDone(l.id)).length;
        h += '<div class="road-row"><span class="rr-badge">' + u.unitId + '단계</span>' +
            '<div><b>' + esc(u.icon) + ' ' + esc(u.title) + '</b> <span class="muted">(' + done + '/' + u.lessons.length + ')</span>' +
            '<div class="rr-desc">' + esc(u.subtitle || '') + '</div></div></div>';
    });
    h += '</div>';

    h += '<div class="section-title">🏔️ 마스터가 되는 로드맵</div><div class="card">' +
        rr('지금 여기', '이 앱 전 과정 수료', '발음 + 인사 + 숫자 + 자기소개 + 일상/여행 회화 — 중국어의 뼈대 완성 (HSK 1급 수준의 회화)', true) +
        rr('다음', 'HSK 1급 단어 150개', '이 앱의 단어에 조금만 더하면 돼요. 복습함을 매일 비우는 습관이 최고의 준비!', false) +
        rr('3개월', 'HSK 2급 + 말하기 연습', '기초 문법이 완성되는 단계. 중국 드라마를 자막과 함께 보기 시작하세요.', false) +
        rr('6개월+', '실전 회화 확장', '언어 교환 친구 만들기, 중국 여행 가서 직접 말해 보기. 이 앱의 회화가 실전에서 그대로 나옵니다!', false) +
        '</div>';

    h += '<div class="tip-box"><b>💡 작심삼일 방지 3원칙</b><br>' +
        '· 같은 시간에 공부하기 (아침 커피와 함께, 자기 전 침대에서)<br>' +
        '· 완벽하려 하지 않기 — 성조가 틀려도 일단 말하면 늘어요<br>' +
        '· 배운 문장을 오늘 혼잣말로 3번 써먹기 (你好! 谢谢! 再见!)</div>';
    $main.innerHTML = h;

    function gs(n, title, desc) {
        return '<div class="guide-step"><div class="gs-num">' + n + '</div><div class="gs-body"><b>' + title + '</b><p>' + desc + '</p></div></div>';
    }
    function rr(badge, title, desc, now) {
        return '<div class="road-row' + (now ? ' now' : '') + '"><span class="rr-badge">' + badge + '</span>' +
            '<div><b>' + title + '</b><div class="rr-desc">' + desc + '</div></div></div>';
    }
}

/* ═══════════════════ 설정 ═══════════════════ */
function renderSettings() {
    const hasTTS = ttsAvailable();
    let h = '<div class="section-title" style="margin-top:0">⚙️ 설정</div>';
    if (!hasTTS) h += '<div class="notice">⚠️ 이 브라우저는 음성 합성(TTS)을 지원하지 않아 발음 듣기를 쓸 수 없어요. 크롬/엣지/사파리 최신 버전을 추천합니다.</div>';
    else if (!zhVoice) h += '<div class="notice">ℹ️ 중국어 음성이 아직 준비되지 않았어요. 발음 버튼을 한 번 누르면 준비되는 경우가 많아요. 안 되면 기기에 중국어(중국) 음성을 설치해 주세요.</div>';
    h += '<div class="card">' +
        setRow('한글 발음 표기', '병음 아래에 한글 독음 [니 하오] 표시', '<label class="switch"><input type="checkbox" id="setKoPron"' + (store.settings.koPron ? ' checked' : '') + '><span class="slider"></span></label>') +
        setRow('말하기 속도', '발음 재생 기본 속도 (' + store.settings.rate.toFixed(1) + '배)', '<input type="range" id="setRate" min="0.6" max="1.2" step="0.1" value="' + store.settings.rate + '">') +
        setRow('자유 탐색 모드', '순서 잠금을 풀고 모든 레슨 열기 (추천하지 않아요!)', '<label class="switch"><input type="checkbox" id="setFree"' + (store.settings.freeNav ? ' checked' : '') + '><span class="slider"></span></label>') +
        '</div>';
    h += '<div class="card">' +
        setRow('학습 데이터', '완료 ' + doneCount() + '레슨 · 단어장 ' + Object.keys(store.srs).length + '장 · 이 브라우저에 저장됨',
            '<button class="btn small" id="resetBtn" style="background:var(--error)">초기화</button>') +
        '</div>';
    h += '<div class="muted" style="text-align:center;margin-top:16px">니하오 중국어 v1.0 · 오프라인에서도 동작해요 🐼<br>발음은 브라우저 내장 중국어 음성(TTS)을 사용합니다</div>';
    $main.innerHTML = h;

    document.getElementById('setKoPron').addEventListener('change', e => { store.settings.koPron = e.target.checked; save(); });
    document.getElementById('setRate').addEventListener('change', e => { store.settings.rate = parseFloat(e.target.value); save(); renderSettings(); speak('你好', 0.95); });
    document.getElementById('setFree').addEventListener('change', e => { store.settings.freeNav = e.target.checked; save(); });
    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm('정말 모든 학습 기록을 지울까요?\n(완료한 레슨, 복습 단어장, 연속 기록이 사라져요)')) {
            localStorage.removeItem(LS_KEY);
            store = loadStore();
            go('home');
        }
    });

    function setRow(title, desc, ctl) {
        return '<div class="set-row"><div><div class="s-title">' + title + '</div><div class="s-desc">' + desc + '</div></div><div class="s-ctl">' + ctl + '</div></div>';
    }
}

/* ═══════════════════ 시작 ═══════════════════ */
render();
</script>
</body>
</html>
