<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a3161" />
<title>Daily English Quest → 헬로 영어</title>
<style>
  :root { --navy: #0a3161; --red: #b31942; --bg: #f8fafc; --text: #1e293b; --muted: #64748b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif; background: linear-gradient(135deg, #061d3a, var(--navy) 55%, var(--red) 140%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; color: var(--text); }
  .card { background: var(--bg); border-radius: 22px; max-width: 440px; width: 100%; padding: 28px 22px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
  .ico { font-size: 52px; }
  h1 { font-size: 20px; margin: 10px 0 8px; }
  p { font-size: 14px; line-height: 1.7; color: var(--muted); }
  ul { text-align: left; font-size: 13.5px; line-height: 1.8; margin: 14px 0 18px 18px; color: var(--text); }
  a.btn { display: block; background: var(--navy); color: white; text-decoration: none; font-weight: 800; font-size: 16px; border-radius: 14px; padding: 14px; }
  .small { font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<main class="card">
  <div class="ico">🗽</div>
  <h1>Daily English Quest가 <br>랭귀지 스타터 「헬로 영어」로 합쳐졌어요</h1>
  <p>30일 생활 회화는 그대로, 더 쉽고 재미있게 이어서 할 수 있어요.</p>
  <ul>
    <li>30일 퀘스트 = 헬로 영어 6~8단계 (Day 1~30)</li>
    <li>왕초보용 0~5단계(알파벳 소리·인사·숫자…)도 새로 생겼어요</li>
    <li>보스 미션·말하기 채점·복습함·XP·연속 기록 모두 있어요</li>
    <li>이 기기의 Daily English Quest 기록은 처음 열 때 <b>그대로 가져올 수 있어요</b></li>
  </ul>
  <a class="btn" id="go" href="../language-teacher/index.html?lang=en&amp;from=deq">헬로 영어로 이동 →</a>
  <p class="small">잠시 후 자동으로 이동해요.</p>
</main>
<script>
  // 기록(localStorage 'daily-english-quest-v1')은 건드리지 않고, 같은 사이트의 새 앱이 읽어서 이관합니다.
  setTimeout(function () { location.replace(document.getElementById('go').href); }, 1200);
</script>
</body>
</html>
