<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>랭귀지 스타터 - 영어·중국어·일본어·스페인어·프랑스어 왕초보 회화</title>
    <style>
        :root {
            --primary: #d92332;
            --primary-dark: #a01526;
            --gold: #f0a500;
            --gold-light: #fff4d6;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --red-soft: #fdf0f0;
            --native-font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Malgun Gothic", sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 45%, var(--gold) 135%);
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            color: var(--text);
            transition: background .25s;
        }
        .app {
            width: 100%; max-width: 680px;
            background: var(--bg);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            overflow: hidden;
            display: flex; flex-direction: column;
            height: 94vh; max-height: 860px;
        }
        /* ── Header ─────────────────────────── */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; padding: 14px 20px;
            display: flex; align-items: center; gap: 12px;
            flex-shrink: 0;
        }
        .avatar {
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.2); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; flex-shrink: 0; cursor: pointer;
        }
        .header h1 { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header p  { font-size: 11px; opacity: 0.85; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header .hdr-text { min-width: 0; flex: 1; }
        .header-right { margin-left: auto; text-align: right; font-size: 11.5px; line-height: 1.5; white-space: nowrap; flex-shrink: 0; }
        .lang-switch-btn {
            background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); color: white;
            border-radius: 10px; padding: 6px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
            margin-left: 10px; flex-shrink: 0; font-family: inherit;
        }
        /* ── Content ────────────────────────── */
        .content { flex: 1; overflow-y: auto; padding: 16px; }
        .content::-webkit-scrollbar { width: 6px; }
        .content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        /* ── Tab bar ────────────────────────── */
        .tabbar { display: flex; border-top: 1px solid var(--border); background: var(--card); flex-shrink: 0; }
        .tab {
            flex: 1; padding: 9px 4px 10px; text-align: center;
            font-size: 12px; color: var(--text-light); cursor: pointer;
            border: none; background: none; font-family: inherit; position: relative;
        }
        .tab .ico { display: block; font-size: 19px; margin-bottom: 2px; }
        .tab.active { color: var(--primary); font-weight: 700; }
        .tab .badge {
            position: absolute; top: 3px; right: calc(50% - 22px);
            background: var(--error); color: white; font-size: 10px; font-weight: 700;
            min-width: 17px; height: 17px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center; padding: 0 4px;
        }
        /* ── Common cards ───────────────────── */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        .section-title { font-size: 14px; font-weight: 700; margin: 18px 0 10px; color: var(--text); }
        .muted { color: var(--text-light); font-size: 12.5px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: var(--primary); color: white; border: none;
            padding: 12px 20px; border-radius: 12px; font-size: 15px; font-weight: 700;
            cursor: pointer; font-family: inherit; transition: transform .08s, opacity .15s;
        }
        .btn:active { transform: scale(0.97); }
        .btn.block { width: 100%; }
        .btn.ghost { background: white; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn.gray { background: #eef2f7; color: var(--text); }
        .btn.small { padding: 8px 14px; font-size: 13px; border-radius: 10px; }
        .btn:disabled { opacity: .45; cursor: default; }
        .play-btn {
            background: var(--red-soft); border: 1px solid var(--border); color: var(--primary);
            width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
            font-size: 14px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .play-btn:active { transform: scale(.92); }
        .play-btn.slow { font-size: 15px; }
        /* ── 언어 선택 화면 ─────────────────── */
        .lang-pick { padding: 10px 4px; }
        .lang-pick .lp-title { font-size: 20px; font-weight: 900; text-align: center; margin: 10px 0 4px; }
        .lang-pick .lp-sub { font-size: 13px; color: var(--text-light); text-align: center; margin-bottom: 22px; }
        .lang-card {
            display: flex; align-items: center; gap: 14px;
            background: var(--card); border: 2px solid var(--border); border-radius: 18px;
            padding: 18px; margin-bottom: 14px; cursor: pointer; transition: border-color .15s, transform .08s;
        }
        .lang-card:active { transform: scale(.98); }
        .lang-card .lc-emoji { font-size: 40px; flex-shrink: 0; }
        .lang-card .lc-name { font-size: 18px; font-weight: 800; }
        .lang-card .lc-desc { font-size: 12px; color: var(--text-light); margin-top: 2px; }
        .lang-card .lc-arrow { margin-left: auto; font-size: 20px; color: var(--text-light); }
        .lang-card.zh:hover, .lang-card.zh:active { border-color: #d92332; }
        .lang-card.es:hover, .lang-card.es:active { border-color: #c60b1e; }
        .lang-card.ja:hover, .lang-card.ja:active { border-color: #bc002d; }
        .lang-card.fr:hover, .lang-card.fr:active { border-color: #0055a4; }
        .lang-card.en:hover, .lang-card.en:active { border-color: #0a3161; }
        .lang-card .lc-course { font-size: 11px; color: var(--text-light); margin-top: 3px; font-weight: 700; }
        .lang-card .lc-prog { font-size: 11px; font-weight: 800; color: var(--success); margin-top: 3px; }
        /* ── Home ───────────────────────────── */
        .stats-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 6px; text-align: center; }
        .stat .num { font-size: 17px; font-weight: 800; color: var(--primary); }
        .stat .lbl { font-size: 10.5px; color: var(--text-light); margin-top: 2px; }
        .continue-card {
            background: linear-gradient(135deg, var(--primary), var(--gold));
            color: white; border-radius: 16px; padding: 16px; margin-bottom: 6px; cursor: pointer;
        }
        .continue-card .cc-label { font-size: 11px; opacity: .85; }
        .continue-card .cc-title { font-size: 17px; font-weight: 800; margin: 4px 0 2px; }
        .continue-card .cc-goal { font-size: 12px; opacity: .9; }
        .guide-banner {
            background: var(--gold-light); border: 1px solid #f2d98c;
            border-radius: 12px; padding: 10px 14px; font-size: 13px;
            margin: 10px 0 4px; cursor: pointer; color: #7a5b00; font-weight: 600;
        }
        .unit-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
        .unit-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
        .unit-icon {
            width: 44px; height: 44px; border-radius: 12px; background: var(--red-soft);
            display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
        }
        .unit-head .u-title { font-size: 15px; font-weight: 700; }
        .unit-head .u-sub { font-size: 11.5px; color: var(--text-light); margin-top: 2px; }
        .unit-right { margin-left: auto; text-align: right; flex-shrink: 0; }
        .unit-right .u-prog { font-size: 12px; font-weight: 700; color: var(--primary); }
        .unit-right .chev { font-size: 11px; color: var(--text-light); }
        .prog-bar { height: 5px; background: #f1f5f9; }
        .prog-bar > div { height: 100%; background: linear-gradient(90deg, var(--primary), var(--gold)); transition: width .3s; }
        .lesson-list { border-top: 1px solid var(--border); }
        .lesson-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .lesson-row:last-child { border-bottom: none; }
        .lesson-row.locked { opacity: .5; cursor: default; }
        .lesson-num {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; background: #eef2f7; color: var(--text-light);
        }
        .lesson-row.done .lesson-num { background: var(--success); color: white; }
        .lesson-row.current .lesson-num { background: var(--primary); color: white; }
        .lesson-row .l-title { font-size: 14px; font-weight: 600; }
        .lesson-row .l-goal { font-size: 11.5px; color: var(--text-light); margin-top: 1px; }
        .lesson-row .l-state { margin-left: auto; font-size: 15px; flex-shrink: 0; }
        /* ── Lesson view ────────────────────── */
        .lesson-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .back-btn { background: white; border: 1px solid var(--border); border-radius: 12px; width: 42px; height: 42px; font-size: 17px; cursor: pointer; flex-shrink: 0; }
        .lesson-top .lt-title { font-size: 16px; font-weight: 800; }
        .lesson-top .lt-sub { font-size: 11.5px; color: var(--text-light); }
        .steps { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
        .step-chip {
            padding: 10px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
            background: white; border: 1.5px solid var(--border); color: var(--text-light);
            cursor: pointer; font-family: inherit;
        }
        .step-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
        .word-row {
            display: flex; align-items: center; gap: 12px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
        }
        .word-main { flex: 1; min-width: 0; }
        .native { font-family: var(--native-font); font-weight: 700; }
        .word-row .native { font-size: 22px; }
        .word-row .pinyin { font-size: 13px; color: var(--primary); font-weight: 600; margin-top: 1px; }
        .word-row .pron { font-size: 13px; color: #7a5200; margin-top: 1px; font-weight: 600; }
        .word-row .ko { font-size: 14px; color: #475569; margin-top: 2px; }
        .word-btns { display: flex; gap: 6px; flex-shrink: 0; }
        .sent-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .sent-card .native { font-size: 19px; line-height: 1.5; }
        .sent-card .pinyin { font-size: 13px; color: var(--primary); font-weight: 600; margin-top: 3px; }
        .sent-card .pron { font-size: 13px; color: #7a5200; margin-top: 2px; font-weight: 600; }
        .sent-card .ko { font-size: 14.5px; color: var(--text); margin-top: 5px; }
        .sent-card .note { font-size: 12px; color: var(--text-light); margin-top: 6px; background: #f8fafc; border-radius: 8px; padding: 7px 10px; }
        .sent-head { display: flex; align-items: flex-start; gap: 10px; }
        .sent-head .word-btns { margin-left: auto; }
        .tip-box {
            background: var(--gold-light); border: 1px solid #f2d98c; border-radius: 12px;
            padding: 12px 14px; font-size: 13px; margin: 14px 0 8px; line-height: 1.6;
        }
        .tip-box b { color: #7a5b00; }

        .hist-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
        .hist-stats .stat .num { font-size: 15px; }
        .hist-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .hist-nav .hn-title { font-size: 15px; font-weight: 800; }
        .hist-nav button { background: white; border: 1px solid var(--border); border-radius: 10px; width: 32px; height: 32px; font-size: 14px; cursor: pointer; font-family: inherit; }
        .hist-nav button:disabled { opacity: .35; cursor: default; }
        .hist-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 16px; }
        .hist-dow { text-align: center; font-size: 10.5px; color: var(--text-light); font-weight: 700; padding-bottom: 4px; }
        .hist-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; font-size: 12px; cursor: pointer; background: #f8fafc; color: var(--text-light); border: none; font-family: inherit; }
        .hist-day.empty { visibility: hidden; cursor: default; }
        .hist-day.act { background: var(--red-soft); color: var(--text); font-weight: 700; }
        .hist-day .hd-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); margin-top: 2px; visibility: hidden; }
        .hist-day.act .hd-dot { visibility: visible; }
        .hist-day.today { box-shadow: inset 0 0 0 2px var(--primary); }
        .hist-day.sel { background: var(--primary); color: white; }
        .hist-day.sel .hd-dot { background: white; }
        .hist-date-group { margin-bottom: 14px; }
        .hist-date-group .hg-date { font-size: 12.5px; font-weight: 700; color: var(--text-light); margin-bottom: 6px; }
        .hist-entry { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
        .hist-entry .he-ico { font-size: 18px; flex-shrink: 0; }
        .hist-entry .he-title { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; }
        .hist-entry .he-score { font-size: 12px; color: var(--primary); font-weight: 700; white-space: nowrap; flex-shrink: 0; }
        .hist-reset { font-size: 12.5px; color: var(--primary); font-weight: 700; cursor: pointer; margin-bottom: 10px; display: inline-block; background: none; border: none; font-family: inherit; padding: 0; }
        .culture-box {
            background: #eef6ff; border: 1px solid #cfe3fa; border-radius: 12px;
            padding: 12px 14px; font-size: 13px; margin: 14px 0 8px; line-height: 1.6;
        }
        /* dialogue */
        .dlg-situation { font-size: 12.5px; color: var(--text-light); background: white; border: 1px dashed var(--border); border-radius: 10px; padding: 9px 12px; margin-bottom: 12px; }
        .bubble-row { display: flex; margin-bottom: 10px; gap: 8px; }
        .bubble-row.right { flex-direction: row-reverse; }
        .bubble-ava {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 16px; background: #eef2f7;
        }
        .bubble-row.right .bubble-ava { background: var(--red-soft); }
        .bubble { max-width: 82%; border-radius: 14px; padding: 10px 12px; cursor: pointer; }
        .bubble-row.left  .bubble { background: white; border: 1px solid var(--border); border-top-left-radius: 4px; }
        .bubble-row.right .bubble { background: var(--red-soft); border: 1px solid var(--border); border-top-right-radius: 4px; }
        .bubble .b-name { font-size: 10.5px; color: var(--text-light); margin-bottom: 3px; font-weight: 700; }
        .bubble .native { font-size: 16px; line-height: 1.45; }
        .bubble .pinyin { font-size: 12px; color: var(--primary); font-weight: 600; margin-top: 2px; }
        .bubble .pron { font-size: 12.5px; color: #7a5200; margin-top: 1px; font-weight: 600; }
        .bubble .ko { font-size: 13px; color: #475569; margin-top: 3px; }
        /* grammar */
        .gram-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
        .gram-card .g-title { font-size: 14.5px; font-weight: 800; margin-bottom: 6px; }
        .gram-card .g-explain { font-size: 13px; line-height: 1.65; color: var(--text); white-space: pre-line; }
        .gram-ex { display: flex; align-items: center; gap: 10px; background: #f8fafc; border-radius: 10px; padding: 9px 11px; margin-top: 8px; }
        .gram-ex .native { font-size: 15px; }
        .gram-ex .pinyin { font-size: 11.5px; color: var(--primary); font-weight: 600; }
        .gram-ex .pron { font-size: 12.5px; color: #7a5200; font-weight: 600; }
        .gram-ex .ko { font-size: 13px; color: #475569; }
        /* ── Quiz ───────────────────────────── */
        .quiz-prog { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .quiz-prog .qp-bar { flex: 1; height: 8px; background: #eef2f7; border-radius: 4px; overflow: hidden; }
        .quiz-prog .qp-bar > div { height: 100%; background: var(--primary); transition: width .25s; }
        .quiz-prog .qp-txt { font-size: 12px; font-weight: 700; color: var(--text-light); white-space: nowrap; }
        .quiz-q { font-size: 15.5px; font-weight: 700; line-height: 1.5; margin-bottom: 14px; }
        .quiz-audio { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
        .quiz-audio .btn { border-radius: 999px; }
        .choice-btn {
            display: block; width: 100%; text-align: left;
            background: var(--card); border: 1.5px solid var(--border); border-radius: 12px;
            padding: 13px 14px; font-size: 14.5px; margin-bottom: 8px; cursor: pointer;
            font-family: inherit; color: var(--text); transition: border-color .12s;
        }
        .choice-btn .native { font-size: 15.5px; }
        .choice-btn:not(:disabled):hover { border-color: #cbd5e1; }
        .choice-btn.correct { border-color: var(--success); background: #ecfdf5; font-weight: 700; }
        .choice-btn.wrong { border-color: var(--error); background: #fef2f2; }
        .choice-btn:disabled { cursor: default; }
        .tone-choice, .verb-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tone-choice .choice-btn, .verb-choice .choice-btn { text-align: center; margin-bottom: 0; }
        .arrange-area {
            min-height: 54px; background: var(--card); border: 1.5px dashed var(--border);
            border-radius: 12px; padding: 9px; margin-bottom: 12px;
            display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
        }
        .arrange-area.ok { border-color: var(--success); background: #ecfdf5; }
        .arrange-area.bad { border-color: var(--error); background: #fef2f2; }
        .token {
            background: var(--red-soft); border: 1px solid var(--border); color: var(--text);
            border-radius: 10px; padding: 8px 13px; font-size: 16px; cursor: pointer;
            font-family: var(--native-font); font-weight: 700;
        }
        .token-bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .token-bank .token { background: white; border: 1.5px solid var(--border); }
        .token-bank .token.used { opacity: .25; pointer-events: none; }
        .explain-box {
            border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.6; margin: 12px 0;
        }
        .explain-box.good { background: #ecfdf5; border: 1px solid #b7e4d0; }
        .explain-box.bad  { background: #fef2f2; border: 1px solid #f5c6c6; }
        .explain-box .eb-head { font-weight: 800; margin-bottom: 4px; font-size: 14px; }
        .explain-box .eb-answer { margin: 6px 0; }
        .explain-box .native { font-size: 16px; }
        /* quiz result */
        .result-hero { text-align: center; padding: 26px 10px 18px; }
        .result-hero .r-emoji { font-size: 52px; }
        .result-hero .r-score { font-size: 34px; font-weight: 900; margin: 8px 0 2px; }
        .result-hero .r-msg { font-size: 14px; color: var(--text-light); }
        .wrong-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; font-size: 13px; }
        .wrong-item .native { font-size: 15px; }
        /* ── SRS review ─────────────────────── */
        .flash-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 20px;
            padding: 40px 20px; text-align: center; margin-bottom: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }
        .flash-card .native { font-size: 40px; }
        .flash-card .pinyin { font-size: 18px; color: var(--primary); font-weight: 700; margin-top: 10px; }
        .flash-card .pron { font-size: 15px; color: #7a5200; margin-top: 4px; font-weight: 600; }
        .flash-card .ko { font-size: 17px; margin-top: 10px; }
        .grade-row { display: flex; gap: 10px; }
        .grade-row .btn { flex: 1; }
        .btn.fail { background: #fef2f2; color: var(--error); border: 1.5px solid #f5c6c6; }
        .btn.pass { background: #ecfdf5; color: #067a57; border: 1.5px solid #b7e4d0; }
        /* ── Tone trainer (중국어) ──────────── */
        .tone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .tone-cell { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; text-align: center; }
        .tone-cell .t-name { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
        .tone-cell .t-desc { font-size: 11px; color: var(--text-light); margin-bottom: 6px; }
        .tone-cell svg { width: 100%; height: 46px; }
        /* ── Kana dojo (일본어) ─────────────── */

function dueCards() {
    const t = todayStr();
    // 오래 밀린 카드 → 낮은 상자 순. 세션 상한 때문에 밀린 카드가 영영 안 나오는 일을 막는다.
    const regular = Object.entries(prog().srs).filter(([, c]) => !c.mastered && c.due <= t).map(([k, c]) => ({ key: k, ...c }))
        .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : (a.box - b.box)));

    const pr = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => { if (window[globalName]) resolve(); else { delete loadedScripts[src]; s.remove(); reject(new Error('데이터가 비어 있어요: ' + src)); } };
        s.onerror = () => { delete loadedScripts[src]; s.remove(); reject(new Error('데이터를 불러오지 못했어요: ' + src)); };

/* ═══════════════════ 첫 방문 환영 · 영어 레벨 선택 · Daily English Quest 기록 가져오기 ═══════════════════ */
const DEQ_KEY = 'daily-english-quest-v1';
function parseDeqState(d) {
    if (!isObj(d)) return null;
    const days = isObj(d.days) ? d.days : {};
    const cardsMap = (isObj(d.srs) && isObj(d.srs.cards)) ? d.srs.cards : {};
    const num = v => (Number.isFinite(Number(v)) && Number(v) > 0) ? Math.floor(Number(v)) : 0;
    const bossDays = Object.keys(days).map(Number).filter(n => n >= 1 && n <= 30 && isObj(days[String(n)]) && days[String(n)].boss);
    // 2회차는 30일을 다 끝내야 시작되고 이때 days가 비워진다(빈 Day로 다시 채워짐). 30일 모두 핵심 문장 카드가 있고
    // Day 30이 '3단계 끝·보스 전' 상태가 아니면 2회차로 보고 30일 전부 완료로 인정. 1회차에선 보스 클리어한 Day만
    const cardDays = new Set(Object.values(cardsMap).filter(c => isObj(c) && c.type === 'key').map(c => Number(c.dayId)).filter(n => n >= 1 && n <= 30));
    const d30 = days['30'];
    const round2 = cardDays.size === 30 && !(isObj(d30) && d30.s3 && !d30.boss);
    const cleared = round2 ? Array.from({ length: 30 }, (_, i) => i + 1) : bossDays.slice().sort((a, b) => a - b);
    const touched = Object.keys(days).filter(k => { const x = days[k]; return isObj(x) && (x.s1 || x.s2 || x.s3 || x.boss); }).length;
    const cards = Object.keys(cardsMap).length;
    if (!touched && !num(d.totalXp) && !cards) return null;
    return { raw: d, cleared, bossDays, touched, xp: num(d.totalXp), streak: num(d.streak), cards };
}
function readDeq() {
    try {
        const raw = localStorage.getItem(DEQ_KEY);
        if (!raw) return null;
        return parseDeqState(JSON.parse(raw));
    } catch (e) { return null; }
}
function deqPending() {   // 영어일 때: DEQ 기록이 있고 아직 가져오지도 거절하지도 않았으면 정보, 아니면 null
    if (!CUR || CUR.code !== 'en') return null;
    const rec = prog().deqImport;
    const info = readDeq();
    if (!info) return null;
    if (rec && rec.declined) return null;
    if (rec && rec.at && info.xp <= rec.xp && info.cleared.every(n => rec.days.includes(n))) return null;
    return info;
}
function importDeq(info) {

    let lessons = 0, cards = 0;

    const recent = info.cleared.slice(-3);   // 단어 카드는 최근 3일치만(복습 폭주 방지), 나머지는 레슨을 다시 볼 때 채워짐

        const l = dayLesson(n), day = isObj(days[String(n)]) ? days[String(n)] : {};

        const date = isDate(day.bossDate) ? day.bossDate : todayStr();
        if (!p.completed[l.id]) { const t = (l.quiz || []).length; p.completed[l.id] = { score: t, total: t, date, imported: day.boss ? 'deq' : 'deq-srs' }; lessons++; }
        if (day.boss && !p.boss[l.id]) p.boss[l.id] = { score: Number.isFinite(Number(day.bossScore)) && day.bossScore !== null ? clampInt(day.bossScore, 0, 100, 0) : null, date };
        if (recent.includes(n)) (l.words || []).forEach((w, wi) => {
            if (addSrsCard(p, { native: nativeText(w), pinyin: '', ko: w.ko, koPron: w.koPron || '', box: 2, due: todayStr(1 + ((k + wi) % 7)) })) cards++;

        const dl = p.daily[date] || (p.daily[date] = { xp: 0 });
        dl.xp += clampInt(e.xp, 0, 1000, 0);

        hist.push(date);

    // 연속 학습은 전 언어 통합 기록에 합친다(DEQ 연속이 더 길고 아직 살아 있으면 이어받기)
    const gs = store.streak;
    gs.best = Math.max(gs.best || 0, info.streak);
    if (isDate(d.lastBossDate) && (d.lastBossDate === todayStr() || d.lastBossDate === todayStr(-1)) && info.streak > 0) {
        // 새 앱에서 오늘(또는 어제) 이미 공부했으면 두 기록을 이어 붙인다 — 오늘 기록이 어제로 되돌아가지 않게

}

function starsOf(id) {
    const c = prog().completed[id];
    if (!c || !c.total) return 0;

    return r >= 1 ? 3 : r >= 0.85 ? 2 : 1;

function starStr(n) { return n ? '★'.repeat(n) + '☆'.repeat(3 - n) : ''; }
function bossOf(l) {
    const all = (l && l.keySentences) || [];
    if (!all.length) return null;
    const marked = all.find(x => x.boss);
    if (marked) return marked;
    // 지정이 없으면: 메모·나열 문장은 빼고, 평균 길이의 1.6배 이하에서, 회화에도 나오는(실제로 쓰는) 문장을 우선해 가장 긴 것
    const ks = all.filter(x => !/[()（）]|연습/.test(x.ko || '')).length ? all.filter(x => !/[()（）]|연습/.test(x.ko || '')) : all;
    const avg = ks.reduce((a, x) => a + nativeText(x).length, 0) / ks.length;
    const fit = ks.filter(x => nativeText(x).length <= avg * 1.6 && (nativeText(x).match(/[,，、]/g) || []).length < 3 && !/\d[\d\s-]{5,}/.test(x.ko || ''));
    const pool = fit.length ? fit : ks;
    const said = new Set(((l.dialogue && l.dialogue.turns) || []).map(t => nativeText(t)));
    const inDlg = pool.filter(x => said.has(nativeText(x)));
    const pick = inDlg.length ? inDlg : pool;
    return pick.reduce((a, b) => (nativeText(b).length > nativeText(a).length ? b : a), pick[0]);
}

const TONE_OF = {}; 'āēīōūǖ'.split('').forEach(c => TONE_OF[c] = 1); 'áéíóúǘ'.split('').forEach(c => TONE_OF[c] = 2); 'ǎěǐǒǔǚ'.split('').forEach(c => TONE_OF[c] = 3); 'àèìòùǜ'.split('').forEach(c => TONE_OF[c] = 4);

function toneKoPron(kp, pinyin) {

    const py = clean(pinyin).split(/\s+/).filter(Boolean), ko = clean(kp).split(/\s+/).filter(Boolean);

        turns.forEach((t, i) => { if (!secs.length || t.part) secs.push({ part: t.part || '', idx: [] }); secs[secs.length - 1].idx.push(i); });
        const longDlg = turns.length > 16 && secs.filter(x => x.part).length >= 3;

        const turnHtml = (t, i) => {

        if (l.culture) h += '<div class="culture-box"><b>' + CUR.flag + ' 문화 노트</b><br>' + esc(l.culture) + '</div>';
        h += nextStepBtn('문법 보러 가기 →');
        body.innerHTML = h;
        const turnEl = i => body.querySelector('[data-turn="' + i + '"]');
        const openSecOf = el => { const sc = el && el.closest('.dlg-sec'); if (sc && sc.classList.contains('closed')) { sc.classList.remove('closed'); const tg = sc.querySelector('[data-sec-toggle]'); if (tg) { tg.setAttribute('aria-expanded', 'true'); const ch = tg.querySelector('.dp-chev'); if (ch) ch.textContent = '▾'; } } };
        const hilite = i => { const el = turnEl(i); if (el) { openSecOf(el); el.classList.add('playing'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } };
        const markHeard = k => { const p = prog(); if (!p.heard) p.heard = {}; const a = p.heard[l.id] || (p.heard[l.id] = []); if (!a.includes(k)) { a.push(k); save(); } const tg = body.querySelector('[data-sec-toggle="' + k + '"]'); if (tg) tg.classList.add('heard'); };
        body.querySelectorAll('[data-sec-toggle]').forEach(b => b.addEventListener('click', e => {
            if (e.target.closest('[data-sec-play]')) return;
            const sc = b.closest('.dlg-sec'), closed = sc.classList.toggle('closed');
            b.setAttribute('aria-expanded', String(!closed));
            const ch = b.querySelector('.dp-chev'); if (ch) ch.textContent = closed ? '▸' : '▾';
        }));
        body.querySelectorAll('[data-sec-play]').forEach(b => b.addEventListener('click', e => {

            const k = parseInt(b.dataset.secPlay, 10), sc = b.closest('.dlg-sec');
            const idx = Array.from(sc.querySelectorAll('[data-turn]')).map(el => parseInt(el.dataset.turn, 10));
            speakSeq(idx.map(i => ({ text: nativeText(turns[i]), speaker: turns[i].speaker })), () => markHeard(k), (x, j) => hilite(idx[j]));
        }));
        const lf = document.getElementById('listenFirst');

                    const w = document.getElementById('dlgWrap'); if (w) w.classList.remove('blind');

                const others = ALL.filter(x => x.id !== l.id && x.dialogue && x.dialogue.situation).map(x => x.dialogue.situation);
                if (d.situation && others.length >= 2) {
                    const pick2 = seededShuffle(others, hashStr(l.id + todayStr())).slice(0, 2);
                    const opts = seededShuffle([d.situation].concat(pick2), hashStr(l.id));
                    lf.outerHTML = '<div class="card" id="sitQuiz"><b>🤔 무슨 상황이었을까요?</b>' + opts.map(o => '<button class="choice-btn" data-sit="' + (o === d.situation ? 1 : 0) + '" style="margin-top:8px;font-size:13px">' + esc(o) + '</button>').join('') + '</div>';
                    const sq = document.getElementById('sitQuiz');
                    if (sq) { sq.scrollIntoView({ block: 'center', behavior: 'smooth' }); showToast('🤔 방금 들은 대화, 무슨 상황이었을까요?'); }
                    document.querySelectorAll('[data-sit]').forEach(b => b.addEventListener('click', () => {

                        showToast(ok ? '⭕ 귀로 알아들었어요! 이제 대본으로 확인해 보세요' : '👀 대본을 보며 다시 들어 보세요', '', 3000);
                    }));
                } else { revealScript(); lf.remove(); showToast('👀 이제 대본을 보며 맞게 들었는지 확인해 보세요!', '', 3000); }
            }, (x, i) => hilite(i));
        });
        document.getElementById('playAll').addEventListener('click', () => speakSeq(turns.map(asItem), () => { body.querySelectorAll('[data-sec-toggle]').forEach(tg => markHeard(parseInt(tg.dataset.secToggle, 10))); }, (x, i) => hilite(i)));
        document.getElementById('stopAll').addEventListener('click', () => { seqPlaying = false; if (S.rpActive) { rolePlayToken++; S.rpActive = null; showToast('🎭 역할극을 멈췄어요'); } stopSpeak(); });
        document.getElementById('blindBtn').addEventListener('click', e => {
            const w = document.getElementById('dlgWrap'), on = !w.classList.contains('blind');

        });

                    '<div class="native">' + esc(nativeText(ex)) + '</div>' +
                    romanLine(ex) + pronLine(ex.koPron, undefined, ex) +
                    '<div class="ko">' + esc(ex.ko) + '</div></div>' + playBtns(nativeText(ex)) + '</div>';
            });
            if (exs.length > 3) h += '</div>';
            // ✋ 한 탭 확인: 같은 카드 예문끼리 뜻 보고 고르기(대부분 최소 대립이라 좋은 대조 문제가 됨)
            const cands = exs.filter((x, i, arr) => nativeText(x) && x.ko && arr.findIndex(y => nativeText(y) === nativeText(x)) === i).slice(0, 3);
            if (cands.length >= 2) {
                const tgt = cands[Math.abs(hashStr(l.id + gi)) % cands.length];
                h += '<div class="gchk" data-gchk="' + gi + '"><div class="gq">✋ 확인: “' + esc(shortKo(tgt.ko)) + '”는 어느 것일까요?</div>' +
                    seededShuffle(cands, hashStr(l.id + 'g' + gi)).map(x => '<button class="choice-btn" data-gans="' + (x === tgt ? 1 : 0) + '" data-gtext="' + esc(nativeText(x)) + '"><span class="native">' + esc(nativeText(x)) + '</span></button>').join('') + '</div>';
            }
            h += '</div>';
        });
        h += nextStepBtn('퀴즈 풀러 가기 →');
        body.innerHTML = h;
        body.querySelectorAll('[data-more-ex]').forEach(b => b.addEventListener('click', () => { const bx = body.querySelector('[data-more-box="' + b.dataset.moreEx + '"]'); if (bx) bx.hidden = false; b.remove(); }));
        body.querySelectorAll('[data-gchk]').forEach(box => box.querySelectorAll('[data-gans]').forEach(b => b.addEventListener('click', () => {
            if (box.dataset.done) return;
            box.dataset.done = '1';
            const ok = b.dataset.gans === '1';
            box.querySelectorAll('[data-gans]').forEach(x => { x.disabled = true; if (x.dataset.gans === '1') x.classList.add('correct'); else if (x === b) x.classList.add('wrong'); });
            sfx(ok ? 'ok' : 'bad');
            const right = box.querySelector('[data-gans="1"]');
            if (right) setTimeout(() => speak(right.dataset.gtext, 0.9), 200);
            box.insertAdjacentHTML('beforeend', '<div class="muted" style="font-weight:700;color:' + (ok ? 'var(--success)' : 'var(--error)') + '">' + (ok ? '⭕ 맞아요! 규칙이 보이기 시작했어요' : '❌ 초록색이 정답이에요. 다른 부분을 비교해 보세요') + '</div>');
        })));
    } else {                     /* 퀴즈 */
        renderQuiz(body, l);
        return;
    }
    bindPlayBtns(body);
    const mtb = document.getElementById('moreTipsBtn');
    if (mtb) mtb.addEventListener('click', () => { document.getElementById('moreTips').hidden = false; mtb.remove(); });
    body.querySelectorAll('[data-mic-ks]').forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();
        const si = parseInt(b.dataset.micKs, 10), item = l.keySentences[si];
        openSpeak({
            item,
            onPass: () => { const p = prog(); if (!p.spoke) p.spoke = {}; if (!p.spoke[l.id]) p.spoke[l.id] = {}; p.spoke[l.id][si] = 1; save(); },
            onFail: () => addSentCard(item, 0),
            onClose: () => { if (S.view === 'lesson' && S.step === 1) { const st = $main.scrollTop; renderStep(); $main.scrollTop = st; } },
        });
    }));
    const nb = document.getElementById('nextStepBtn');
    if (nb) nb.addEventListener('click', () => {
        const p = prog();
        if (!p.steps) p.steps = {};
        const sd = p.steps[l.id] || (p.steps[l.id] = {});
        const first = !sd[S.step];
        sd[S.step] = 1; save();
        const chip = $main.querySelector('.step-chip[data-step="' + S.step + '"]');
        if (chip && !chip.classList.contains('done')) { chip.classList.add('done'); chip.textContent = '✓ ' + STEP_NAMES[S.step]; }
        if (first) addXp(2, STEP_NAMES[S.step] + ' 완료');
        if (S.step === 1 && first) setTimeout(() => showToast('🏁 절반 왔어요! 여기서 쉬어도 다음엔 이 단계부터 이어져요', '', 3200), 700);
        S.step++; renderStep();
    });

    function nextStepBtn(label) {
        return '<button class="btn block" id="nextStepBtn" style="margin-top:10px">' + label + '</button>';
    }
}

/* ═══════════════════ 퀴즈 엔진 ═══════════════════ */
function renderQuiz(body, l) {
    if (!S.quiz) {
        const done = prog().completed[l.id];
        body.innerHTML = '<div class="card" style="text-align:center;padding:28px 18px">' +
            '<div style="font-size:44px">📝</div>' +
            '<div style="font-size:17px;font-weight:800;margin:10px 0 4px">확인 퀴즈</div>' +
            '<div class="muted">총 ' + (l.quiz || []).length + '문항 · ' + Math.round(PASS_RATE * 100) + '% 이상 맞히면 통과!<br>통과하면 이 레슨의 단어가 복습함에 자동으로 담겨요.</div>' +
            (done ? '<div style="margin-top:8px;font-size:13px;color:var(--success);font-weight:700">✅ 이미 통과한 레슨이에요 (최고 ' + done.score + '/' + done.total + '점) — 다시 풀어도 좋아요!</div>' : '') +
            '<button class="btn" id="startQuiz" style="margin-top:16px">퀴즈 시작하기</button></div>';
        document.getElementById('startQuiz').addEventListener('click', () => {
            S.quiz = newQuizState();
            renderQuiz(body, l);
        });
        return;
    }
    const q = S.quiz;
    const all = l.quiz || [];
    if (!q.order && !q.only && !l.redo && l.skipUnit === undefined) {
        // 같은 유형이 이어진 구간 안에서만 섞는다(선택형 → 듣기 → 배열 흐름 유지). 같은 날 같은 레슨은 늘 같은 순서
        const seedBase = hashStr(l.id + todayStr()) + (q.attempt || 0) * 101;
        const runs = [];
        all.forEach((it, i) => { if (!runs.length || all[i - 1].type !== it.type) runs.push([]); runs[runs.length - 1].push(i); });
        q.order = runs.flatMap((r, k) => seededShuffle(r, seedBase + k * 7));
    }
    const order = q.only || q.order || all.map((_, i) => i);      // 다시 풀 때는 순서를 섞고, 틀린 문제 단계에서는 그 번호만
    if (q.i >= order.length) {
        // 본 회차가 끝났는데 틀린 문제가 있으면, 결과 전에 그 문제들만 한 번 더 (듀오링고식)
        if (!q.phase2 && q.wrong.length && !l.redo && l.skipUnit === undefined) {
            q.phase2 = true; q.firstScore = q.score; q.firstWrong = q.wrong.slice();
            q.only = q.wrong.map(w => w.idx); q.order = null; q.i = 0; q.corrected = 0; q.combo = 0;
            renderQuiz(body, l); return;
        }
        renderQuizResult(body, l); return;
    }
    const qIdx = order[q.i];
    const item = all[qIdx];
    const seed = hashStr(item.srcLesson || l.id) + (item.srcIdx !== undefined ? item.srcIdx : qIdx) * 97;
    const itemText = nativeText(item);

    let h = '<div class="quiz-prog"><div class="qp-bar"><div style="width:' + (q.i / order.length * 100) + '%"></div></div>' +
        '<div class="qp-txt">' + (q.combo >= 2 ? '🔥' + q.combo + ' · ' : '') + (q.i + 1) + ' / ' + order.length + '</div></div>';
    if (item.srcTitle) h += '<div class="muted" style="margin:-6px 0 8px">📝 ' + esc(item.srcTitle) + '</div>';
    if (q.phase2) h += '<div class="phase2-banner">🔁 틀렸던 문제 한 번 더! 맞히면 점수에 반영돼요 (' + (q.i + 1) + '/' + order.length + ')</div>';
    h += '<div class="quiz-q">' + esc(item.q) + '</div>';

    if (item.type === 'listen' || item.type === 'tone') {
        h += '<div class="quiz-audio">' +
            '<button class="big-listen" id="qPlay" aria-label="듣기">🔊</button>' +
            '<button class="big-listen slow" id="qPlaySlow" aria-label="느리게 듣기">🐢</button></div>';
    }
    if (item.type === 'arrange') {
        h += '<div class="arrange-area" id="arrArea">' +
            (q.sel.length ? q.sel.map((t, i) => '<span class="token" data-sel="' + i + '">' + esc(t) + '</span>').join('') :
                '<span class="muted" style="padding:4px 6px">아래 단어를 순서대로 눌러 문장을 만드세요</span>') + '</div>';
        const bank = seededShuffle(item.tokens.map((t, i) => ({ t, i })), seed);
        q.half = null;
        h += '<div class="token-bank">' + bank.map(b => {
            const used = q.selSrc && q.selSrc.includes(b.i);
            return '<span class="token' + (used ? ' used' : '') + '" data-bank="' + b.i + '">' + esc(b.t) + '</span>';
        }).join('') + '</div>';
        const hintLeft = Math.max(1, Math.floor(item.tokens.length / 2)) - (q.hints || 0);
        h += '<div style="display:flex;gap:8px"><button class="btn gray" id="arrHint" title="다음 단어 힌트"' + (q.sel.length >= item.tokens.length || hintLeft <= 0 ? ' disabled' : '') + '>💡 힌트 ' + Math.max(0, hintLeft) + '</button>' +
            '<button class="btn block" id="arrCheck"' + (q.sel.length === item.tokens.length ? '' : ' disabled') + ' style="flex:1">확인하기</button></div>';
    } else {
        const tone = item.type === 'tone';
        h += '<div class="' + (tone ? 'tone-choice' : '') + '">';
        const disp = tone ? item.choices.map((_, ci) => ci) : seededShuffle(item.choices.map((_, ci) => ci), seed + (q.attempt || 0) * 31 + (q.phase2 ? 5 : 0));
        disp.forEach(ci => {
            const c = item.choices[ci];
            h += '<button class="choice-btn' + (q.half && q.half.includes(ci) ? ' halved' : '') + '" data-choice="' + ci + '"' + (q.half && q.half.includes(ci) ? ' disabled' : '') + '><span class="native">' + esc(c) + '</span></button>';
        });
        h += '</div>';
        if (item.choices.length >= 4 && !q.half && !q.answered) h += '<button class="btn small gray" id="qHalf" style="margin-bottom:8px">💡 반반 힌트 (보기 2개 지우기)</button>';
    }
    h += '<div id="qFeedback"></div>';
    body.innerHTML = h;

    const qp = document.getElementById('qPlay');
    if (qp) { qp.addEventListener('click', () => { q.plays = (q.plays || 0) + 1; speak(itemText, q.plays >= 3 ? 0.7 : 0.95); }); }
    const qh = document.getElementById('qHalf');
    if (qh) qh.addEventListener('click', () => {
        if (q.answered) return;
        const wrongs = item.choices.map((_, ci) => ci).filter(ci => ci !== item.answer);
        q.half = seededShuffle(wrongs, seed + 7).slice(0, 2);
        renderQuiz(body, l);
    });
    const qps = document.getElementById('qPlaySlow');
    if (qps) { qps.addEventListener('click', () => speak(itemText, 0.7)); }
    if (qp && !q.answered && q.autoFor !== q.i + ':' + (q.phase2 ? 2 : 1)) {
        q.autoFor = q.i + ':' + (q.phase2 ? 2 : 1);
        setTimeout(() => { if (S.quiz === q && !q.answered) speak(itemText, 0.95); }, 350);
    }

    if (item.type === 'arrange') {
        if (!q.selSrc) q.selSrc = [];
        body.querySelectorAll('[data-bank]').forEach(el => el.addEventListener('click', () => {
            if (q.answered) return;
            const bi = parseInt(el.dataset.bank, 10);
            if (q.selSrc.includes(bi)) return;
            q.sel.push(item.tokens[bi]); q.selSrc.push(bi);
            speak(item.tokens[bi], 0.9);
            renderQuiz(body, l);
        }));
        body.querySelectorAll('[data-sel]').forEach(el => el.addEventListener('click', () => {
            if (q.answered) return;
            const si = parseInt(el.dataset.sel, 10);
            q.sel.splice(si, 1); q.selSrc.splice(si, 1);
            renderQuiz(body, l);
        }));
        const hb = document.getElementById('arrHint');
        if (hb) hb.addEventListener('click', () => {
            // 힌트: 앞에서부터 맞게 놓인 만큼은 두고, 다음에 올 단어 하나를 채워 준다
            if (q.answered) return;
            let k = 0;
            while (k < q.sel.length && q.sel[k] === item.tokens[k]) k++;
            q.sel = q.sel.slice(0, k); q.selSrc = q.selSrc.slice(0, k);
            const bi = item.tokens.findIndex((t, ti) => t === item.tokens[k] && !q.selSrc.includes(ti));
            if (bi >= 0) { q.sel.push(item.tokens[bi]); q.selSrc.push(bi); }
            q.hints = (q.hints || 0) + 1; q.usedHint = true;
            renderQuiz(body, l);
        });
        const ck = document.getElementById('arrCheck');
        if (ck) ck.addEventListener('click', () => {
            if (q.answered) return;
            const user = q.sel.join(CUR.joiner);
            const answer = item.tokens.join(CUR.joiner);
            const ok = user === answer;
            ck.disabled = true;
            const roman = romanText(item) || item.koPron || '';
            answerFeedback(ok, item,
                '<div class="eb-answer">정답: <span class="native">' + esc(answer) + '</span>' +
                (roman ? '<br><span style="color:var(--primary);font-weight:600">' + (CUR.romanField ? esc(roman) : '[' + esc(roman) + ']') + '</span>' : '') + '</div>');
        });
    } else {
        body.querySelectorAll('[data-choice]').forEach(el => el.addEventListener('click', () => {
            const ci = parseInt(el.dataset.choice, 10);
            const ok = ci === item.answer;
            body.querySelectorAll('[data-choice]').forEach(b => {
                const bi = parseInt(b.dataset.choice, 10);
                b.disabled = true;
                if (bi === item.answer) b.classList.add('correct');
                else if (bi === ci && !ok) b.classList.add('wrong');
            });
            answerFeedback(ok, item, '');
            if ((item.type === 'listen' || item.type === 'tone') && itemText) setTimeout(() => speak(itemText, 0.9), 250);
            else if (ok && !/[가-힣]/.test(item.choices[item.answer])) setTimeout(() => speak(item.choices[item.answer], 0.95), 250);
        }));
    }

    function answerFeedback(ok, item, extraHtml) {
        if (q.answered) return;
        q.answered = true;
        const mk = (item.srcLesson || l.id) + '#' + (item.srcIdx !== undefined ? item.srcIdx : qIdx);
        const p = prog();
        if (!p.mistakes) p.mistakes = {};
        let graduated = false;
        if (ok && q.phase2) q.corrected = (q.corrected || 0) + 1;
        if (ok) {
            if (!q.phase2) q.score++;
            q.combo = (q.combo || 0) + 1;
            const dl = dayLog(); dl.maxCombo = Math.max(dl.maxCombo || 0, q.combo);
            const mm = p.mistakes[mk];
            if (mm && !q.half && !q.usedHint && mm.lastOk !== todayStr()) {
                mm.ok = (mm.ok || 0) + 1; mm.lastOk = todayStr();
                // 틀린 그날의 교정 1번 + 다른 날에 1번 더 맞혀야 졸업(간격 두고 확인)
                if (mm.ok >= 2) { delete p.mistakes[mk]; graduated = true; store.flags.mistakesCleared = (store.flags.mistakesCleared || 0) + 1; }
            }
        } else {
            q.combo = 0; if (!q.phase2) q.wrong.push({ item, idx: qIdx });
            p.mistakes[mk] = { date: todayStr(), n: ((p.mistakes[mk] && p.mistakes[mk].n) || 0) + 1, ok: 0 };
        }
        save();
        const qhb = document.getElementById('qHalf'); if (qhb) qhb.remove();
        sfx(ok ? ([3, 5, 10].includes(q.combo) ? 'level' : 'ok') : 'bad');
        try { if (navigator.vibrate) navigator.vibrate(ok ? 15 : [30, 40, 30]); } catch (e) { }
        announce(ok ? '정답' : '오답');
        if (item.type === 'arrange') setTimeout(() => speak(item.tokens.join(CUR.joiner), 0.95), 250);
        const fb = document.getElementById('qFeedback');
        fb.innerHTML = '<div class="explain-box ' + (ok ? 'good' : 'bad') + '">' +
            '<div class="eb-head mascot-line"><span class="m-ico">' + CUR.flag + '</span><span>' + (ok ? (q.combo >= 3 ? '🔥 ' + q.combo + '연속 정답! ' : '⭕ ') + cheer(true) : '❌ ' + cheer(false)) + '</span></div>' +
            (graduated ? '<div style="font-weight:700;color:#067a57;margin:4px 0">🎓 두 번 연속 맞혀서 오답 노트에서 졸업했어요!</div>' : '') + extraHtml +
            ((itemText && item.type !== 'arrange') ? '<div class="eb-answer"><span class="native">' + esc(itemText) + '</span>' +
                (romanText(item) ? ' <span style="color:var(--primary);font-weight:600">' + esc(romanText(item)) + '</span>' : '') + '</div>' : '') +
            esc(item.explain || '') + '</div>' +
            '<button class="btn block" id="qNext">' + (q.i + 1 >= order.length ? '결과 보기' : '다음 문제 →') + '</button>';
        const arr = document.getElementById('arrArea');
        if (arr) {
            arr.classList.add(ok ? 'ok' : 'bad');
            if (!ok) arr.querySelectorAll('[data-sel]').forEach((el, k) => el.classList.add(q.sel[k] === item.tokens[k] ? 'tok-ok' : 'tok-bad'));
        }
        document.getElementById('qNext').addEventListener('click', () => {
            q.i++; q.answered = false; q.sel = []; q.selSrc = []; q.half = null; q.plays = 0; q.hints = 0; q.usedHint = false;
            renderQuiz(body, l);
        });
        fb.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
}

const CHEER_OK = ['감이 좋아요!', '완벽해요 👏', '바로 그거예요!', '귀가 트이고 있어요', '술술 풀리네요', '기억력 최고!', '원어민이 칭찬하겠어요', '실력이 쑥쑥 늘고 있어요', '이 정도면 여행 가도 되겠어요', '정확해요!'];
const CHEER_NG = ['괜찮아요, 틀린 덕분에 이제 안 잊어요', '원어민도 헷갈려요. 한 번 더!', '아깝다! 거의 다 왔어요', '실수는 배움의 지름길이에요', '오답 노트가 기억해 둘게요', '다음엔 분명 맞힐 거예요'];
const CHEER_LANG = { en: 'Great job!', zh: '太棒了！', es: '¡Muy bien!', ja: 'すごい！', fr: 'Très bien !' };
let cheerRecent = [];
function cheer(ok) {
    const pool = (ok ? CHEER_OK.concat([CHEER_LANG[CUR.code] || '']) : CHEER_NG).filter(x => x && !cheerRecent.includes(x));
    const pick = pool[Math.floor(Math.random() * pool.length)] || (ok ? '정답이에요!' : '아쉬워요!');
    cheerRecent = cheerRecent.concat([pick]).slice(-3);
    return pick;
}
function newQuizState(only, attempt) { return { i: 0, score: 0, answered: false, wrong: [], sel: [], selSrc: [], combo: 0, only: only || null, attempt: attempt || 0 }; }
function renderQuizResult(body, l) {
    const q = S.quiz;
    const items = l.quiz || [];
    const total = (l.redo || l.skipUnit !== undefined) ? items.length : items.length;
    const skipUnit = l.skipUnit;
    const partial = !!(l.redo || skipUnit !== undefined);   // 오답 노트 · 건너뛰기 시험은 레슨 진도와 따로
    const firstScore = q.phase2 ? q.firstScore : q.score;
    const fixed = q.phase2 ? (q.corrected || 0) : 0;
    const shown = partial ? q.score : Math.min(items.length, firstScore + fixed);
    const pass = (partial ? q.score / total : shown / items.length) >= (skipUnit !== undefined ? 0.8 : PASS_RATE);
    let skipped = 0;
    if (skipUnit !== undefined && pass && !q.settled) skipped = applySkipPass(skipUnit);
    let gained = 0;
    if (!q.settled) {
        q.settled = true;
        if (pass && !partial) {
            const p = prog();
            const prev = p.completed[l.id];
            if (!prev) gained += XP.lesson;
            if (firstScore === total && !(prev && prev.score === prev.total)) gained += XP.perfect;
            if (!prev) p.completed[l.id] = { score: firstScore, fixed: fixed, total, date: todayStr() };
            else {
                if (firstScore > prev.score || prev.imported || prev.placed) { prev.score = firstScore; prev.fixed = fixed; prev.total = total; delete prev.imported; delete prev.placed; }
                prev.last = todayStr();
            }
            const dl = dayLog(); dl.lessons = (dl.lessons || 0) + 1;
            addWordsToSrs(l);
            if (!store.seen.persistAsked && navigator.storage && navigator.storage.persist) {
                store.seen.persistAsked = todayStr();
                navigator.storage.persist().then(ok => { store.seen.persisted = !!ok; save(); }).catch(() => { });
            }
            if (!prev) {
                const b = bossOf(l);
                const shortest = (l.keySentences || []).filter(x => x !== b).sort((a, c) => nativeText(a).length - nativeText(c).length)[0];
                [b, shortest].forEach(x => addSentCard(x, 1));
            }
            touchStreak();
            save();
        }
        if (partial && q.score && l.redo) {
            const dl = dayLog(); const give = Math.max(0, Math.min(q.score * 2, 10 - (dl.redoXp || 0)));
            dl.redoXp = (dl.redoXp || 0) + give; gained += give;
        }
        if (!pass && !partial) {       // 떨어져도 노력은 보상 (레슨당 하루 1번)
            const dl = dayLog(); if (!dl.effort) dl.effort = {};
            if (!dl.effort[l.id]) { dl.effort[l.id] = 1; gained += 3; }
        }
        q.gained = gained;
    }
    gained = q.gained || 0;
    const gIdx = S.lessonIdx;
    const hasNext = !l.redo && gIdx + 1 < ALL.length;
    const boss = !partial && pass ? bossOf(l) : null;
    const bossDone = boss && prog().boss && prog().boss[l.id];
    let h = '<div class="result-hero">' +
        '<div class="r-emoji">' + (pass ? (q.score === total ? '🏆' : '🎉') : '💪') + '</div>' +
        '<div class="r-score" style="color:' + (pass ? 'var(--success)' : 'var(--error)') + '">' + shown + ' / ' + total + '</div>' +
        (fixed ? '<div class="muted">첫 시도 ' + firstScore + '개 + 다시 풀어 맞힌 ' + fixed + '개</div>' : '') +

        '<div class="r-msg">' + (l.warm ? '워밍업 끝! 머리가 풀렸으니 새 레슨을 시작해 볼까요?' : skipUnit !== undefined ? (pass ? '⏩ 합격! ' + skipUnit + '단계를 건너뛰었어요 (레슨 ' + skipped + '개 통과 처리 · 단어는 복습함에 나눠 담았어요)' : '80% 이상이면 합격이에요. 이 단계는 차근차근 배워 봐요 — 이미 아는 부분은 금방 지나가요!') :
            partial ? (q.score === total ? (Object.keys(prog().mistakes || {}).length ? '전부 맞혔어요! 👏 다른 날 한 번 더 맞히면 노트에서 졸업해요' : '전부 맞혔어요! 오답 노트를 모두 졸업했어요 🎓') : '다른 날 한 번 더 맞힌 문제는 오답 노트에서 졸업해요. 남은 건 다음에 또!') :
            pass ? (firstScore === total ? '완벽해요! 한 번에 전부 맞혔어요' : '통과! 잘하고 있어요 👏') + '<br>이 레슨 단어들이 내일부터 복습 카드로 나와요.' :
            (Math.ceil(items.length * PASS_RATE) - shown <= 1 ? '거의 다 왔어요, 1문제만 더! 💪' : Math.ceil(items.length * PASS_RATE) + '문제 이상 맞히면 통과예요.') + '<br>단어와 회화를 한 번 더 보고 다시 도전해 보세요!') +
        (gained ? '<br><b style="color:var(--primary)">+' + gained + ' XP' + (!pass && !partial ? ' (노력 보상)' : '') + '</b>' : '') + '</div></div>';

            '<div class="muted" style="margin:4px 0 10px">' + (bossDone ? '다시 도전해서 점수를 올려 보세요.' : '한국어 뜻만 보고 오늘의 보스 문장을 말해 보세요! (+' + XP.boss + ' XP)') + '</div>' +

    if (pass && !partial && !store.seen.remindOffer) h += '<div class="card" id="remindOffer" style="text-align:center"><b>⏰ 내일도 이 시간에 알려 드릴까요?</b><div class="muted" style="margin:4px 0 8px">매일 같은 시간에 하면 습관이 돼요</div>' +
        '<div style="display:flex;gap:8px;justify-content:center"><button class="btn small" id="remindYes">📅 캘린더에 넣기</button><button class="btn small gray" id="remindNo">괜찮아요</button></div></div>';
    if (pass && !partial && l.goal) h += '<div class="card" style="text-align:center;border-color:#b7e4d0;background:#f3fcf8"><b>✅ 이제 할 수 있어요</b><div style="font-size:13.5px;margin-top:4px">' + esc(l.goal) + '</div></div>';
    if (pass && !partial) {
        const b3 = [boss].concat((l.keySentences || []).filter(x => x !== boss).sort((a, c) => nativeText(a).length - nativeText(c).length).slice(0, 2)).filter(Boolean);
        if (b3.length) h += '<div class="card"><b>🧠 오늘 배운 문장 떠올리기</b><div class="muted">뜻을 보고 먼저 말해 본 뒤 눌러서 확인하세요</div>' +
            b3.map((x, i) => '<div class="recall-sent" data-recall="' + i + '" role="button" tabindex="0">' + esc(shortKo(x.ko)) + '<div class="native">' + esc(nativeText(x)) + '</div></div>').join('') + '</div>';
    }
    if (pass && !partial) {
        const acts = (l.nextActions && l.nextActions.length) ? l.nextActions : (boss ? ['오늘 「' + nativeText(boss) + '」(' + boss.ko + ')를 혼잣말로 3번 말해 보세요.'] : []);
        if (acts.length) h += '<div class="tip-box"><b>📌 오늘 써먹기</b><br>' + acts.map(a => '· ' + esc(a)).join('<br>') +
            '<div style="margin-top:8px"><button class="btn small ghost" id="copyToday">📋 오늘 문장 복사</button></div></div>';
    }
    const wrongList = q.phase2 ? q.firstWrong : q.wrong;
    if (wrongList.length) {
        h += '<div class="section-title">틀렸던 문제 다시 보기</div>';
        wrongList.forEach(w => {
            const it = w.item, txt = nativeText(it);
            h += '<div class="wrong-item"><b>Q' + (w.idx + 1) + '.</b> ' + esc(it.q) +
                (txt ? '<div style="margin-top:5px"><span class="native">' + esc(txt) + '</span>' + (romanText(it) ? ' <span style="color:var(--primary)">' + esc(romanText(it)) + '</span>' : '') + '</div>' : '') +
                (it.type === 'arrange' ? '<div style="margin-top:5px">정답: <span class="native">' + esc(it.tokens.join(CUR.joiner)) + '</span></div>' :
                    '<div style="margin-top:5px">정답: <b>' + esc(it.choices[it.answer]) + '</b></div>') +

        });
    }
    let acts = '<div class="result-actions">';
    if (l.warm) {
        acts += '<button class="btn block" id="rWarmDone">레슨 시작하기 →</button>';
    } else if (skipUnit !== undefined) {
        const nxt = pass ? nextSkipUnit() : null;
        if (nxt !== null) acts += '<button class="btn block" id="rSkipNext">⏩ 다음 ' + esc(unitLabel(UNITS.find(u => u.unitId === nxt))) + ' 시험도 볼까요?</button>';
        acts += '<button class="btn block' + (nxt !== null ? ' ghost' : '') + '" id="rHome">학습 경로로</button>';
    } else if (l.redo) {
        acts += '<button class="btn block" id="rBackReview">복습 탭으로</button>';
    } else if (pass && !partial) {
        if (hasNext) acts += '<button class="btn block" id="rNext">다음 레슨 →</button>';
        acts += '<button class="btn block ' + (hasNext ? 'ghost' : '') + '" id="rHome">학습 경로로</button>';
    } else {
        acts += '<button class="btn block" id="rRetry">다시 도전!</button>' +
            '<button class="btn block ghost" id="rStudy">단어 다시 보기</button>';
    }
    acts += '</div>';
    if (skipUnit !== undefined) { const hb = h.indexOf('@@ACTIONS@@'); h = h.slice(0, hb) + acts + h.slice(hb + 11); }
    else h = h.replace('@@ACTIONS@@', acts);
    body.innerHTML = h;
    if (gained && !q.xpGiven) {
        q.xpGiven = true;
        if (pass && !partial) { celebrate(); sfx('level'); }
        addXp(gained, partial ? '오답 복습' : (q.score === total ? '만점!' : '레슨 통과'));
    }
    const rn = document.getElementById('rNext');
    if (rn) rn.addEventListener('click', () => openLesson(gIdx + 1));
    const rh = document.getElementById('rHome');
    if (rh) rh.addEventListener('click', () => { S.quiz = null; S.skip = null; S.openUnit = null; go('home'); });
    if (skipUnit !== undefined && pass && skipped && !q.skipCheered) { q.skipCheered = true; celebrate(); sfx('level'); addXp(skipped * 5, '단계 건너뛰기'); }
    const rr = document.getElementById('rRetry');
    if (rr) rr.addEventListener('click', () => { S.quiz = newQuizState(null, (q.attempt || 0) + 1); renderQuiz(body, l); });
    const rs = document.getElementById('rStudy');
    if (rs) rs.addEventListener('click', () => { S.quiz = null; S.step = 0; renderStep(); });

    const rsn = document.getElementById('rSkipNext');
    if (rsn) rsn.addEventListener('click', () => startSkipTest(nextSkipUnit()));
    const rwd = document.getElementById('rWarmDone');
    if (rwd) rwd.addEventListener('click', endMini);
    const rb = document.getElementById('rBackReview');
    if (rb) rb.addEventListener('click', () => { S.redo = null; S.quiz = null; go('review'); });
    body.querySelectorAll('[data-recall]').forEach(el => el.addEventListener('click', () => {
        el.classList.add('open');
        const b3 = [bossOf(l)].concat((l.keySentences || []).filter(x => x !== bossOf(l)).sort((a, c) => nativeText(a).length - nativeText(c).length).slice(0, 2)).filter(Boolean);
        const x = b3[parseInt(el.dataset.recall, 10)]; if (x) speak(nativeText(x), 0.95);
    }));
    const ry = document.getElementById('remindYes');
    if (ry) ry.addEventListener('click', () => {
        const d = new Date(); let m = Math.round(d.getMinutes() / 30) * 30, hr = d.getHours(); if (m === 60) { m = 0; hr = (hr + 1) % 24; }
        store.seen.remindOffer = todayStr(); addReminder(pad2(hr) + ':' + pad2(m)); const c = document.getElementById('remindOffer'); if (c) c.remove();
    });
    const rno = document.getElementById('remindNo');
    if (rno) rno.addEventListener('click', () => { store.seen.remindOffer = todayStr(); save(); const c = document.getElementById('remindOffer'); if (c) c.remove(); });
    const ct = document.getElementById('copyToday');
    if (ct) ct.addEventListener('click', () => copyText((l.keySentences || []).map((x, i) => (i + 1) + '. ' + nativeText(x) + (romanText(x) ? ' (' + romanText(x) + ')' : '') + ' — ' + x.ko).join('\n'), '📋 오늘 문장을 복사했어요. 카톡 나에게 보내기로 다시 보세요!'));
    const bb = document.getElementById('bossBtn');
    if (bb) bb.addEventListener('click', () => openSpeak({
        item: boss, mode: 'boss',
        onPass: score => {
            const p = prog();
            if (!p.boss) p.boss = {};
            const first = !p.boss[l.id];
            if (first) p.boss[l.id] = { score: score, date: todayStr() };
            else { if ((score || 0) > (p.boss[l.id].score || 0)) p.boss[l.id].score = score; p.boss[l.id].last = todayStr(); }
            save();
            const dl = dayLog(); dl.boss = (dl.boss || 0) + 1; save();
            if (first) { addXp(XP.boss, '보스 클리어 👑'); celebrate(); } else checkQuests();
        },
        onClose: () => { if (S.view === 'lesson' && S.quiz === q) renderQuizResult(body, l); },
    }));
}

/* ═══════════════════ SRS 복습 ═══════════════════ */
function mistakeItems() {
    const out = [], m = prog().mistakes || {};
    Object.keys(m).forEach(k => {
        const hashAt = k.lastIndexOf('#');
        const lid = k.slice(0, hashAt), qi = parseInt(k.slice(hashAt + 1), 10);
        const li = LESSON_BY_ID[lid];
        if (li === undefined) return;
        const it = (ALL[li].quiz || [])[qi];
        if (!it) return;
        out.push(Object.assign({}, it, { srcLesson: lid, srcIdx: qi, srcTitle: ALL[li].title }));
    });
    return out;
}
function renderReview() {
    if (S.redo) {           // 오답 노트 다시 풀기 — 레슨 퀴즈 엔진을 그대로 사용
        if (!document.getElementById('stepBody')) $main.innerHTML = '<div class="lesson-top"><button class="back-btn" id="redoBack" aria-label="뒤로">←</button><div><div class="lt-title">📝 오답 노트</div><div class="lt-sub">틀렸던 문제만 모아 다시 풀어요 · 맞히면 노트에서 빠져요</div></div></div><div id="stepBody"></div>';
        const bk = document.getElementById('redoBack');
        if (bk) bk.addEventListener('click', () => { S.redo = null; S.quiz = null; go('review'); });
        renderQuiz(document.getElementById('stepBody'), S.redo);
        return;
    }
    if (S.match) { renderMatch(); return; }
    if (!S.review) {
        const due = dueCards();
        const totalCards = Object.keys(prog().srs).length;
        const mistakes = mistakeItems();
        let h = '';
        if (!totalCards) {
            h += '<div class="empty-state" style="padding:36px 20px 20px"><div class="es-emoji">🃏</div><b>아직 복습할 단어가 없어요</b><br>레슨 퀴즈를 통과하면 배운 단어가<br>자동으로 복습함에 담깁니다!</div>';
        } else if (!due.length) {
            const boxes = [0, 0, 0, 0, 0, 0, 0];
            Object.values(prog().srs).forEach(c => boxes[Math.max(0, Math.min(6, c.box - 1))]++);
            const tomorrow = Object.values(prog().srs).filter(c => !c.mastered && c.due === todayStr(1)).length;
            const reviewedToday = (dayLog().reviews || 0) > 0;
            h += '<div class="empty-state" style="padding:30px 20px 16px"><div class="es-emoji">' + (reviewedToday ? '🎉' : '🌙') + '</div><b>' + (reviewedToday ? '오늘 복습 끝!' : '오늘은 복습할 카드가 없어요') + '</b><br>' +
                (reviewedToday ? '모든 카드를 복습했어요. 내일 또 만나요.' : '방금 배운 단어는 잊어버릴 때쯤인 <b>내일부터</b> 복습 카드로 나와요.') + '<br><br>' +
                '<div class="muted">단어함 현황 — 총 ' + totalCards + '장<br>' +
                boxes.map((b, i) => '⭐' + (i + 1) + ' ' + b + '장').join(' · ') + '<br>🎓 졸업 ' + Object.values(prog().srs).filter(c => c.mastered).length + '장 · 내일 예정 ' + tomorrow + '장</div></div>';
        } else {
            h += '<div class="card" style="text-align:center;padding:24px 18px">' +
                '<div style="font-size:44px">🃏</div>' +
                '<div style="font-size:17px;font-weight:800;margin:10px 0 4px">오늘의 복습</div>' +

                '<div style="display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap"><button class="btn" id="startReview">복습 시작 (' + Math.min(sessionCap(), due.length) + '장)</button>' +

            '<button class="btn block ghost" id="startRedo"' + (mistakes.length ? '' : ' disabled') + '>오답만 다시 풀기' + (mistakes.length ? ' (' + Math.min(10, mistakes.length) + '문제)' : '') + '</button></div>';

            '<div style="display:flex;gap:8px"><button class="btn block ghost" id="startMatch"' + (totalCards >= 4 ? '' : ' disabled') + '>게임 시작</button>' +
            '<button class="btn block ghost" id="startMatchEar"' + (totalCards >= 4 ? '' : ' disabled') + '>🔊 듣고 짝 맞추기</button></div></div>';
        $main.innerHTML = h;
        const sr = document.getElementById('startReview');
        if (sr) sr.addEventListener('click', () => {

        const rd = document.getElementById('startRedo');

            (r.grad ? '<br>🎓 ' + r.grad + '장은 완전히 외워서 졸업했어요!' : '') + '<br><span class="muted">내일 복습 예정 ' + tomorrow + '장</span></div></div>' +

        if (r.flipped) h += (c.pinyin ? '<div class="pinyin">' + esc(c.pinyin) + '</div>' : '') + (c.koPron ? pronLine(c.koPron, c.box) : '') + '<div class="ko">' + esc(c.ko) + '</div>';
    }

        '<button class="play-btn slow" id="fcPlaySlow" style="width:44px;height:44px;font-size:18px" aria-label="느리게 듣기">🐢</button></div>';
    h += '</div>';
    if (!r.flipped) {
        if (rev) h += '<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn block" id="fcSpeak">🎤 말해 보기</button>' + (r.hint ? '' : '<button class="btn gray" id="fcHintBtn" style="white-space:nowrap">💡 힌트</button>') + '</div>';
        h += '<button class="btn block' + (rev ? ' ghost' : '') + '" id="fcFlip">' + (rev ? '👀 정답 보기' : '뜻 확인하기') + '</button>' +
            '<div class="muted" style="text-align:center;margin-top:10px">' + (rev ? '소리 내어 말해 본 다음 정답을 확인하세요!' : '발음을 듣고, 뜻을 먼저 떠올려 본 다음 확인하세요!') + '</div>';
    } else {
        h += '<div class="grade-row three">' +
            '<button class="btn fail" id="fcFail">❌ 몰랐어요</button>' +
            '<button class="btn hard" id="fcHard">😅 헷갈렸어요</button>' +
            '<button class="btn pass" id="fcPass">✅ 기억했어요</button></div>' +
            '<div class="muted" style="text-align:center;margin-top:10px">' + (c.relearn ? '🔁 다시 잡기 — 상자는 그대로예요' : '⭐' + c.box + ' → ' + (c.box >= SRS_MAX ? '기억하면 🎓 졸업!' : '기억하면 ' + SRS_INTERVALS[c.box + 1] + '일 뒤에 다시 만나요')) + '</div>';
    }
    h += '<button class="btn small gray" id="fcQuit" style="display:block;margin:14px auto 0">그만하기</button>';
    $main.innerHTML = h;
    const pl = document.getElementById('fcPlay');
    if (pl) pl.addEventListener('click', () => speak(c.tts || c.native, 0.95));
    const pls = document.getElementById('fcPlaySlow');
    if (pls) pls.addEventListener('click', () => speak(c.tts || c.native, 0.7));
    const ff = document.getElementById('fcFlip');
    if (ff) ff.addEventListener('click', () => { r.flipped = true; renderReview(); if (rev) setTimeout(() => speak(c.native, 0.95), 150); });
    const fh = document.getElementById('fcHintBtn');
    if (fh) fh.addEventListener('click', () => { r.hint = true; renderReview(); });
    const fs = document.getElementById('fcSpeak');
    if (fs) fs.addEventListener('click', () => openSpeak({
        item, mode: 'boss', title: '🎤 뜻 보고 말하기',
        onPass: (score, info) => { r.spoken = !(r.hint || (info && (info.help || info.self))); },   // 힌트·정답을 보거나 듣고 말한 경우는 스스로 채점
        onClose: () => { if (S.review !== r) return; if (r.spoken) { r.spoken = false; grade('ok'); } else { r.flipped = true; renderReview(); } },
    }));
    if (!rev && !r.flipped && r.autoFor !== r.i) { r.autoFor = r.i; setTimeout(() => { if (S.review === r && r.i === r.autoFor && !r.flipped) speak(c.native, 0.95); }, 300); }
    const fp = document.getElementById('fcPass');
    if (fp) fp.addEventListener('click', () => grade('ok'));
    const fhd = document.getElementById('fcHard');
    if (fhd) fhd.addEventListener('click', () => grade('hard'));
    const fl = document.getElementById('fcFail');
    if (fl) fl.addEventListener('click', () => grade('fail'));
    document.getElementById('fcQuit').addEventListener('click', () => { r.stopped = true; renderReview(); });

    function grade(res) {
        const card = prog().srs[c.key];
        if (c.relearn) {                       // 다시 잡기 카드는 상자를 바꾸지 않는다
            if (res === 'ok') showToast('✔ 다시 잡았어요!');
        } else if (card && c.keepCheck) {      // 유지 점검
            if (res === 'ok') { card.mastered = todayStr(); card.keep = (card.keep || 0) + 1; showToast('🎓 아직 잘 기억하고 있어요!'); }
            else { delete card.mastered; card.box = 3; card.due = todayStr(1); }
            const dl = dayLog(); dl.reviews = (dl.reviews || 0) + 1; r.graded++; save(); addXp(XP.review, '', true);
        } else if (card) {
            if (res === 'ok' && card.box >= SRS_MAX) { card.mastered = todayStr(); r.grad = (r.grad || 0) + 1; }
            else if (res === 'ok') { card.box = Math.min(SRS_MAX, card.box + 1); card.due = todayStr(SRS_INTERVALS[card.box]); }
            else if (res === 'hard') { card.due = todayStr(1); }
            else { card.box = Math.max(1, card.box - 2); card.due = todayStr(1); }
            // 한 장마다 바로 기록·보상(중간에 그만둬도 퀘스트·달력에 잡힘)
            const dl = dayLog(); dl.reviews = (dl.reviews || 0) + 1; r.graded++;
            save();
            addXp(XP.review, '', true);
            // 틀린 카드는 세션 끝에 한 번 더(맞히고 끝나도록)
            if (res === 'fail' && !r.queue.some((x, k) => k > r.i && x.key === c.key)) r.queue.push(Object.assign({}, c, { relearn: true }));
        }
        if (res === 'ok') r.okCnt++; else if (!c.relearn) r.failCnt++;
        r.i++; r.flipped = false; r.hint = false;
        renderReview();
    }
}

/* ═══════════════════ 워밍업 (지난 레슨 섞어 떠올리기) ═══════════════════ */
function warmupItems(l) {
    const p = prog();
    if (isDone(l.id) || (p.steps && p.steps[l.id]) || (p.warm && p.warm[l.id])) return [];
    const idx = LESSON_BY_ID[l.id];
    const prev = ALL.slice(0, idx).filter(x => isDone(x.id) && !p.completed[x.id].imported).slice(-3);
    if (!prev.length) return [];
    const out = [];
    const mist = mistakeItems().filter(x => x.type !== 'arrange');
    if (mist.length) out.push(mist[Math.abs(hashStr(todayStr() + l.id)) % mist.length]);
    const pool = [];
    prev.forEach(x => (x.quiz || []).forEach((it, qi) => { if (it.type !== 'arrange' && it.type !== 'tone') pool.push(Object.assign({}, it, { srcLesson: x.id, srcIdx: qi, srcTitle: x.title })); }));
    seededShuffle(pool, hashStr(l.id + todayStr())).forEach(it => { if (out.length < 3 && !out.some(o => o.srcLesson === it.srcLesson && o.srcIdx === it.srcIdx)) out.push(it); });
    return out;
}
function renderMini() {
    const m = S.mini;
    if (!m) { go('home'); return; }
    $main.innerHTML = '<div class="lesson-top"><button class="back-btn" id="miniBack" aria-label="뒤로">←</button><div><div class="lt-title">🔥 ' + esc(m.l.title) + '</div>' +
        '<div class="lt-sub">지난 레슨에서 3문제 — 틀려도 괜찮아요, 오답 노트가 기억해 둬요</div></div></div><div id="stepBody"></div>';
    document.getElementById('miniBack').addEventListener('click', () => endMini());
    renderQuiz(document.getElementById('stepBody'), m.l);
}
function endMini() {
    const m = S.mini; S.mini = null; S.quiz = null;
    const p = prog(); if (!p.warm) p.warm = {};
    if (m && ALL[m.backIdx]) { p.warm[ALL[m.backIdx].id] = todayStr(); save(); openLesson(m.backIdx, 0); }
    else go('home');
}

function startSkipTest(unitId) {
    const u = UNITS.find(x => x.unitId === unitId);
    if (!u) return;
    const pool = [];
    u.lessons.forEach(l => (l.quiz || []).forEach((it, qi) => { if (it.type !== 'tone') pool.push(Object.assign({}, it, { srcLesson: l.id, srcIdx: qi, srcTitle: l.title })); }));
    const pick = seededShuffle(pool, hashStr(todayStr() + 'skip' + unitId + Date.now())).slice(0, 10);
    S.skip = { id: '__skip' + unitId, title: unitLabel(u) + ' 건너뛰기 시험', skipUnit: unitId, quiz: pick, words: [] };
    S.quiz = newQuizState();
    go('skipTest');
}
function renderSkipTest() {
    const l = S.skip;
    if (!l) { go('home'); return; }
    $main.innerHTML = '<div class="lesson-top"><button class="back-btn" id="skipBack" aria-label="뒤로">←</button><div><div class="lt-title">⏩ ' + esc(l.title) + '</div>' +

    document.getElementById('skipBack').addEventListener('click', () => { S.skip = null; S.quiz = null; go('home'); });

}
function applySkipPass(unitId) {
    const u = UNITS.find(x => x.unitId === unitId), p = prog();
    let n = 0;
    u.lessons.forEach((l, li) => {
        if (p.completed[l.id]) return;
        const t = (l.quiz || []).length;
        p.completed[l.id] = { score: Math.ceil(t * 0.8), total: t, date: todayStr(), placed: true };
        (l.words || []).forEach((w, wi) => {
            addSrsCard(p, { native: nativeText(w), pinyin: romanText(w), ko: w.ko, koPron: w.koPron || '', box: 2, due: todayStr(1 + ((li * 3 + wi) % 14)) });
        });
        n++;
    });
    save();
    return n;
}

/* ═══════════════════ 짝 맞추기 게임 ═══════════════════ */
function shortKo(ko) { return String(ko || '').replace(/\s*\([^)]*\)\s*/g, ' ').replace(/\s+/g, ' ').trim() || ko; }
function newMatch(size, fromWords, quick) {
    const cards = fromWords ? fromWords.map(w => ({ native: nativeText(w), ko: shortKo(w.ko) }))
        : Object.values(prog().srs).filter(c => c.native && c.ko).sort((a, b) => a.box - b.box).slice(0, 30).map(c => ({ native: c.native, ko: shortKo(c.ko) }));
    const seen = new Set(), pick = [];
    const n = size || 6;
    seededShuffle(cards, hashStr(String(Date.now()))).forEach(c => { if (pick.length < n && !seen.has(c.native) && !seen.has(c.ko)) { seen.add(c.native); seen.add(c.ko); pick.push(c); } });
    return {
        pairs: pick, left: seededShuffle(pick.map((c, i) => i), hashStr('L' + Date.now())), right: seededShuffle(pick.map((c, i) => i), hashStr('R' + Date.now())),
        done: {}, selL: null, miss: 0, start: Date.now(), quick: !!quick, back: S.view,
    };
}
function renderMatch() {
    const m = S.match;
    const n = m.pairs.length, got = Object.keys(m.done).length;
    if (got >= n) {
        const sec = Math.round((Date.now() - m.start) / 1000);
        const dl = dayLog();
        const give = (dl.matchXp || 0) < XP.match * 3 ? XP.match : 0;
        if (!m.rewarded) {
            m.rewarded = true; dl.matchXp = (dl.matchXp || 0) + give;
            if (m.miss === 0) { store.flags.matchPerfect = todayStr(); }
            logActivity('match'); if (give) addXp(give, '짝 맞추기'); celebrate(); sfx('level');
            if (m.quick) finishQuick();
        }
        $main.innerHTML = '<div class="result-hero"><div class="r-emoji">🧩</div><div class="r-score" style="color:var(--primary)">' + sec + '초</div>' +
            '<div class="r-msg">' + n + '쌍을 모두 맞혔어요! 실수 ' + m.miss + '번' + (m.miss === 0 ? ' — 완벽! 🏆' : '') + '</div></div>' +
            '<div style="display:flex;gap:10px"><button class="btn block" id="mAgain">한 판 더!</button><button class="btn block ghost" id="mExit">복습 탭으로</button></div>';
        document.getElementById('mAgain').addEventListener('click', () => { S.match = newMatch(m.pairs.length, m.fromLesson ? ALL[m.fromLesson - 1].words : null); S.match.fromLesson = m.fromLesson; renderMatch(); });
        document.getElementById('mExit').addEventListener('click', () => { const back = m.fromLesson; S.match = null; if (back) { openLesson(back - 1, 1); } else if (S.view === 'review') renderReview(); else go('review'); });
        return;
    }
    let h = '<div class="quiz-prog"><div class="qp-bar"><div style="width:' + (got / n * 100) + '%"></div></div><div class="qp-txt">' + got + ' / ' + n + ' 쌍</div></div>' +
        '<div class="quiz-q">' + (m.ear ? '🔊 왼쪽 소리를 듣고, 알맞은 뜻을 오른쪽에서 고르세요' : '🧩 왼쪽 단어를 누르고, 알맞은 뜻을 오른쪽에서 고르세요') + '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
        '<div>' + m.left.map((i, pos) => '<button class="choice-btn' + (m.done[i] ? ' correct' : '') + (m.selL === i ? ' sel' : '') + '" data-ml="' + i + '"' + (m.done[i] ? ' disabled' : '') + ' style="text-align:center;' + (m.selL === i ? 'border-color:var(--primary);background:var(--red-soft)' : '') + '"' + (m.ear && !m.done[i] ? ' aria-label="소리 ' + (pos + 1) + '"' : '') + '>' +
            (m.ear && !m.done[i] ? '🔊 ' + (pos + 1) : '<span class="native">' + esc(m.pairs[i].native) + '</span>') + '</button>').join('') + '</div>' +
        '<div>' + m.right.map(i => '<button class="choice-btn' + (m.done[i] ? ' correct' : '') + '" data-mr="' + i + '"' + (m.done[i] ? ' disabled' : '') + ' style="text-align:center;font-size:13.5px">' + esc(m.pairs[i].ko) + '</button>').join('') + '</div>' +
        '</div><button class="btn block gray" id="mQuit" style="margin-top:8px">그만하기</button>';
    $main.innerHTML = h;
    $main.querySelectorAll('[data-ml]').forEach(b => b.addEventListener('click', () => {
        const i = parseInt(b.dataset.ml, 10);
        m.selL = i; speak(m.pairs[i].native, 0.95); renderMatch();
    }));
    $main.querySelectorAll('[data-mr]').forEach(b => b.addEventListener('click', () => {
        const i = parseInt(b.dataset.mr, 10);
        if (m.selL === null) { showToast('먼저 왼쪽 단어를 골라 주세요 👈'); return; }
        if (i === m.selL) { m.done[i] = true; m.selL = null; sfx('ok'); renderMatch(); }
        else { m.miss++; sfx('bad'); b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 450); }
    }));
    document.getElementById('mQuit').addEventListener('click', () => { const back = m.fromLesson; S.match = null; if (back) openLesson(back - 1, 0); else renderReview(); });
}
