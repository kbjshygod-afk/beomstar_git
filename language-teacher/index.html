    <style>
        :root {
            --primary: #d92332;
            --primary-dark: #a01526;
            --gold: #f0a500;
            --gold-light: #fff4d6;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --red-soft: #fdf0f0;
            --native-font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Malgun Gothic", sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 45%, var(--gold) 135%);
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            color: var(--text);
            transition: background .25s;
        }
        .app {
            width: 100%; max-width: 680px;
            background: var(--bg);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            overflow: hidden;
            display: flex; flex-direction: column;
            height: 94vh; max-height: 860px;
        }
        /* ── Header ─────────────────────────── */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; padding: 14px 20px;
            display: flex; align-items: center; gap: 12px;
            flex-shrink: 0;
        }
        .avatar {
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.2); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; flex-shrink: 0; cursor: pointer;
        }
        .header h1 { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header p  { font-size: 11px; opacity: 0.85; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header .hdr-text { min-width: 0; flex: 1; }
        .header-right { margin-left: auto; text-align: right; font-size: 11.5px; line-height: 1.5; white-space: nowrap; flex-shrink: 0; }
        .lang-switch-btn {
            background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); color: white;
            border-radius: 10px; padding: 6px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
            margin-left: 10px; flex-shrink: 0; font-family: inherit;
        }
        /* ── Content ────────────────────────── */
        .content { flex: 1; overflow-y: auto; padding: 16px; }
        .content::-webkit-scrollbar { width: 6px; }
        .content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        /* ── Tab bar ────────────────────────── */
        .tabbar { display: flex; border-top: 1px solid var(--border); background: var(--card); flex-shrink: 0; }
        .tab {
            flex: 1; padding: 9px 4px 10px; text-align: center;
            font-size: 12px; color: var(--text-light); cursor: pointer;
            border: none; background: none; font-family: inherit; position: relative;
        }
        .tab .ico { display: block; font-size: 19px; margin-bottom: 2px; }
        .tab.active { color: var(--primary); font-weight: 700; }
        .tab .badge {
            position: absolute; top: 3px; right: calc(50% - 22px);
            background: var(--error); color: white; font-size: 10px; font-weight: 700;
            min-width: 17px; height: 17px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center; padding: 0 4px;
        }
        /* ── Common cards ───────────────────── */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        .section-title { font-size: 14px; font-weight: 700; margin: 18px 0 10px; color: var(--text); }
        .muted { color: var(--text-light); font-size: 12.5px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: var(--primary); color: white; border: none;
            padding: 12px 20px; border-radius: 12px; font-size: 15px; font-weight: 700;
            cursor: pointer; font-family: inherit; transition: transform .08s, opacity .15s;
        }
        .btn:active { transform: scale(0.97); }
        .btn.block { width: 100%; }
        .btn.ghost { background: white; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn.gray { background: #eef2f7; color: var(--text); }
        .btn.small { padding: 8px 14px; font-size: 13px; border-radius: 10px; }
        .btn:disabled { opacity: .45; cursor: default; }
        .play-btn {
            background: var(--red-soft); border: 1px solid var(--border); color: var(--primary);
            width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
            font-size: 14px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .play-btn:active { transform: scale(.92); }
        .play-btn.slow { font-size: 15px; }
        /* ── 언어 선택 화면 ─────────────────── */
        .lang-pick { padding: 10px 4px; }
        .lang-pick .lp-title { font-size: 20px; font-weight: 900; text-align: center; margin: 10px 0 4px; }
        .lang-pick .lp-sub { font-size: 13px; color: var(--text-light); text-align: center; margin-bottom: 22px; word-break: keep-all; }
        .lang-card {
            display: flex; align-items: center; gap: 14px;
            background: var(--card); border: 2px solid var(--border); border-radius: 18px;
            padding: 18px; margin-bottom: 14px; cursor: pointer; transition: border-color .15s, transform .08s;
        }
        .lang-card:active { transform: scale(.98); }
        .lang-card .lc-emoji { font-size: 40px; flex-shrink: 0; }
        .lang-card .lc-name { font-size: 18px; font-weight: 800; }
        .lang-card .lc-desc { font-size: 12px; color: var(--text-light); margin-top: 2px; }
        .lang-card .lc-arrow { margin-left: auto; font-size: 20px; color: var(--text-light); }
        .lang-card.zh:hover, .lang-card.zh:active { border-color: #d92332; }
        .lang-card.es:hover, .lang-card.es:active { border-color: #c60b1e; }
        .lang-card.ja:hover, .lang-card.ja:active { border-color: #bc002d; }
        .lang-card.fr:hover, .lang-card.fr:active { border-color: #0055a4; }
        .lang-card.en:hover, .lang-card.en:active { border-color: #0a3161; }
        .lang-card .lc-course { font-size: 11px; color: var(--text-light); margin-top: 3px; font-weight: 700; }
        .lang-card .lc-prog { font-size: 11px; font-weight: 800; color: var(--success); margin-top: 3px; }
        /* ── Home ───────────────────────────── */
        .stats-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 6px; text-align: center; }
        .stat .num { font-size: 17px; font-weight: 800; color: var(--primary); }
        .stat .lbl { font-size: 10.5px; color: var(--text-light); margin-top: 2px; }
        .continue-card {
            background: linear-gradient(135deg, var(--primary), var(--gold));
            color: white; border-radius: 16px; padding: 16px; margin-bottom: 6px; cursor: pointer;
        }
        .continue-card .cc-label { font-size: 11px; opacity: .85; }
        .continue-card .cc-title { font-size: 17px; font-weight: 800; margin: 4px 0 2px; }
        .continue-card .cc-goal { font-size: 12px; opacity: .9; }
        .guide-banner {
            background: var(--gold-light); border: 1px solid #f2d98c;
            border-radius: 12px; padding: 10px 14px; font-size: 13px;
            margin: 10px 0 4px; cursor: pointer; color: #7a5b00; font-weight: 600;
        }
        .unit-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
        .unit-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
        .unit-icon {
            width: 44px; height: 44px; border-radius: 12px; background: var(--red-soft);
            display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
        }
        .unit-head .u-title { font-size: 15px; font-weight: 700; }
        .unit-head .u-sub { font-size: 11.5px; color: var(--text-light); margin-top: 2px; }
        .unit-right { margin-left: auto; text-align: right; flex-shrink: 0; }
        .unit-right .u-prog { font-size: 12px; font-weight: 700; color: var(--primary); }
        .unit-right .chev { font-size: 11px; color: var(--text-light); }
        .prog-bar { height: 5px; background: #f1f5f9; }
        .prog-bar > div { height: 100%; background: linear-gradient(90deg, var(--primary), var(--gold)); transition: width .3s; }
        .lesson-list { border-top: 1px solid var(--border); }
        .lesson-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .lesson-row:last-child { border-bottom: none; }
        .lesson-row.locked { opacity: .5; cursor: default; }
        .lesson-num {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; background: #eef2f7; color: var(--text-light);
        }
        .lesson-row.done .lesson-num { background: var(--success); color: white; }
        .lesson-row.current .lesson-num { background: var(--primary); color: white; }
        .lesson-row .l-title { font-size: 14px; font-weight: 600; }
        .lesson-row .l-goal { font-size: 11.5px; color: var(--text-light); margin-top: 1px; }
        .lesson-row .l-state { margin-left: auto; font-size: 15px; flex-shrink: 0; }
        /* ── Lesson view ────────────────────── */
        .lesson-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .back-btn { background: white; border: 1px solid var(--border); border-radius: 12px; width: 42px; height: 42px; font-size: 17px; cursor: pointer; flex-shrink: 0; }
        .lesson-top .lt-title { font-size: 16px; font-weight: 800; }
        .lesson-top .lt-sub { font-size: 11.5px; color: var(--text-light); }
        .steps { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
        .step-chip {
            padding: 10px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
            background: white; border: 1.5px solid var(--border); color: var(--text-light);
            cursor: pointer; font-family: inherit;
        }
        .step-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
        .word-row {
            display: flex; align-items: center; gap: 12px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
        }
        .word-main { flex: 1; min-width: 0; }
        .native { font-family: var(--native-font); font-weight: 700; }
        .word-row .native { font-size: 22px; }
        .word-row .pinyin { font-size: 13px; color: var(--primary); font-weight: 600; margin-top: 1px; }
        .word-row .pron { font-size: 13px; color: #7a5200; margin-top: 1px; font-weight: 600; }
        .word-row .ko { font-size: 14px; color: #475569; margin-top: 2px; }
        .word-btns { display: flex; gap: 6px; flex-shrink: 0; }
        .sent-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .sent-card .native { font-size: 19px; line-height: 1.5; }
        .sent-card .pinyin { font-size: 13px; color: var(--primary); font-weight: 600; margin-top: 3px; }
        .sent-card .pron { font-size: 13px; color: #7a5200; margin-top: 2px; font-weight: 600; }
        .sent-card .ko { font-size: 14.5px; color: var(--text); margin-top: 5px; }
        .sent-card .note { font-size: 12px; color: var(--text-light); margin-top: 6px; background: #f8fafc; border-radius: 8px; padding: 7px 10px; }
        .sent-head { display: flex; align-items: flex-start; gap: 10px; }
        .sent-head .word-btns { margin-left: auto; }
        .tip-box {
            background: var(--gold-light); border: 1px solid #f2d98c; border-radius: 12px;
            padding: 12px 14px; font-size: 13px; margin: 14px 0 8px; line-height: 1.6;
        }
        .tip-box b { color: #7a5b00; }

        .hist-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
        .hist-stats .stat .num { font-size: 15px; }
        .hist-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .hist-nav .hn-title { font-size: 15px; font-weight: 800; }
        .hist-nav button { background: white; border: 1px solid var(--border); border-radius: 10px; width: 32px; height: 32px; font-size: 14px; cursor: pointer; font-family: inherit; }
        .hist-nav button:disabled { opacity: .35; cursor: default; }
        .hist-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 16px; }
        .hist-dow { text-align: center; font-size: 10.5px; color: var(--text-light); font-weight: 700; padding-bottom: 4px; }
        .hist-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; font-size: 12px; cursor: pointer; background: #f8fafc; color: var(--text-light); border: none; font-family: inherit; }
        .hist-day.empty { visibility: hidden; cursor: default; }
        .hist-day.act { background: var(--red-soft); color: var(--text); font-weight: 700; }
        .hist-day .hd-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); margin-top: 2px; visibility: hidden; }
        .hist-day.act .hd-dot { visibility: visible; }
        .hist-day.today { box-shadow: inset 0 0 0 2px var(--primary); }
        .hist-day.sel { background: var(--primary); color: white; }
        .hist-day.sel .hd-dot { background: white; }
        .hist-date-group { margin-bottom: 14px; }
        .hist-date-group .hg-date { font-size: 12.5px; font-weight: 700; color: var(--text-light); margin-bottom: 6px; }
        .hist-entry { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
        .hist-entry .he-ico { font-size: 18px; flex-shrink: 0; }
        .hist-entry .he-title { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; }
        .hist-entry .he-score { font-size: 12px; color: var(--primary); font-weight: 700; white-space: nowrap; flex-shrink: 0; }
        .hist-reset { font-size: 12.5px; color: var(--primary); font-weight: 700; cursor: pointer; margin-bottom: 10px; display: inline-block; background: none; border: none; font-family: inherit; padding: 0; }
        .culture-box {
            background: #eef6ff; border: 1px solid #cfe3fa; border-radius: 12px;
            padding: 12px 14px; font-size: 13px; margin: 14px 0 8px; line-height: 1.6;
        }
        /* dialogue */
        .dlg-situation { font-size: 12.5px; color: var(--text-light); background: white; border: 1px dashed var(--border); border-radius: 10px; padding: 9px 12px; margin-bottom: 12px; }
        .bubble-row { display: flex; margin-bottom: 10px; gap: 8px; }
        .bubble-row.right { flex-direction: row-reverse; }
        .bubble-ava {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 16px; background: #eef2f7;
        }
        .bubble-row.right .bubble-ava { background: var(--red-soft); }
        .bubble { max-width: 82%; border-radius: 14px; padding: 10px 12px; cursor: pointer; }
        .bubble-row.left  .bubble { background: white; border: 1px solid var(--border); border-top-left-radius: 4px; }
        .bubble-row.right .bubble { background: var(--red-soft); border: 1px solid var(--border); border-top-right-radius: 4px; }
        .bubble .b-name { font-size: 10.5px; color: var(--text-light); margin-bottom: 3px; font-weight: 700; }
        .bubble .native { font-size: 16px; line-height: 1.45; }
        .bubble .pinyin { font-size: 12px; color: var(--primary); font-weight: 600; margin-top: 2px; }
        .bubble .pron { font-size: 12.5px; color: #7a5200; margin-top: 1px; font-weight: 600; }
        .bubble .ko { font-size: 13px; color: #475569; margin-top: 3px; }
        /* grammar */
        .gram-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
        .gram-card .g-title { font-size: 14.5px; font-weight: 800; margin-bottom: 6px; }
        .gram-card .g-explain { font-size: 13px; line-height: 1.65; color: var(--text); white-space: pre-line; }
        .gram-ex { display: flex; align-items: center; gap: 10px; background: #f8fafc; border-radius: 10px; padding: 9px 11px; margin-top: 8px; }
        .gram-ex .native { font-size: 15px; }
        .gram-ex .pinyin { font-size: 11.5px; color: var(--primary); font-weight: 600; }
        .gram-ex .pron { font-size: 12.5px; color: #7a5200; font-weight: 600; }
        .gram-ex .ko { font-size: 13px; color: #475569; }
        /* ── Quiz ───────────────────────────── */
        .quiz-prog { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .quiz-prog .qp-bar { flex: 1; height: 8px; background: #eef2f7; border-radius: 4px; overflow: hidden; }
        .quiz-prog .qp-bar > div { height: 100%; background: var(--primary); transition: width .25s; }
        .quiz-prog .qp-txt { font-size: 12px; font-weight: 700; color: var(--text-light); white-space: nowrap; }
        .quiz-q { font-size: 15.5px; font-weight: 700; line-height: 1.5; margin-bottom: 14px; }
        .quiz-audio { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
        .quiz-audio .btn { border-radius: 999px; }
        .choice-btn {
            display: block; width: 100%; text-align: left;
            background: var(--card); border: 1.5px solid var(--border); border-radius: 12px;
            padding: 13px 14px; font-size: 14.5px; margin-bottom: 8px; cursor: pointer;
            font-family: inherit; color: var(--text); transition: border-color .12s;
        }
        .choice-btn .native { font-size: 15.5px; }
        .choice-btn:not(:disabled):hover { border-color: #cbd5e1; }
        .choice-btn.correct { border-color: var(--success); background: #ecfdf5; font-weight: 700; }
        .choice-btn.wrong { border-color: var(--error); background: #fef2f2; }
        .choice-btn:disabled { cursor: default; }
        .tone-choice, .verb-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tone-choice .choice-btn, .verb-choice .choice-btn { text-align: center; margin-bottom: 0; }
        .arrange-area {
            min-height: 54px; background: var(--card); border: 1.5px dashed var(--border);
            border-radius: 12px; padding: 9px; margin-bottom: 12px;
            display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
        }
        .arrange-area.ok { border-color: var(--success); background: #ecfdf5; }
        .arrange-area.bad { border-color: var(--error); background: #fef2f2; }
        .token {
            background: var(--red-soft); border: 1px solid var(--border); color: var(--text);
            border-radius: 10px; padding: 8px 13px; font-size: 16px; cursor: pointer;
            font-family: var(--native-font); font-weight: 700;
        }
        .token-bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .token-bank .token { background: white; border: 1.5px solid var(--border); }
        .token-bank .token.used { opacity: .25; pointer-events: none; }
        .explain-box {
            border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.6; margin: 12px 0;
        }
        .explain-box.good { background: #ecfdf5; border: 1px solid #b7e4d0; }
        .explain-box.bad  { background: #fef2f2; border: 1px solid #f5c6c6; }
        .explain-box .eb-head { font-weight: 800; margin-bottom: 4px; font-size: 14px; }
        .explain-box .eb-answer { margin: 6px 0; }
        .explain-box .native { font-size: 16px; }
        /* quiz result */
        .result-hero { text-align: center; padding: 26px 10px 18px; }
        .result-hero .r-emoji { font-size: 52px; }
        .result-hero .r-score { font-size: 34px; font-weight: 900; margin: 8px 0 2px; }
        .result-hero .r-msg { font-size: 14px; color: var(--text-light); }
        .wrong-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; font-size: 13px; }
        .wrong-item .native { font-size: 15px; }
        /* ── SRS review ─────────────────────── */
        .flash-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 20px;
            padding: 40px 20px; text-align: center; margin-bottom: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }
        .flash-card .native { font-size: 40px; }
        .flash-card .pinyin { font-size: 18px; color: var(--primary); font-weight: 700; margin-top: 10px; }
        .flash-card .pron { font-size: 15px; color: #7a5200; margin-top: 4px; font-weight: 600; }
        .flash-card .ko { font-size: 17px; margin-top: 10px; }
        .grade-row { display: flex; gap: 10px; }
        .grade-row .btn { flex: 1; }
        .btn.fail { background: #fef2f2; color: var(--error); border: 1.5px solid #f5c6c6; }
        .btn.pass { background: #ecfdf5; color: #067a57; border: 1.5px solid #b7e4d0; }
        /* ── Tone trainer (중국어) ──────────── */
        .tone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .tone-cell { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; text-align: center; }
        .tone-cell .t-name { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
        .tone-cell .t-desc { font-size: 11px; color: var(--text-light); margin-bottom: 6px; }
        .tone-cell svg { width: 100%; height: 46px; }
        /* ── Kana dojo (일본어) ─────────────── */
        .kana-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .kana-row:last-child { margin-bottom: 0; }
        .kr-label { width: 34px; flex-shrink: 0; font-size: 10.5px; color: var(--text-light); font-weight: 700; }
        .kr-cells { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .kana-cell { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 4px 2px 5px; text-align: center; cursor: pointer; }

        .kana-cell .kc-h { font-size: 16px; font-weight: 700; line-height: 1.2; }
        .kana-cell .kc-k { font-size: 10.5px; color: var(--text-light); line-height: 1.3; }
        .kana-cell .kc-r { font-size: 9.5px; color: var(--primary); font-weight: 700; margin-top: 1px; }
        /* ── Sound dojo (프랑스어) ──────────── */
        .fr-rule { border-top: 1px solid #f1f5f9; padding: 9px 0 0; margin-top: 9px; }
        .fr-rule:first-of-type { border-top: none; margin-top: 8px; }
        .fr-rule-t { font-size: 13px; font-weight: 700; }
        .fr-rule-e { font-size: 12px; color: var(--text-light); margin-top: 2px; }
        .fr-vowel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .fr-vowel { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 8px 6px; text-align: center; cursor: pointer; }
        .fr-vowel .fv-spell { font-size: 13px; font-weight: 800; }
        .fr-vowel .fv-pron { font-size: 15px; color: var(--primary); font-weight: 800; margin: 1px 0; }
        .fr-vowel .fv-ex { font-size: 10.5px; color: var(--text-light); }
        .fr-liaison { display: flex; align-items: center; gap: 10px; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-bottom: 6px; cursor: pointer; }
        .fr-liaison:last-child { margin-bottom: 0; }
        .fr-liaison .native { font-size: 14.5px; font-weight: 700; }
        .fr-li-pron { font-size: 12.5px; color: var(--primary); font-weight: 700; }
        .fr-li-ko { font-size: 11.5px; color: var(--text-light); margin-top: 2px; }
        .fr-li-play { margin-left: auto; font-size: 16px; flex-shrink: 0; }
        /* ── Verb trainer (스페인어) ────────── */
        .pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
        .pair-cell { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; cursor: pointer; font-family: inherit; text-align: left; }
        .pair-cell .pw { font-size: 15px; font-weight: 800; }
        .pair-cell .pk { font-size: 11px; color: var(--text-light); }
        .pair-cell .pv { font-size: 12px; color: var(--primary); }
        .ear-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px; }
        .ear-chip { border: 1.5px solid var(--border); background: white; border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; color: var(--text-light); cursor: pointer; font-family: inherit; }
        .ear-chip.on { border-color: var(--primary); background: var(--primary); color: white; }
        .conj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .conj-cell { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
        .conj-cell .c-name { font-size: 13.5px; font-weight: 800; margin-bottom: 2px; color: var(--primary); }
        .conj-cell .c-desc { font-size: 11px; color: var(--text-light); margin-bottom: 8px; }
        .conj-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; border-bottom: 1px dashed #f1f5f9; }
        .conj-row:last-child { border-bottom: none; }
        .conj-row .cp { color: var(--text-light); }
        .conj-row .cf { font-weight: 700; }
        .verb-q { text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 14px; margin-bottom: 14px; }
        .verb-q .vq-pron { font-size: 26px; font-weight: 900; color: var(--primary); }
        .verb-q .vq-inf { font-size: 15px; margin-top: 6px; }
        .verb-q .vq-ko { font-size: 12px; color: var(--text-light); margin-top: 2px; }
        /* ── 읽기(동화) ─────────────────────── */
        .story-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; cursor: pointer; }
        .story-card.locked { opacity: .5; cursor: default; }
        .story-card .st-emoji { width: 46px; height: 46px; border-radius: 12px; background: var(--red-soft); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .story-card .st-title { font-size: 14.5px; font-weight: 700; }
        .story-card .st-desc { font-size: 11.5px; color: var(--text-light); margin-top: 2px; }
        .story-card .st-lv { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--primary); background: var(--red-soft); border-radius: 8px; padding: 4px 8px; white-space: nowrap; }
        .story-sent { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .story-sent .native { font-size: 18px; line-height: 1.6; }
        /* ── Guide ──────────────────────────── */
        .guide-step { display: flex; gap: 12px; margin-bottom: 12px; }
        .guide-step .gs-num {
            width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: white;
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0;
        }
        .guide-step .gs-body b { font-size: 14px; }
        .guide-step .gs-body p { font-size: 12.5px; color: var(--text-light); margin-top: 3px; line-height: 1.55; }
        .road-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .road-row:last-child { border-bottom: none; }
        .road-row .rr-badge {
            background: var(--red-soft); color: var(--primary); font-weight: 800; font-size: 11px;
            border-radius: 8px; padding: 4px 8px; white-space: nowrap; flex-shrink: 0;
        }
        .road-row.now .rr-badge { background: var(--primary); color: white; }
        .road-row .rr-desc { color: var(--text-light); font-size: 11.5px; margin-top: 1px; }
        /* ── Settings ───────────────────────── */
        .set-row { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid #f1f5f9; }
        .set-row:last-child { border-bottom: none; }
        .set-row .s-title { font-size: 14px; font-weight: 600; }
        .set-row .s-desc { font-size: 11.5px; color: var(--text-light); margin-top: 2px; }
        .set-row .s-ctl { margin-left: auto; flex-shrink: 0; }
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 13px; transition: .2s; cursor: pointer; }
        .switch .slider:before { content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%; background: white; top: 3px; left: 3px; transition: .2s; }
        .switch input:checked + .slider { background: var(--success); }
        .switch input:checked + .slider:before { transform: translateX(20px); }
        input[type=range] { width: 130px; accent-color: var(--primary); }
        .notice {
            background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px;
            padding: 10px 14px; font-size: 12.5px; color: #9a3412; margin-bottom: 12px; line-height: 1.5;
        }
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-light); font-size: 14px; line-height: 1.7; }
        .empty-state .es-emoji { font-size: 46px; margin-bottom: 10px; }

        .subnav { display: flex; gap: 6px; margin-bottom: 14px; background: #eef2f7; border-radius: 12px; padding: 4px; }
        .subnav button { flex: 1; border: none; background: none; border-radius: 9px; padding: 8px 4px; font-size: 13px; font-weight: 700; color: var(--text-light); cursor: pointer; font-family: inherit; }
        .subnav button.on { background: white; color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .stars { color: #f0a500; font-size: 12px; letter-spacing: -1px; white-space: nowrap; }
        .lesson-row .l-state { text-align: right; }
        .step-chip.done:not(.active) { border-color: var(--success); color: #067a57; }
        .choice-btn.halved { opacity: .3; pointer-events: none; }
        .choice-btn.correct { animation: pop .18s ease-out; }
        .choice-btn.wrong, .arrange-area.bad { animation: shake .3s ease-in-out; }
        @keyframes pop { 50% { transform: scale(1.04); } }
        @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .mascot-line { display: flex; gap: 8px; align-items: center; }
        .mascot-line .m-ico { font-size: 22px; flex-shrink: 0; }
        .badge-shelf { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
        .bdg { text-align: center; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 6px 2px; cursor: pointer; font-family: inherit; }
        .bdg .b-ico { font-size: 20px; }
        .bdg .b-name { font-size: 9.5px; font-weight: 800; margin-top: 1px; line-height: 1.25; }
        .bdg.off { opacity: .45; filter: grayscale(1); }
        .hist-day.frz { background: #e0f2fe; }
        .inapp-note { background: #eef6ff; border: 1px solid #cfe3fa; border-radius: 12px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 12px; line-height: 1.5; }
        .quick-card { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1.5px dashed var(--gold); border-radius: 14px; padding: 12px 14px; margin: 10px 0 4px; cursor: pointer; }
        .quick-card .qc-ico { font-size: 26px; }
        .quick-card .qc-t { font-size: 14px; font-weight: 800; }
        .quick-card .qc-d { font-size: 11.5px; color: var(--text-light); margin-top: 2px; }
        .dlg-wrap.blind .bubble .native, .dlg-wrap.blind .bubble .ko, .dlg-wrap.blind .bubble .pinyin, .dlg-wrap.blind .bubble .pron,
        .dlg-wrap.blind .narr .native, .dlg-wrap.blind .narr .ko, .dlg-wrap.blind .narr .pinyin, .dlg-wrap.blind .narr .pron { filter: blur(6px); user-select: none; }
        .skip-row { padding: 10px 16px; border-bottom: 1px solid #f1f5f9; font-size: 12.5px; color: var(--primary); font-weight: 800; cursor: pointer; background: #fcfcfd; }
        .play-btn { width: 42px; height: 42px; font-size: 15px; }
        .big-listen { width: 72px; height: 72px; border-radius: 50%; border: none; background: var(--primary); color: white; font-size: 30px; cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.15); }
        .big-listen.slow { width: 52px; height: 52px; font-size: 22px; background: white; color: var(--primary); border: 2px solid var(--primary); align-self: center; }
        .quiz-audio { align-items: center; gap: 14px; }
        .result-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
        .phase2-banner { background: var(--gold-light); border: 1px solid #f2d98c; border-radius: 12px; padding: 9px 12px; font-size: 13px; font-weight: 700; color: #7a5b00; margin-bottom: 12px; }
        .lock-prog { height: 5px; background: #eef2f7; border-radius: 3px; margin-top: 6px; overflow: hidden; }
        .lock-prog > div { height: 100%; background: var(--primary); }
        .cc-btn { display: inline-block; margin-top: 10px; background: white; color: var(--primary); font-weight: 900; font-size: 15px; border-radius: 999px; padding: 9px 18px; }
        @supports (zoom: 1) { .app.big-text { zoom: 1.12; height: calc(94vh / 1.12); max-height: calc(860px / 1.12); } }
        .fail-screen .btn { margin-top: 12px; }
        /* ── 오늘의 목표 · 레벨 ─────────────── */
        .today-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 14px; align-items: center; }
        .ring { width: 58px; height: 58px; flex-shrink: 0; position: relative; }
        .ring svg { width: 58px; height: 58px; transform: rotate(-90deg); }
        .ring .ring-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: var(--primary); line-height: 1.1; }
        .ring .ring-txt small { font-size: 9px; color: var(--text-light); font-weight: 700; }
        .today-main { flex: 1; min-width: 0; }
        .today-main .tm-lv { font-size: 14px; font-weight: 800; }
        .today-main .tm-sub { font-size: 11.5px; color: var(--text-light); margin-top: 2px; }
        .lv-bar { height: 7px; background: #eef2f7; border-radius: 4px; overflow: hidden; margin-top: 6px; }
        .lv-bar > div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--primary)); transition: width .4s; }
        .quest-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }   /* 44px 상자 칩 옆의 작은 칩이 늘어나지 않게 */
        .quest-chip { font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 3px 8px; background: #f1f5f9; color: var(--text-light); }
        .quest-chip.done { background: #ecfdf5; color: #067a57; }
        /* ── 토스트 · 축하 ─────────────────── */
        .toast-box { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); flex-direction: column-reverse; z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
        .toast { background: rgba(15,23,42,.92); color: white; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 9px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: toastIn .25s ease-out; text-align: center; }
        .toast.gold { background: linear-gradient(135deg, var(--gold), var(--primary)); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
        .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 55; overflow: hidden; }

        @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .6; } }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .storage-warn { background: #fff7ed; color: #9a3412; font-size: 12px; padding: 8px 14px; border-bottom: 1px solid #fed7aa; flex-shrink: 0; line-height: 1.5; }
        /* ── 대화: 내레이션 · 파트 ─────────── */
        .dlg-part { font-size: 11.5px; font-weight: 800; color: var(--primary); letter-spacing: .02em; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
        .dlg-part:first-child { margin-top: 0; }
        .dlg-part > .dp-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .narr { background: #f8fafc; border-left: 3px solid #cbd5e1; border-radius: 8px; padding: 7px 11px; margin: 0 0 6px; cursor: pointer; }
        .dlg-sec.closed .dlg-body { display: none; }
        .dlg-part { cursor: pointer; background: none; border: none; width: 100%; font-family: inherit; text-align: left; padding: 6px 0; }
        .dlg-part .dp-play { margin-left: auto; font-size: 11.5px; color: var(--primary); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; background: white; flex-shrink: 0; }

        .dlg-part.heard .dp-t::after { content: " ✓"; color: var(--success); }
        .lesson-row.skipped { opacity: .62; }
        .pron.fade { filter: blur(4px); cursor: pointer; user-select: none; }
        .pron.fade.show { filter: none; }
        .token.tok-ok { background: #ecfdf5; border-color: var(--success); }
        .token.tok-bad { background: #fef2f2; border-color: var(--error); }

        .word-group { font-size: 12px; font-weight: 800; color: var(--primary); margin: 12px 0 6px; }

        .gchk { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
        .gchk .gq { font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
        .gchk .choice-btn { padding: 9px 12px; margin-bottom: 6px; }
        .warm-card { background: linear-gradient(135deg, var(--gold-light), white); border: 1.5px solid var(--gold); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
        .boss-preview { font-size: 11.5px; color: var(--primary); font-weight: 700; margin-top: 3px; }
        .fc-hint { font-size: 14px; color: var(--primary); margin-top: 8px; font-weight: 700; }
        .grade-row.three .btn { padding: 12px 6px; font-size: 13.5px; }
        .dlg-situation.sit-hidden { color: var(--text-light); font-style: italic; }
        .dlg-ctrl { position: sticky; top: -16px; z-index: 5; background: var(--bg); padding: 6px 0 4px; margin-top: -6px; }
        .unit-chip.miss { cursor: pointer; border: none; font-family: var(--native-font); }
        .seg { display: inline-flex; border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; }
        .seg button { border: none; background: white; padding: 7px 9px; font-size: 12px; font-weight: 700; color: var(--text-light); cursor: pointer; font-family: inherit; }

        .rec-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
        .recall-sent { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; margin-top: 6px; cursor: pointer; }
        .recall-sent .native { display: none; }
        .recall-sent.open .native { display: block; margin-top: 4px; }
        .btn.hard { background: #fff7ed; color: #9a3412; border: 1.5px solid #fed7aa; }
        .narr .native { font-size: 15px; font-weight: 600; }
        .narr .ko { font-size: 11.5px; color: var(--text-light); margin-top: 2px; }
        .narr .pron { font-size: 12.5px; color: #7a5200; margin-top: 1px; font-weight: 600; }

    const list = items.map(x => typeof x === 'string' ? { text: x } : x).filter(x => x && x.text);
    const noClip = new Set();   // 녹음을 못 틀어 기기 음성으로 읽은 문장(클라우드 음성 재시도 때 녹음을 다시 기다리지 않게)
    let i = 0;
    const next = () => {
        if (my !== seqToken || !seqPlaying || i >= list.length) {
            if (my === seqToken) { seqPlaying = false; clearPlaying(); if (onDone) onDone(); }
            return;
        }
        const idx = i, cur = list[i++], nx = list[i];
        clearPlaying();
        if (onStep) onStep(cur, idx);
        if (my !== seqToken) return;     // onStep에서 멈췄으면(소리 안 남 등) 이 문장은 읽지 않는다
        let gap = 420;
        if (nx) {
            if (nx.part) gap = 1000;
            else if ((cur.speaker || '') !== (nx.speaker || '')) gap = 650;
            if (/[?？]\s*$/.test(cur.text)) gap += 150;
        }
        let advanced = false, dog = 0;
        const go = () => { if (advanced) return; advanced = true; clearTimeout(dog); setTimeout(next, gap); };
        const perChar = /[\u3040-\u30ff\u4e00-\u9fff]/.test(cur.text) ? 380 : 130;   // 한자·가나는 한 글자가 길다
        const k = noClip.has(idx) ? null : clipFor(cur.text, cur.speaker);
        if (k) {
            // 제시간에 시작하지 못하거나 못 받으면 playClip이 onFail → 같은 문장을 기기 음성으로.
            // 시작한 뒤 끝나지 않으면(재생이 멈춤) 녹음을 멈추고(늦게 이어서 들리지 않게) 다음 문장으로
            dog = setTimeout(() => { if (!advanced && my === seqToken) { stopClip(); go(); } }, Math.max(6000, cur.text.length * perChar * 3) + 4000);
            playClip(k, 0.92, go, () => { if (my === seqToken && !advanced) { clearTimeout(dog); noClip.add(idx); ttsLine(); } });
            const nx2 = list[i]; if (nx2) { const nu = clipUrl(nx2.text, nx2.speaker); if (nu) clipBlob(nu).catch(() => { }); }   // 다음 문장 미리 받기
            return;
        }
        ttsLine();
        function ttsLine() {
        let u;
        try { u = makeUtter(cur.text, 0.92, cur.speaker); } catch (e) { go(); return; }
        // 멈춤 감시: 끝·오류 이벤트가 안 오는 기기(목소리 0개 등)에서도 다음 문장으로 넘어간다
        // '소리 안 남'으로 판정된 뒤에는 읽을 시간만큼만 짧게 기다린다(대사마다 몇 초씩 멈춘 것처럼 보이지 않게)
        const waitMs = TTS_HEALTH.bad ? Math.max(1200, cur.text.length * perChar * 0.5)
            : Math.max(3000, cur.text.length * perChar / Math.max(0.5, curRate())) * (TTS_HEALTH.ok ? 3 : 1) + 1500;
        dog = setTimeout(() => { if (!advanced && my === seqToken) { if (!TTS_HEALTH.ok) ttsFail('timeout'); go(); } }, waitMs);
        const t0 = Date.now();
        u.onend = () => { u.__ended = true; ttsGood(); earTts(cur.text, t0); go(); };
        u.onerror = ev => { u.__ended = true; if (!cur.retried && remoteFailed(u, ev)) { cur.retried = true; i = idx; advanced = true; setTimeout(next, 50); return; } if (ttsErrorIsReal(ev)) ttsFail(ev.error); go(); };
        watchUtter(u, my);
        try { speechSynthesis.speak(u); } catch (e) { go(); }
        }
    };
    next();
}

/* ═══════════════════ 🎧 귀 시간(들은 시간 재기) ═══════════════════ */
// 원어민 녹음(없으면 기기 음성)을 실제로 들은 초를 언어별 dayLog().ls에 쌓는다. 앱 밖에서 들은 시간은 dayLog().lx(스스로 기록).
// 시간에는 XP가 없고 연속 기록도 건드리지 않는다(틀어 놓기만으로 연속 기록이 이어지지 않게). p.ear(영어 소리 훈련 기록)와는 다른 칸이다
// 세지 않는 것: 효과음(sfx)·무음 깨우기(unlockClip). 같은 날 두 기기에서 들으면 큰 쪽만 남는다(합치기가 날짜별 max — 알려진 한계)
const LS_STEPS = [
    { m: 10, ico: '👂', name: '귀가 쫑긋' },
    { m: 30, ico: '🔎', name: '소리 탐험가' },
    { m: 60, ico: '🚪', name: '귀 열림' },
    { m: 180, ico: '🎵', name: '리듬 타기' },
    { m: 300, ico: '✨', name: '귀 트임' },
    { m: 600, ico: '🎧', name: '알아듣는 귀' },
    { m: 1200, ico: '🏹', name: '소리 사냥꾼' },
    { m: 3000, ico: '🏅', name: '듣기 달인' },
    { m: 6000, ico: '👑', name: '원어민 귀' },
];
const LS_DAY_MAX = 28800, LX_DAY_MAX = 10800;   // 하루 상한: 앱에서 8시간, 앱 밖 3시간
const EAR = { cur: null, frac: 0, saveT: 0 };     // cur: 재생 중인 녹음 {tok, r} · frac: 1초가 안 되는 나머지(메모리)
function earAdd(sec) { try { if (Number.isFinite(sec)) lsAdd(sec); } catch (e) { } }   // 재생 코드가 부른다 — 여기서 난 오류가 재생을 막지 않게
// 녹음이 끊겼을 때(멈춤·다음 녹음): 0.3초 이상 들었으면 들은 만큼
function earCut() {
    const c = EAR.cur;
    EAR.cur = null;
    if (!c || c.tok !== clipTok || !clipEl) return;
    const t = clipEl.currentTime;
    if (t >= 0.3) earAdd(t / c.r);
}
// 기기 음성: 끝까지 읽은 시간(글자 수 × 글자당 시간 × 2를 넘지 않게)
function earTts(text, t0) {
    const t = String(text || ''), perChar = /[\u3040-\u30ff\u4e00-\u9fff]/.test(t) ? 380 : 130;
    earAdd(Math.min((Date.now() - t0) / 1000, t.length * perChar * 2 / 1000));
}
function lsSum(p) { let s = 0; Object.values((p && p.daily) || {}).forEach(d => { if (d) s += (d.ls || 0) + (d.lx || 0); }); return s; }   // 합계(앱 + 앱 밖) — 합계·막대 표시용
function lsApp(p) { let s = 0; Object.values((p && p.daily) || {}).forEach(d => { if (d) s += d.ls || 0; }); return s; }   // 앱에서 실제로 들은 시간 — 단계·축하·배지는 이것으로만(스스로 적은 앱 밖 시간으로 보상이 나오지 않게)
function lsTotal(code) { return lsSum(store.byLang[code]); }
function lsStep(sec) { let n = 0; LS_STEPS.forEach((x, i) => { if (sec >= x.m * 60) n = i + 1; }); return n; }   // 지난 단계 수
function fmtHM(sec) { const m = Math.floor((sec || 0) / 60); return m >= 60 ? Math.floor(m / 60) + '시간 ' + (m % 60) + '분' : m + '분'; }
function fmtMin(sec) { return sec > 0 && sec < 60 ? '1분 미만' : Math.floor((sec || 0) / 60) + '분'; }
function stepTime(m) { return m >= 60 ? m / 60 + '시간' : m + '분'; }
function earLeft(sec) { const m = Math.ceil(sec / 60); return m > 60 ? fmtHM(m * 60) : m + '분'; }   // 다음 단계까지 남은 시간(1시간이 넘으면 'N시간 M분')
function lsAdd(sec) {
    if (!CUR || !(sec > 0) || !Number.isFinite(sec)) return;
    EAR.frac += Math.min(sec, 60);   // 한 번에 최대 60초
    const n = Math.floor(EAR.frac);
    if (n < 1) return;
    EAR.frac -= n;
    const dl = dayLog(), add = Math.min(n, LS_DAY_MAX - (dl.ls || 0));
    if (add <= 0) return;
    const before = lsApp(prog());
    dl.ls = (dl.ls || 0) + add;   // touchStreak은 부르지 않는다
    earSaveSoon();
    earStepUp(before, before + add);
    const g = store.settings.earGoal || 0;
    if (g && !dl.earHit && dl.ls >= g * 60) { dl.earHit = 1; playToast('🎧 오늘 귀 시간 ' + g + '분 달성!', 'gold', 3000); setTimeout(checkQuests, 30); }
}
// 단계가 오르면 축하(판 도중이면 끝 요약으로). 더하기 전후만 비교하므로 단계를 저장하지 않아도 되풀이되지 않는다
function earStepUp(before, after) {
    const a = lsStep(before), b = lsStep(after);
    if (b <= a) return;
    const x = LS_STEPS[b - 1], msg = '🎧 귀 시간 ' + stepTime(x.m) + '! 「' + x.name + '」 단계';
    if (PLAY.cur) { PLAY.cur.notes.push(msg); return; }
    celebrate(); sfx('level'); showToast(msg, 'gold', 3400);
    setTimeout(checkBadges, 600);
}
// 저장은 3초에 한 번으로 모은다(녹음마다 저장하지 않게). 화면을 숨기거나 떠날 때는 바로
function earSaveSoon() { if (!EAR.saveT) EAR.saveT = setTimeout(() => { EAR.saveT = 0; save(); }, 3000); }
function earFlush() { if (EAR.saveT) { clearTimeout(EAR.saveT); EAR.saveT = 0; save(); } }
document.addEventListener('visibilitychange', () => { if (document.hidden) earFlush(); });   // 위의 stopSpeak(끊긴 녹음 더하기) 다음에 불린다
window.addEventListener('pagehide', () => { earCut(); earFlush(); });
// 앱 밖에서 들은 시간(+10분·+30분, 하루 3시간까지) → 더한 초
function lxAdd(min) {
    const dl = dayLog(), add = Math.min(min * 60, LX_DAY_MAX - (dl.lx || 0));
    if (add <= 0) { showToast('앱 밖 시간은 하루 3시간까지 기록돼요'); return 0; }
    dl.lx = (dl.lx || 0) + add; save();   // 앱 밖 시간은 합계·막대에만 — 단계 축하·배지는 없다
    return add;
}

// 귀 시간 화면: 홈 오늘 카드의 한 줄 → 누르면 시트(언어별 합계 · 최근 7일 · 로드맵 · 앱 밖 시간 · 하루 목표)
function earFirstDay(p) { const ds = Object.keys((p && p.daily) || {}).filter(d => ((p.daily[d].ls || 0) + (p.daily[d].lx || 0)) > 0).sort(); return ds[0] || ''; }
// 처음 7일(처음 들은 날부터) 또는 1시간 전에는 오늘 들은 시간만 — 첫 주의 작은 누적은 초라해 보이니까
function earLineHtml() {
    const p = prog(), tot = lsApp(p), dl = dayLog(), first = earFirstDay(p);   // 누적·다음 단계는 앱에서 들은 시간(단계와 같은 기준)
    let txt, bar = '';
    if (tot < 3600 || !first || dayDiff(first, todayStr()) < 7) txt = dl.lx ? '🎧 오늘 앱에서 ' + fmtMin(dl.ls || 0) + ' · 앱 밖 ' + fmtMin(dl.lx) : '🎧 오늘 들은 시간 ' + fmtMin(dl.ls || 0);   // 앱 밖 시간은 따로(퀘스트 칩은 앱에서 들은 시간 기준)
    else {
        const i = lsStep(tot), nx = LS_STEPS[i], lo = i ? LS_STEPS[i - 1].m * 60 : 0;
        txt = '🎧 귀 시간 ' + fmtHM(tot) + (nx ? ' · 다음 「' + nx.name + '」까지 ' + earLeft(nx.m * 60 - tot) : ' · 👑 마지막 단계까지 왔어요');
        bar = '<span class="ear-bar" aria-hidden="true"><span style="width:' + (nx ? Math.round((tot - lo) / (nx.m * 60 - lo) * 100) : 100) + '%"></span></span>';
    }
    return '<button class="ear-line" id="earLine" aria-label="' + esc(txt.slice(3) + ' — 귀 시간 자세히 보기') + '"><span class="el-txt">' + esc(txt) + '</span>' + bar + '</button>';
}
function earSheetHtml(ask) {   // ask: 더할지 묻는 중인 앱 밖 시간(분)
    const p = prog(), tot = lsSum(p), app = lsApp(p), i = lsStep(app), dl = dayLog(), g = store.settings.earGoal || 0;   // 합계는 앱 밖 포함 · 단계(로드맵)는 앱에서 들은 시간
    const langs = Object.keys(LANGS).map(c => ({ c, s: lsTotal(c) })).filter(x => x.s > 0 || x.c === CUR.code);
    const days = [];
    for (let k = 6; k >= 0; k--) { const ds = todayStr(-k), d = (p.daily || {})[ds] || {}; days.push({ ds, ls: d.ls || 0, lx: d.lx || 0, today: !k }); }
    const max = Math.max(600, ...days.map(x => x.ls + x.lx)), hp = v => Math.round(v / max * 100);
    let h = '<div class="ear-sheet"><div class="sheet-head"><b>🎧 귀 시간</b><button class="sheet-close" data-close-overlay aria-label="닫기">✕</button></div>' +
        '<div class="ear-hero"><b>' + fmtHM(tot) + '</b><span>' + esc(CUR.name) + ' · ' + (i ? LS_STEPS[i - 1].ico + ' ' + esc(LS_STEPS[i - 1].name) : '첫 단계까지 ' + earLeft(LS_STEPS[0].m * 60 - app)) + '</span></div>' +
        '<div class="muted">원어민 녹음을 실제로 들은 시간이에요. 시간에는 XP가 없어요 — 듣는 만큼 귀가 열려요.' + (tot > app ? ' 단계·배지는 앱에서 들은 시간(' + fmtHM(app) + ')으로 올라요.' : '') + '</div>';
    if (langs.length > 1) h += '<div class="ear-langs">' + langs.map(x => LANGS[x.c].flag + ' ' + esc(LANGS[x.c].name) + ' <b>' + fmtHM(x.s) + '</b>').join(' · ') + '</div>';
    h += '<div class="section-title">최근 7일</div><div class="week-bars ear-week">' + days.map(x => {
        const dow = x.today ? '오늘' : DOW_KO[new Date(x.ds + 'T00:00:00').getDay()], m = Math.round((x.ls + x.lx) / 60);
        return '<div class="week-bar' + (x.today ? ' today' : '') + '" aria-label="' + (x.today ? '오늘' : dow + '요일') + ' ' + fmtMin(x.ls) + (x.lx ? ', 앱 밖 ' + fmtMin(x.lx) : '') + '"><div class="wb-xp">' + (m || '') + '</div>' +
            (x.lx ? '<div class="wb-fill out" style="height:' + hp(x.lx) + '%"></div>' : '') + '<div class="wb-fill app' + (x.lx ? ' under' : '') + '" style="height:' + hp(x.ls) + '%"></div><div class="wb-dow">' + dow + '</div></div>';

    h += '<div class="section-title">귀 시간 로드맵</div><ol class="ear-road">' + LS_STEPS.map((x, k) => '<li class="' + (k < i ? 'done' : k === i ? 'now' : '') + '"><span class="er-ico" aria-hidden="true">' + (k < i ? '✓' : x.ico) + '</span><b>' + stepTime(x.m) + '</b> ' + esc(x.name) +
        (k < i ? '<span class="sr-only"> (지남)</span>' : k === i ? '<span class="er-left">' + earLeft(x.m * 60 - app) + ' 남음</span>' : '') + '</li>').join('') + '</ol>';
    h += '<div class="section-title">앱 밖에서 들은 시간</div><div class="muted">드라마·노래·팟캐스트로 ' + esc(CUR.name) + '를 들었다면 직접 더해요(하루 3시간까지). 위 막대에 연한 색으로 따로 보여요.</div>' +

            : '<div class="ear-lx"><button class="btn small ghost tap" data-lx="10">+10분</button><button class="btn small ghost tap" data-lx="30">+30분</button><span class="muted">오늘 앱 밖 ' + fmtMin(dl.lx || 0) + '</span></div>');
    h += '<div class="section-title">하루 듣기 목표</div><div class="seg ear-goal" role="group" aria-label="하루 듣기 목표">' + [0, 10, 20, 30].map(m => '<button data-eg="' + m + '" aria-pressed="' + (g === m) + '">' + (m ? m + '분' : '끔') + '</button>').join('') + '</div>' +
        '<div class="muted" style="margin-top:6px">목표를 정하면 오늘의 퀘스트에 「귀 시간」이 나올 수 있어요(앱에서 들은 시간 기준).</div></div>';
    return h;
}
// 앱 밖 시간은 한 번 더 묻고 더한다 — 저장하면 곧 클라우드로 올라가고 기기끼리는 큰 쪽으로 합쳐져 나중에 줄일 수 없으니까.
// 확인 버튼은 묻는 글 아래 줄에 있고, 묻고 0.5초 안의 누름은 받지 않는다(+30분을 두 번 눌러 확인까지 되지 않게 — 화면이 밀려 같은 자리에 와도)
function openEarSheet() {
    let ask = 0, askAt = 0;
    const sheet = openModal(earSheetHtml(), () => { if (S.view === 'home') render(); });
    const on = (sel, fn) => { const b = sheet.querySelector(sel); if (b) b.addEventListener('click', fn); };
    const bind = () => {
        sheet.querySelectorAll('[data-lx]').forEach(b => b.addEventListener('click', () => { const n = Number(b.dataset.lx); if ((dayLog().lx || 0) >= LX_DAY_MAX) { lxAdd(n); return; } ask = n; askAt = Date.now(); redraw('[data-lxok]'); }));
        on('[data-lxok]', () => { if (Date.now() - askAt < 500) return; const n = ask; ask = 0; lxAdd(n); redraw('[data-lx="' + n + '"]'); });
        on('[data-lxno]', () => { const n = ask; ask = 0; redraw('[data-lx="' + n + '"]'); });
        sheet.querySelectorAll('[data-eg]').forEach(b => b.addEventListener('click', () => { store.settings.earGoal = Number(b.dataset.eg); save(); redraw('[data-eg="' + b.dataset.eg + '"]'); }));
    };
    // 다시 그리면 닫기 버튼도 새로 묶고, 누른 버튼에 포커스를 남긴다
    const redraw = sel => { sheet.innerHTML = earSheetHtml(ask); bind(); sheet.querySelector('[data-close-overlay]').addEventListener('click', () => closeModal(false, 'cancel')); const f = sheet.querySelector(sel); if (f) f.focus(); };
    bind();
}

/* ═══════════════════ 줄 재생 엔진(놀이 공통) ═══════════════════ */
// playLine(x, {rate}) → Promise<{ok, sec}> · x = 문장 item 또는 {text, speaker}. 녹음을 먼저, 못 틀면 기기 음성.
// 실제 배속 = rate ÷ 녹음 속도 × 이 언어 말하기 속도(playClip·makeUtter와 같음). sec = 실제로 들은 초
var LINE = { fin: null };   // 지금 재생 중인 줄의 끝내기(stopSpeak·lineCut이 부른다) — stopSpeak가 먼저 정의돼 있어 var
function lineText(x) { return typeof x === 'string' ? x : !x ? '' : x.text != null ? String(x.text) : nativeText(x); }
function lineCut() { stopClip(); try { if (ttsAvailable()) speechSynthesis.cancel(); } catch (e) { } if (LINE.fin) LINE.fin(false); }
function playLine(x, o) {
    const text = lineText(x), sp = x && typeof x === 'object' ? x.speaker : undefined, rate = (o && o.rate) || 1;
    lineCut();   // 앞 줄이 아직 나오고 있으면 끊는다
    return new Promise(res => {
        if (!text || !CUR) { res({ ok: false, sec: 0 }); return; }
        const t0 = Date.now(), perChar = /[\u3040-\u30ff\u4e00-\u9fff]/.test(text) ? 380 : 130, k = clipFor(text, sp);
        let done = false, dog = 0;
        const fin = ok => { if (done) return; done = true; clearTimeout(dog); if (LINE.fin === fin) LINE.fin = null; res({ ok: !!ok, sec: (Date.now() - t0) / 1000 }); };

// given: 예전 앱의 백업 코드에서 꺼낸 기록(없으면 이 기기의 예전 앱 저장소). 합치기는 여러 번 해도 안전(레슨 합집합·새 레슨만 XP·카드 중복 없음)
function importLegacy(code, given) {
    if (!LEGACY[code]) return null;
    const p = prog();
    const info = readLegacy(code, given);
    if (!info) return null;
    // 이 기기의 예전 앱 기록은 지문이 바뀌었을 때만(초기화·'빈 기록으로 시작' 뒤에 다시 들어오지 않고, 예전 탭에서 더 한 공부는 합친다)
    const done = legacyDone(code);
    if (!given && done && done.fp === info.fp) return null;
    const { d, L } = info;
    let lessons = 0, cards = 0, spread = 0;
    info.completed.forEach(id => {
        const c = d.completed[id], total = clampInt(c.total, 1, 500, 1), score = clampInt(c.score, 0, total, 0), date = isDate(c.date) ? c.date : todayStr();
        const x = p.completed[id];
        if (!x) { p.completed[id] = { score, total, date, imported: 'legacy' }; lessons++; }
        else if (score > x.score && x.total === total) x.score = score;
    });
    info.cards.forEach(c => {
        let due = isDate(c.due) ? c.due : todayStr();
        if (due < todayStr()) due = todayStr(spread++ % 7);   // 한참 밀린 카드는 오늘~6일 뒤로 나눈다
        if (addSrsCard(p, { native: c[L.native], pinyin: L.roman ? String(c[L.roman] || '') : '', ko: String(c.ko || ''), koPron: String(c.koPron || ''), box: clampInt(c.box, 1, 5, 1), due })) cards++;
    });
    if (lessons) p.xp = (p.xp || 0) + lessons * XP.lesson;
    if (!p.lastPos && isObj(d.lastPos) && typeof d.lastPos.id === 'string' && LESSON_BY_ID[d.lastPos.id] !== undefined) p.lastPos = { id: d.lastPos.id, step: clampInt(d.lastPos.step, 0, 4, 0) };
    if (isObj(d.streak) && isDate(d.streak.last) && clampInt(d.streak.count, 0, 100000, 0) > 0) {
        const gs = store.streak, cur = curStreak(), cnt = clampInt(d.streak.count, 0, 100000, 0);
        gs.best = Math.max(gs.best || 0, cnt);
        if (dayDiff(d.streak.last, todayStr()) <= 1) {
            const u = streakUnion([{ last: d.streak.last, count: cnt }].concat(cur ? [{ last: gs.last, count: cur }] : []));
            if (u.count > cur) { gs.last = u.last; gs.count = u.count; gs.best = Math.max(gs.best, u.count); }
        }
    }
    if (isObj(d.storiesRead)) { if (!p.storiesRead) p.storiesRead = {}; Object.keys(d.storiesRead).forEach(id => { const r = d.storiesRead[id]; if (!p.storiesRead[id] && isObj(r) && isDate(r.date)) p.storiesRead[id] = { date: r.date }; }); }
    p.legacyImport = { at: todayStr(), lessons, cards };
    if (!given) legacyDone(code, info.fp);
    save();
    if (!lessons && !cards) return null;   // 이미 다 있던 기록이면 조용히 표시만
    track('legacy_import', { lessons, cards });
    return { lessons, cards, name: L.name };
}

            b.addEventListener('click', say);
            const ti = parseInt(b.dataset.turn, 10);
            if (plTabsOn() && turns[ti] && turns[ti].speaker !== 'N') longPress(b, () => { if (document.getElementById('plModes') && !(S.rpActive && S.rpActive === rolePlayToken)) shadowOpen('lesson', l.id, ti); });   // 🗣 길게 누르면 따라 하기(모드 탭이 보인 뒤 — 첫 방문 먼저 듣기 중에는 아님)
        });
        const mg = document.getElementById('missionGo');
        if (mg) mg.addEventListener('click', () => { stopSpeak(); seqPlaying = false; missionOpen(l.id, { idx: S.lessonIdx }); });
        const rp = document.getElementById('rolePlay');
        const challenge = !!(prog().roleplay && prog().roleplay[l.id]);   // 한 번 끝낸 역할극은 대본을 가린 도전 모드로
        if (rp && challenge) rp.textContent = '🎭 역할극 도전 (대본 가림)';
        if (rp) rp.addEventListener('click', () => {
            // 역할극: 상대 대사는 앱이 읽고, 내 차례(A)가 오면 말하기 창이 열린다
            // 해설(N) 줄은 건너뛰고, 내 첫 대사가 있는 파트부터 시작해 내 마지막 대사에서 끝낸다
            const firstA = turns.findIndex(t => t.speaker === 'A');
            let lastA = -1; turns.forEach((t, k) => { if (t.speaker === 'A') lastA = k; });
            let startAt = firstA;
            while (startAt > 0 && !turns[startAt].part) startAt--;
            let i = startAt, mine = 0;
            const spokeSet = new Set();
            const total = turns.filter(t => t.speaker === 'A').length;
            const tok = ++rolePlayToken;
            S.rpActive = tok;
            dexHold(() => S.rpActive === tok);   // 📒 새 스티커는 끝 토스트 하나로 묶는다(대사마다 따로 뜨지 않게)
            const step = () => {
                if (tok !== rolePlayToken || S.view !== 'lesson' || S.step !== 2) return;
                const spoke = spokeSet.size;
                if (i > lastA || i >= turns.length) {
                    S.rpActive = null;
                    showToast('🎭 역할극 완료! ' + total + '개 대사 중 ' + spoke + '개 통과' + dexHoldEnd(), 'gold', 2600);
                    const p = prog(); if (!p.roleplay) p.roleplay = {};
                    if (!p.roleplay[l.id] && spoke >= Math.ceil(total / 2)) { p.roleplay[l.id] = todayStr(); save(); addXp(5, '역할극'); celebrate(); }
                    return;
                }
                if (turns[i].speaker === 'A') {
                    const idx = i++; mine++;
                    clearPlaying(); hilite(idx);
                    speakAndDex({ item: turns[idx], mode: challenge ? 'boss' : 'repeat', title: (challenge ? '🎭 도전! 내 차례 (' : '🎭 내 차례 (') + mine + '/' + total + ')', onPass: () => { spokeSet.add(idx); },
                        onClose: (passed, reason) => {
                            if (reason === 'done') { setTimeout(step, 250); return; }
                            rolePlayToken++; S.rpActive = null; clearPlaying(); showToast('🎭 역할극을 멈췄어요' + dexHoldEnd());
                        } });
                    return;
                }
                const chunk = [];
                const start = i;
                const idxs = [];
                while (i < turns.length && turns[i].speaker !== 'A') { if (turns[i].speaker !== 'N') idxs.push(i); i++; }
                if (!idxs.length) { step(); return; }
                speakSeq(idxs.map(k => asItem(turns[k])), step, (x, k) => hilite(idxs[k]));
            };
            step();
        });
    } else if (S.step === 3) {   /* 문법 */
        let h = '<div class="muted" style="margin-bottom:10px">문법은 딱 필요한 만큼만! 예문을 소리 내어 읽으면 저절로 익혀져요.</div>';
        (l.grammar || []).forEach((g, gi) => {
            h += '<div class="gram-card"><div class="g-title">📌 ' + esc(g.title) + '</div>' +
                '<div class="g-explain">' + esc(g.explain) + '</div>';
            const exs = g.examples || [];
            exs.forEach((ex, ei) => {
                if (ei === 3) h += '<button class="btn small gray" data-more-ex="' + gi + '" style="margin-top:8px">예문 ' + (exs.length - 3) + '개 더 보기</button><div class="more-ex" data-more-box="' + gi + '" hidden>';
                h += '<div class="gram-ex"><div style="flex:1;min-width:0">' +
                    '<div class="native">' + nesc(nativeText(ex)) + '</div>' +
                    romanLine(ex) + pronLine(ex.koPron, undefined, ex) +
                    '<div class="ko">' + esc(ex.ko) + '</div></div>' + playBtns(nativeText(ex)) + '</div>';
            });
            if (exs.length > 3) h += '</div>';
            // ✋ 한 탭 확인: 같은 카드 예문끼리 뜻 보고 고르기(대부분 최소 대립이라 좋은 대조 문제가 됨)
            const cands = exs.filter((x, i, arr) => nativeText(x) && x.ko && arr.findIndex(y => nativeText(y) === nativeText(x)) === i).slice(0, 3);
            if (cands.length >= 2) {
                const tgt = cands[Math.abs(hashStr(l.id + gi)) % cands.length];
                h += '<div class="gchk" data-gchk="' + gi + '"><div class="gq">✋ 확인: “' + esc(shortKo(tgt.ko)) + '”는 어느 것일까요?</div>' +
                    seededShuffle(cands, hashStr(l.id + 'g' + gi)).map(x => '<button class="choice-btn" data-gans="' + (x === tgt ? 1 : 0) + '" data-gtext="' + esc(nativeText(x)) + '"><span class="native">' + nesc(nativeText(x)) + '</span></button>').join('') + '</div>';
            }
            h += '</div>';
        });
        h += nextStepBtn('퀴즈 풀러 가기 →');
        body.innerHTML = h;
        body.querySelectorAll('[data-more-ex]').forEach(b => b.addEventListener('click', () => { const bx = body.querySelector('[data-more-box="' + b.dataset.moreEx + '"]'); if (bx) bx.hidden = false; b.remove(); }));
        body.querySelectorAll('[data-gchk]').forEach(box => box.querySelectorAll('[data-gans]').forEach(b => b.addEventListener('click', () => {
            if (box.dataset.done) return;
            box.dataset.done = '1';
            const ok = b.dataset.gans === '1';
            box.querySelectorAll('[data-gans]').forEach(x => { x.disabled = true; if (x.dataset.gans === '1') x.classList.add('correct'); else if (x === b) x.classList.add('wrong'); });
            sfx(ok ? 'ok' : 'bad');
            const right = box.querySelector('[data-gans="1"]');
            if (right) setTimeout(() => speak(right.dataset.gtext, 0.9), 200);
            box.insertAdjacentHTML('beforeend', '<div class="muted" style="font-weight:700;color:' + (ok ? 'var(--success)' : 'var(--error)') + '">' + (ok ? '⭕ 맞아요! 규칙이 보이기 시작했어요' : '❌ 초록색이 정답이에요. 다른 부분을 비교해 보세요') + '</div>');
        })));
    } else {                     /* 퀴즈 */
        renderQuiz(body, l);
        return;
    }
    bindPlayBtns(body);
    const mtb = document.getElementById('moreTipsBtn');
    if (mtb) mtb.addEventListener('click', () => { document.getElementById('moreTips').hidden = false; mtb.remove(); });
    body.querySelectorAll('[data-mic-ks]').forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();
        const si = parseInt(b.dataset.micKs, 10), item = l.keySentences[si];
        speakAndDex({
            item,
            onPass: () => { const p = prog(); if (!p.spoke) p.spoke = {}; if (!p.spoke[l.id]) p.spoke[l.id] = {}; p.spoke[l.id][si] = 1; save(); },
            onFail: () => addSentCard(item, 0),
            onClose: () => { if (S.view === 'lesson' && S.step === 1) { const st = $main.scrollTop; renderStep(); $main.scrollTop = st; } },
        });
    }));
    const nb = document.getElementById('nextStepBtn');
    if (nb) nb.addEventListener('click', () => {
        const p = prog();
        if (!p.steps) p.steps = {};
        const sd = p.steps[l.id] || (p.steps[l.id] = {});
        const first = !sd[S.step];
        sd[S.step] = 1; save();
        const chip = $main.querySelector('.step-chip[data-step="' + S.step + '"]');
        if (chip && !chip.classList.contains('done')) { chip.classList.add('done'); chip.textContent = '✓ ' + STEP_NAMES[S.step]; }
        if (first) addXp(2, STEP_NAMES[S.step] + ' 완료');
        if (S.step === 1 && first) setTimeout(() => showToast('🏁 절반 왔어요! 여기서 쉬어도 다음엔 이 단계부터 이어져요', '', 3200), 700);
        S.step++; renderStep();
    });

    function nextStepBtn(label) {
        return '<button class="btn block" id="nextStepBtn" style="margin-top:10px">' + label + '</button>';
    }
}

/* ═══════════════════ 퀴즈 엔진 ═══════════════════ */
function renderQuiz(body, l) {
    if (!S.quiz) {
        const done = prog().completed[l.id];
        body.innerHTML = '<div class="card" style="text-align:center;padding:28px 18px">' +
            '<div style="font-size:44px">📝</div>' +
            '<div style="font-size:17px;font-weight:800;margin:10px 0 4px">확인 퀴즈</div>' +
            '<div class="muted">총 ' + (l.quiz || []).length + '문항 · ' + Math.round(PASS_RATE * 100) + '% 이상 맞히면 통과!<br>통과하면 이 레슨의 단어가 복습함에 자동으로 담겨요.</div>' +
            (done ? '<div style="margin-top:8px;font-size:13px;color:var(--success);font-weight:700">✅ 이미 통과한 레슨이에요 (최고 ' + done.score + '/' + done.total + '점) — 다시 풀어도 좋아요!</div>' : '') +
            '<button class="btn" id="startQuiz" style="margin-top:16px">퀴즈 시작하기</button></div>';
        document.getElementById('startQuiz').addEventListener('click', () => {
            S.quiz = newQuizState();
            renderQuiz(body, l);
        });
        return;
    }
    const q = S.quiz;
    const all = l.quiz || [];
    if (!q.order && !q.only && !l.redo && l.skipUnit === undefined) {
        // 같은 유형이 이어진 구간 안에서만 섞는다(선택형 → 듣기 → 배열 흐름 유지). 같은 날 같은 레슨은 늘 같은 순서
        const seedBase = hashStr(l.id + todayStr()) + (q.attempt || 0) * 101;
        const runs = [];
        all.forEach((it, i) => { if (!runs.length || all[i - 1].type !== it.type) runs.push([]); runs[runs.length - 1].push(i); });
        q.order = runs.flatMap((r, k) => seededShuffle(r, seedBase + k * 7));
    }
    const order = q.only || q.order || all.map((_, i) => i);      // 다시 풀 때는 순서를 섞고, 틀린 문제 단계에서는 그 번호만
    if (q.i >= order.length) {
        // 본 회차가 끝났는데 틀린 문제가 있으면, 결과 전에 그 문제들만 한 번 더 (듀오링고식)
        if (!q.phase2 && q.wrong.length && !l.redo && l.skipUnit === undefined) {
            q.phase2 = true; q.firstScore = q.score; q.firstWrong = q.wrong.slice();
            q.only = q.wrong.map(w => w.idx); q.order = null; q.i = 0; q.corrected = 0; q.combo = 0; q.fever = 0;
            renderQuiz(body, l); return;
        }
        renderQuizResult(body, l); return;
    }
    const qIdx = order[q.i];
    const item = all[qIdx];
    const seed = hashStr(item.srcLesson || l.id) + (item.srcIdx !== undefined ? item.srcIdx : qIdx) * 97;
    const itemText = nativeText(item);

    // 💥 피버 중이면 문제 카드 전체가 금빛(.fever)이고 진행 줄에 'FEVER 정답마다 +1'(실제 규칙: 피버 중 정답마다 보너스 1 XP)
    let h = '<div class="qwrap' + (q.fever > 0 ? ' fever' : '') + '"><div class="quiz-prog"><div class="qp-bar"><div style="width:' + (q.i / order.length * 100) + '%"></div></div>' +
        '<div class="qp-txt">' + (q.fever > 0 ? '<span class="fever-tag">💥 FEVER 정답마다 +1</span> · ' : q.combo >= 2 ? '🔥' + q.combo + ' · ' : '') + (q.i + 1) + ' / ' + order.length + '</div></div>';
    if (item.srcTitle) h += '<div class="muted" style="margin:-6px 0 8px">📝 ' + esc(item.srcTitle) + '</div>';
    if (q.phase2) h += '<div class="phase2-banner">🔁 틀렸던 문제 한 번 더! 맞히면 점수에 반영돼요 (' + (q.i + 1) + '/' + order.length + ')</div>';
    h += '<div class="quiz-q">' + esc(item.q) + '</div>';

    if (item.type === 'listen' || item.type === 'tone') {
        h += '<div class="quiz-audio">' +
            '<button class="big-listen" id="qPlay" aria-label="듣기">🔊</button>' +
            '<button class="big-listen slow" id="qPlaySlow" aria-label="느리게 듣기">🐢</button></div>';
        if (q.noSound) {
            // 글자를 보여 주면 답이 드러나는 문제: 성조는 병음(성조 부호)을 빼고 한자만, 보기에 같은 단어가 있는 문제는 점수에서 뺄 수 있게
            if (item.type === 'tone') h += '<div class="card" style="text-align:center;margin:-4px 0 10px"><div class="native" style="font-size:24px">' + esc(itemText) + '</div><div class="muted">🔇 글자를 보고 성조를 떠올려 골라 보세요</div></div>';
            else if (item.choices.includes(itemText)) h += '<div class="card" style="text-align:center;margin:-4px 0 10px"><div class="muted">🔇 이 문제는 소리를 들어야 풀 수 있어요' + (q.phase2 ? '. 건너뛰어도 괜찮아요(첫 시도 점수는 그대로예요)' : '') + '</div>' + (q.answered ? '' : '<button class="btn small gray" id="qExcuse" style="margin-top:8px">' + (q.phase2 ? '건너뛰기' : '건너뛰기(점수에서 빼기)') + '</button>') + '</div>';
            else h += '<div class="card" style="text-align:center;margin:-4px 0 10px"><div class="native" style="font-size:24px">' + esc(itemText) + '</div>' + (romanText(item) ? '<div style="color:var(--primary);font-weight:600">' + esc(romanText(item)) + '</div>' : '') + '<div class="muted">🔇 소리 대신 글자로 풀어요</div></div>';
        } else if (ttsBadNow()) h += '<div style="text-align:center;margin:-4px 0 10px"><button class="btn small gray" id="qNoSound">🔇 소리가 안 나요 — 글자로 보기</button></div>';
    }
    if (item.type === 'arrange') {
        h += '<div class="arrange-area" id="arrArea">' +
            (q.sel.length ? q.sel.map((t, i) => '<span class="token" data-sel="' + i + '">' + esc(t) + '</span>').join('') :
                '<span class="muted" style="padding:4px 6px">아래 단어를 순서대로 눌러 문장을 만드세요</span>') + '</div>';
        const bank = seededShuffle(item.tokens.map((t, i) => ({ t, i })), seed);
        q.half = null;
        h += '<div class="token-bank">' + bank.map(b => {
            const used = q.selSrc && q.selSrc.includes(b.i);
            return '<span class="token' + (used ? ' used' : '') + '" data-bank="' + b.i + '">' + esc(b.t) + '</span>';
        }).join('') + '</div>';
        const hintLeft = Math.max(1, Math.floor(item.tokens.length / 2)) - (q.hints || 0);
        h += '<div style="display:flex;gap:8px"><button class="btn gray" id="arrHint" title="다음 단어 힌트"' + (q.sel.length >= item.tokens.length || hintLeft <= 0 ? ' disabled' : '') + '>💡 힌트 ' + Math.max(0, hintLeft) + '</button>' +
            '<button class="btn block" id="arrCheck"' + (q.sel.length === item.tokens.length ? '' : ' disabled') + ' style="flex:1">확인하기</button></div>';
    } else {
        const tone = item.type === 'tone';
        h += '<div class="' + (tone ? 'tone-choice' : '') + '">';
        const disp = tone ? item.choices.map((_, ci) => ci) : seededShuffle(item.choices.map((_, ci) => ci), seed + (q.attempt || 0) * 31 + (q.phase2 ? 5 : 0));
        disp.forEach(ci => {
            const c = item.choices[ci];
            h += '<button class="choice-btn' + (q.half && q.half.includes(ci) ? ' halved' : '') + '" data-choice="' + ci + '"' + (q.half && q.half.includes(ci) ? ' disabled' : '') + '><span class="native">' + esc(c) + '</span></button>';
        });
        h += '</div>';
        if (item.choices.length >= 4 && !q.half && !q.answered) h += '<button class="btn small gray" id="qHalf" style="margin-bottom:8px">💡 반반 힌트 (보기 2개 지우기)</button>';
    }
    h += '<div id="qFeedback"></div></div>';
    body.innerHTML = h;

    const qp = document.getElementById('qPlay');
    if (qp) { qp.addEventListener('click', () => { q.plays = (q.plays || 0) + 1; speak(itemText, q.plays >= 3 ? 0.7 : 0.95); }); }
    const qh = document.getElementById('qHalf');
    if (qh) qh.addEventListener('click', () => {
        if (q.answered) return;
        const wrongs = item.choices.map((_, ci) => ci).filter(ci => ci !== item.answer);
        q.half = seededShuffle(wrongs, seed + 7).slice(0, 2);
        renderQuiz(body, l);
    });
    const qps = document.getElementById('qPlaySlow');
    if (qps) { qps.addEventListener('click', () => speak(itemText, 0.7)); }
    const qns = document.getElementById('qNoSound');
    if (qns) qns.addEventListener('click', () => { q.noSound = true; renderQuiz(body, l); });
    const qex = document.getElementById('qExcuse');
    if (qex) qex.addEventListener('click', () => {   // 소리 없이는 풀 수 없는 문제: 맞힌 수에도 전체 문항 수에도 넣지 않는다
        if (q.answered) return;
        // 2회차(틀렸던 문제 다시 풀기)에서는 넘어가기만 한다: 1회차에 틀린 기록은 그대로 두어 '한 번에 전부 맞혔어요'·🏆가 '틀렸던 문제' 목록과 함께 나오지 않게
        if (!q.phase2) { if (!q.excused) q.excused = []; if (!q.excused.includes(qIdx)) q.excused.push(qIdx); }
        q.i++; q.answered = false; q.sel = []; q.selSrc = []; q.half = null; q.plays = 0; q.hints = 0; q.usedHint = false;
        renderQuiz(body, l);
    });
    if (qp && !q.answered && q.autoFor !== q.i + ':' + (q.phase2 ? 2 : 1)) {
        q.autoFor = q.i + ':' + (q.phase2 ? 2 : 1);
        setTimeout(() => { if (S.quiz === q && !q.answered) speak(itemText, 0.95); }, 350);
    }

    if (item.type === 'arrange') {
        if (!q.selSrc) q.selSrc = [];
        body.querySelectorAll('[data-bank]').forEach(el => el.addEventListener('click', () => {
            if (q.answered) return;
            const bi = parseInt(el.dataset.bank, 10);
            if (q.selSrc.includes(bi)) return;
            q.sel.push(item.tokens[bi]); q.selSrc.push(bi);
            speak(item.tokens[bi], 0.9);
            renderQuiz(body, l);
        }));
        body.querySelectorAll('[data-sel]').forEach(el => el.addEventListener('click', () => {
            if (q.answered) return;
            const si = parseInt(el.dataset.sel, 10);
            q.sel.splice(si, 1); q.selSrc.splice(si, 1);
            renderQuiz(body, l);
        }));
        const hb = document.getElementById('arrHint');
        if (hb) hb.addEventListener('click', () => {
            // 힌트: 앞에서부터 맞게 놓인 만큼은 두고, 다음에 올 단어 하나를 채워 준다
            if (q.answered) return;
            let k = 0;
            while (k < q.sel.length && q.sel[k] === item.tokens[k]) k++;
            q.sel = q.sel.slice(0, k); q.selSrc = q.selSrc.slice(0, k);
            const bi = item.tokens.findIndex((t, ti) => t === item.tokens[k] && !q.selSrc.includes(ti));
            if (bi >= 0) { q.sel.push(item.tokens[bi]); q.selSrc.push(bi); }
            q.hints = (q.hints || 0) + 1; q.usedHint = true;
            renderQuiz(body, l);
        });
        const ck = document.getElementById('arrCheck');
        if (ck) ck.addEventListener('click', () => {
            if (q.answered) return;
            const user = q.sel.join(CUR.joiner);
            const answer = item.tokens.join(CUR.joiner);
            const ok = user === answer;
            ck.disabled = true;
            const roman = romanText(item) || item.koPron || '';
            answerFeedback(ok, item,
                '<div class="eb-answer">정답: <span class="native">' + esc(answer) + '</span>' +
                (roman ? '<br><span style="color:var(--primary);font-weight:600">' + (CUR.romanField ? esc(roman) : '[' + esc(roman) + ']') + '</span>' : '') + '</div>');
        });
    } else {
        body.querySelectorAll('[data-choice]').forEach(el => el.addEventListener('click', () => {
            const ci = parseInt(el.dataset.choice, 10);
            const ok = ci === item.answer;
            body.querySelectorAll('[data-choice]').forEach(b => {
                const bi = parseInt(b.dataset.choice, 10);
                b.disabled = true;
                if (bi === item.answer) b.classList.add('correct');
                else if (bi === ci && !ok) b.classList.add('wrong');
            });
            answerFeedback(ok, item, '');
            if ((item.type === 'listen' || item.type === 'tone') && itemText) setTimeout(() => speak(itemText, 0.9), 250);

        '<button class="play-btn slow" id="fcPlaySlow" style="width:44px;height:44px;font-size:18px" aria-label="느리게 듣기">🐢</button></div>';
    h += '</div>';
    if (!r.flipped) {
        if (rev) h += '<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn block" id="fcSpeak">🎤 말해 보기</button>' + (r.hint ? '' : '<button class="btn gray" id="fcHintBtn" style="white-space:nowrap">💡 힌트</button>') + '</div>';
        h += '<button class="btn block' + (rev ? ' ghost' : '') + '" id="fcFlip">' + (rev ? '👀 정답 보기' : '뜻 확인하기') + '</button>' +
            '<div class="muted" style="text-align:center;margin-top:10px">' + (rev ? '소리 내어 말해 본 다음 정답을 확인하세요!' : '발음을 듣고, 뜻을 먼저 떠올려 본 다음 확인하세요!') + '</div>';
    } else {
        h += '<div class="grade-row three">' +
            '<button class="btn fail" id="fcFail">❌ 몰랐어요</button>' +
            '<button class="btn hard" id="fcHard">😅 헷갈렸어요</button>' +

    }
    h += '<button class="btn small gray" id="fcQuit" style="display:block;margin:14px auto 0">그만하기</button>';
    $main.innerHTML = h;
    const pl = document.getElementById('fcPlay');
    if (pl) pl.addEventListener('click', () => speak(c.tts || c.native, 0.95));
    const pls = document.getElementById('fcPlaySlow');
    if (pls) pls.addEventListener('click', () => speak(c.tts || c.native, 0.7));
