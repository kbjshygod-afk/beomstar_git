        $main.querySelectorAll('[data-scope]').forEach(b => b.addEventListener('click', () => { S.earScope = b.dataset.scope; renderTrainer(); }));
        $main.querySelectorAll('[data-word]').forEach(b => b.addEventListener('click', () => speak(b.dataset.word, 0.85)));
        $main.querySelectorAll('[data-link]').forEach(el => el.addEventListener('click', () => { const x = EAR_LINKS[parseInt(el.dataset.link, 10)]; speak(x.say || x.en, 1); }));
        $main.querySelectorAll('[data-slow-link]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); speak(EAR_LINKS[parseInt(b.dataset.slowLink, 10)].en, 0.6); }));
        return;
    }
    const t = S.trainer, TOTAL = 10;
    if (t.i >= TOTAL) { renderTrainerResult(t, TOTAL, t.score >= 8 ? '귀가 뚫렸어요! 원어민 소리가 들리기 시작해요.' : t.score >= 5 ? '좋아요! 헷갈린 짝은 표에서 여러 번 들어 보세요.' : '괜찮아요, 한국어에 없는 소리라 원래 어려워요. 매일 조금씩!'); return; }
    if (!t.cur) {
        let pool = earPool(t.scope);
        if (!t.scope || t.scope === 'all') { const weak = weakEarSets(); if (weak.length) pool = pool.concat(pool.filter(x => weak.includes(x.set.id))); }   // 약한 소리는 두 배로
        const pick = pool[Math.floor(Math.random() * pool.length)];
        const which = Math.random() < 0.5 ? 0 : 1;
        const choices = [{ w: pick.p[0], k: pick.p[1] }, { w: pick.p[2], k: pick.p[3] }];
        t.cur = { set: pick.set, choices, answer: which, word: choices[which].w };
    }
    const cur = t.cur;
    let h = trainerProg(t, TOTAL) + '<div class="quiz-q">🎧 어떤 단어가 들리나요? <span class="muted">(' + esc(cur.set.label) + ')</span></div>' +
        '<div class="quiz-audio"><button class="big-listen" id="tPlay" aria-label="듣기">🔊</button><button class="big-listen slow" id="tPlaySlow" aria-label="느리게 듣기">🐢</button></div>' +
        '<div class="verb-choice">' + cur.choices.map((c, i) => '<button class="choice-btn" data-a="' + i + '"><span class="native" style="font-size:19px">' + esc(c.w) + '</span><div class="muted">' + esc(c.k) + '</div></button>').join('') + '</div>' +
        '<div id="tFeedback"></div>';
    $main.innerHTML = h;
    document.getElementById('tPlay').addEventListener('click', () => speak(cur.word, 0.85));
    // 모음 길이가 단서인 짝은 너무 느리게 읽으면 짧은 모음도 길어져서 0.75까지만
    document.getElementById('tPlaySlow').addEventListener('click', () => speak(cur.word, /ii|uu|ae/.test(cur.set.id) ? 0.75 : 0.6));
    if (t.autoFor !== t.i) { t.autoFor = t.i; setTimeout(() => { if (S.trainer === t && !t.answered) speak(cur.word, 0.85); }, 350); }
    $main.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => {
        if (t.answered) return;
        t.answered = true;
        const sel = parseInt(b.dataset.a, 10), ok = sel === cur.answer;
        if (ok) t.score++;
        sfx(ok ? 'ok' : 'bad');
        const pe = prog(); if (!pe.ear) pe.ear = {}; const es = pe.ear[cur.set.id] || (pe.ear[cur.set.id] = { ok: 0, n: 0 }); es.n++; if (ok) es.ok++; save();
        $main.querySelectorAll('[data-a]').forEach((bb, bi) => { bb.disabled = true; if (bi === cur.answer) bb.classList.add('correct'); else if (bi === sel && !ok) bb.classList.add('wrong'); });
        document.getElementById('tFeedback').innerHTML =
            '<div class="explain-box ' + (ok ? 'good' : 'bad') + '"><div class="eb-head">' + (ok ? '⭕ 정답! ' + cheer(true) : '❌ ' + cheer(false)) + '</div>' +
            '<div class="eb-answer">들린 단어: <span class="native">' + esc(cur.word) + '</span> (' + esc(cur.choices[cur.answer].k) + ')</div>💡 ' + esc(cur.set.tip) + '</div>' +
            '<button class="btn small ghost" id="tCompare" style="margin-bottom:8px">🔁 두 단어 비교 듣기</button>' +
            '<button class="btn block" id="tNext">' + (t.i + 1 >= TOTAL ? '결과 보기' : '다음 문제 →') + '</button>';
        document.getElementById('tCompare').addEventListener('click', () => speakSeq(cur.choices.map(c => c.w)));
        setTimeout(() => speakSeq(cur.choices.map(c => c.w)), 250);
        document.getElementById('tNext').addEventListener('click', () => { t.i++; t.cur = null; t.answered = false; renderTrainer(); });
    }));
}

function trainerProg(t, TOTAL) {
    return '<div class="quiz-prog"><div class="qp-bar"><div style="width:' + (t.i / TOTAL * 100) + '%"></div></div><div class="qp-txt">' + (t.i + 1) + ' / ' + TOTAL + '</div></div>';
}
function renderTrainerResult(t, TOTAL, msg) {
    touchStreak();
    let give = 0;
    if (!t.rewarded) {
        t.rewarded = true;
        const dl = dayLog();
        give = Math.max(0, Math.min(t.score, 30 - (dl.trainerXp || 0)));   // 훈련소 XP는 하루 30까지
        dl.trainerXp = (dl.trainerXp || 0) + give;
        logActivity('trainer');
        if (give) addXp(give, CUR.trainerLabel + ' 훈련');
        if (t.score >= 8) celebrate();
        if (t.score === TOTAL) { store.flags.trainerPerfect = todayStr(); save(); }
    }
    $main.innerHTML = '<div class="result-hero"><div class="r-emoji">' + (t.score >= 8 ? '🏆' : t.score >= 5 ? '🎉' : '💪') + '</div>' +
        '<div class="r-score" style="color:var(--primary)">' + t.score + ' / ' + TOTAL + '</div>' +
        '<div class="r-msg">' + msg + '</div></div>' +
        '<div style="display:flex;gap:10px"><button class="btn block" id="trAgain">한 번 더!</button><button class="btn block ghost" id="trExit">그만하기</button></div>';
    document.getElementById('trAgain').addEventListener('click', () => { S.trainer = { i: 0, score: 0, cur: null, answered: false, scope: t.scope }; renderTrainer(); });
    document.getElementById('trExit').addEventListener('click', () => { S.trainer = null; renderTrainer(); });
}

/* ═══════════════════ 읽기 (쉬운 동화) ═══════════════════ */
function storyUnlocked(story) { return store.settings.freeNav || effDone() >= storyNeed(story); }
function STORIES_REQUIRED_COUNT(afterUnit) {
    // afterUnit(예: 3)까지의 유닛에 속한 레슨 수를 합산 — 그 단계 전체를 완료해야 열림
    let n = 0;
    UNITS.forEach(u => { if (u.unitId <= afterUnit) n += u.lessons.length; });
    return n;
}
// 같은 단계의 첫 이야기는 그 단계 절반만 배워도 열어 준다(읽기 탭이 오래 막히지 않게)
function storyNeed(story) {
    if (story === STORIES[0]) { const u0 = UNITS[0]; return u0 ? u0.lessons.length : 0; }   // 첫 이야기는 첫 단계만 끝내면
    const full = STORIES_REQUIRED_COUNT(story.unlockAfter);
    const group = STORIES.filter(x => x.unlockAfter === story.unlockAfter);
    if (group[0] !== story) return full;
    const u = UNITS.find(x => x.unitId === story.unlockAfter);
    return full - (u ? Math.floor(u.lessons.length / 2) : 0);
}
function renderStoryList() {

        $main.innerHTML = '<div class="empty-state"><div class="es-emoji">📚</div><b>쉬운 읽기 콘텐츠 준비 중</b><br>배운 단어만으로 읽는 짧은 동화가<br>곧 이 자리에 채워질 예정이에요!</div>';

/* ═══════════════════ 학습 기록 (달력 · 목록) ═══════════════════ */
const DOW_KO = ['일', '월', '화', '수', '목', '금', '토'];
function histLessonTitle(id) { const i = LESSON_BY_ID[id]; return i !== undefined ? ALL[i].title : id; }
function histStoryTitle(id) { const s = STORIES.find(x => x.id === id); return s ? (s.emoji ? s.emoji + ' ' : '') + s.title : id; }
function histAllEntries() {
    const out = [];
    const comp = prog().completed || {};
    const read = prog().storiesRead || {};
    Object.entries(comp).forEach(([id, v]) => {
        if (!v || !v.date) return;
        out.push({ date: v.date, type: 'lesson', ico: v.imported ? '📦' : v.placed ? '⏩' : '✅', title: histLessonTitle(id), score: v.imported ? 'DEQ에서 완료' : v.placed ? '건너뛰기 시험' : v.score + '/' + v.total + '점' });
    });
    Object.entries(read).forEach(([id, v]) => {
        const date = (v && typeof v === 'object') ? v.date : null;
        if (!date) return;
        out.push({ date, type: 'story', ico: '📖', title: histStoryTitle(id), score: '완료' });
    });
    const dqi = prog().deqImport;
    if (dqi && dqi.at) out.push({ date: dqi.at, type: 'act', ico: '📦', title: 'Daily English Quest에서 가져옴 (Day ' + dqi.days.length + '개)', score: dqi.xp + ' XP' });
    Object.entries(prog().boss || {}).forEach(([id, v]) => {
        if (v && v.date) out.push({ date: v.date, type: 'boss', ico: '👑', title: histLessonTitle(id) + ' 보스 미션', score: v.score != null ? v.score + '%' : '클리어' });
    });
    Object.entries(prog().daily || {}).forEach(([date, d]) => {
        if (!d) return;
        if (d.reviews) out.push({ date, type: 'act', ico: '🃏', title: '복습 카드 ' + d.reviews + '장', score: '' });
        if (d.speak) out.push({ date, type: 'act', ico: '🎤', title: '말하기 ' + d.speak + '문장 통과', score: '' });
        if (d.trainer) out.push({ date, type: 'act', ico: CUR.trainerIco, title: CUR.trainerLabel + ' 훈련 ' + d.trainer + '회', score: '' });
        if (d.match) out.push({ date, type: 'act', ico: '🧩', title: '짝 맞추기 ' + d.match + '판', score: '' });
        if (d.xp) out.push({ date, type: 'xp', ico: '⭐', title: '획득 XP', score: '+' + d.xp + ' XP' });
    });
    out.sort((a, b) => b.date < a.date ? -1 : b.date > a.date ? 1 : 0);
    return out;
}
function allDaily() {
    const out = {};
    Object.values(store.byLang).forEach(p => Object.entries((p && p.daily) || {}).forEach(([d, v]) => {
        const o = out[d] || (out[d] = { xp: 0 });
        Object.keys(v).forEach(k => { if (typeof v[k] === 'number') o[k] = (o[k] || 0) + v[k]; });
    }));
    return out;
}
function weekReportHtml() {
    const all = store.seen.weekScope === 'all';
    const daily = all ? allDaily() : (prog().daily || {}), goal = store.settings.dailyGoal;
    const days = [];
    for (let k = 6; k >= 0; k--) { const ds = todayStr(-k); days.push({ ds, d: daily[ds] || { xp: 0 }, today: k === 0 }); }
    const maxXp = Math.max(goal, ...days.map(x => x.d.xp || 0));
    const sum = days.reduce((a, x) => a + (x.d.xp || 0), 0);
    let lastSum = 0;
    for (let k = 7; k <= 13; k++) lastSum += (daily[todayStr(-k)] || {}).xp || 0;
    const vs = !lastSum ? '' : sum >= lastSum ? '지난주보다 <b style="color:var(--success)">+' + Math.round((sum - lastSum) / lastSum * 100) + '%</b> 📈' : '이번 주는 쉬어 가는 중 (지난주 ' + lastSum + ' XP)';
    const active = days.filter(x => (x.d.xp || 0) > 0 || (x.d.reviews || 0) > 0).length;
    const hit = days.filter(x => (x.d.xp || 0) >= goal).length;
    const reviews = days.reduce((a, x) => a + (x.d.reviews || 0), 0);
    const speak = days.reduce((a, x) => a + (x.d.speak || 0), 0);
    const comment = !active ? '최근 7일 기록이 아직 없어요. 오늘 레슨 하나면 시작이에요!'
        : hit >= 6 ? '거의 매일 목표를 채웠어요. 습관이 완성됐어요! 🏆'
        : hit >= 4 ? '일주일에 ' + hit + '일 목표 달성 — 아주 좋은 흐름이에요.'

function histLongestStreak(dates) {
    if (!dates.size) return 0;
    const sorted = Array.from(dates).sort();
    let best = 1, cur = 1;
    for (let i = 1; i < sorted.length; i++) {
        const prev = new Date(sorted[i - 1] + 'T00:00:00'), now = new Date(sorted[i] + 'T00:00:00');
        const diff = Math.round((now - prev) / 86400000);
        cur = diff === 1 ? cur + 1 : 1;
        if (cur > best) best = cur;
    }
    return best;
}

function pad2(n) { return String(n).padStart(2, '0'); }
function buildReminderIcs(timeString) {
    const hh = Number(timeString.slice(0, 2)), mm = Number(timeString.slice(3, 5));
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0);
    if (start <= now) start.setDate(start.getDate() + 1);
    const loc = d => d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + pad2(d.getMinutes()) + '00';
    const utc = d => d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) + 'T' + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
    const stamp = utc(now);
    // RFC 5545: 75바이트(UTF-8)를 넘는 줄은 CRLF+공백으로 접되, 한글 글자 중간에서 자르지 않는다
    const fold = line => {
        const enc = new TextEncoder(); const out = []; let cur = '', bytes = 0, limit = 75;
        Array.from(line).forEach(ch => { const b = enc.encode(ch).length; if (bytes + b > limit) { out.push(cur); cur = ' '; bytes = 1; limit = 75; } cur += ch; bytes += b; });
        out.push(cur); return out.join('\r\n');
    };
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Language Starter//Reminder//KO', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
        'BEGIN:VEVENT', 'UID:language-starter-daily@beomstar', 'DTSTAMP:' + stamp, 'DTSTART:' + loc(start), 'DURATION:PT15M', 'RRULE:FREQ=DAILY',
        'SUMMARY:🌍 랭귀지 스타터 - 오늘의 15분', 'DESCRIPTION:복습 + 레슨 한 단계 + 보스 1개면 오늘 끝!', 'URL:' + location.origin + location.pathname,
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:PT0M', 'DESCRIPTION:외국어 15분 할 시간이에요', 'END:VALARM',
        'END:VEVENT', 'END:VCALENDAR'].map(fold).join('\r\n') + '\r\n';
}
function googleCalLink(timeString) {
    const hh = Number(timeString.slice(0, 2)), mm = Number(timeString.slice(3, 5));
    const now = new Date(), st = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0);
    if (st <= now) st.setDate(st.getDate() + 1);
    const en = new Date(st.getTime() + 15 * 60000);
    const f = d => d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + pad2(d.getMinutes()) + '00';
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('🌍 랭귀지 스타터 - 오늘의 15분') + '&dates=' + f(st) + '/' + f(en) +
        '&recur=' + encodeURIComponent('RRULE:FREQ=DAILY') + '&details=' + encodeURIComponent('복습 + 레슨 한 단계 + 보스 1개면 오늘 끝! ' + location.origin + location.pathname);
}

        setRow('하루 목표', '오늘의 목표 XP (레슨 1개 통과 = 20 XP)', '<select class="sel" id="setGoal" aria-label="하루 목표 XP">' + [[10, '가볍게 10'], [20, '보통 20'], [30, '꾸준히 30'], [50, '열심히 50'], [80, '불타게 80']].map(([v, t]) => '<option value="' + v + '"' + (store.settings.dailyGoal === v ? ' selected' : '') + '>' + t + ' XP</option>').join('') + '</select>') +
        setRow('한글 발음 표기', '외국어 아래 한글 독음 [' + esc(CUR.koPronSample || '') + '] · 자동: 3단계부터는 눌러야 보여요', '<select class="sel" id="setKoPron" aria-label="한글 발음 표기">' + [['auto', '자동(추천)'], ['on', '항상 보기'], ['off', '숨기기']].map(([v, t]) => '<option value="' + v + '"' + ((store.settings.koPron === 'auto' ? 'auto' : store.settings.koPron ? 'on' : 'off') === v ? ' selected' : '') + '>' + t + '</option>').join('') + '</select>') +
        setRow('말하기 속도', '이 언어의 발음 재생 속도', '<div class="seg" role="group" aria-label="말하기 속도">' + [[0.8, '🐢 느리게'], [1, '보통'], [1.1, '🐇 원어민']].map(([v, t]) => {
            const near = [0.8, 1, 1.1].reduce((a, b) => Math.abs(b - curRate()) < Math.abs(a - curRate()) ? b : a, 1);
            return '<button data-rate="' + v + '" aria-pressed="' + (near === v) + '">' + t + '</button>';
        }).join('') + '</div>') +
        setRow('목소리', voiceDesc(), voiceSelectHtml()) +
        setRow('글씨 크게', '화면 전체 글씨와 버튼을 조금 크게', '<label class="switch"><input type="checkbox" id="setBig"' + (store.settings.bigText ? ' checked' : '') + '><span class="slider"></span></label>') +
        setRow('효과음', '정답·오답·레벨 업 때 짧은 소리', '<label class="switch"><input type="checkbox" id="setSfx"' + (store.settings.sfx ? ' checked' : '') + '><span class="slider"></span></label>') +
        setRow('자유 탐색 모드', '순서 잠금을 풀고 모든 레슨·읽기 열기 (추천하지 않아요!)', '<label class="switch"><input type="checkbox" id="setFree"' + (store.settings.freeNav ? ' checked' : '') + '><span class="slider"></span></label>') +
        '</div>';
    if (!placementChoices().length && nextSkipUnit() !== null) h += '<div class="card">' + setRow('📍 시작 위치', '이미 아는 단계는 건너뛰기 시험으로 넘어갈 수 있어요', '<button class="btn small ghost" id="skipFromSet">' + nextSkipUnit() + '단계 시험</button>') + '</div>';
    if (CUR.code === 'en') {
        const di = readDeq(), rec = prog().deqImport;
        h += '<div class="card">' +
            (placementChoices().length ? setRow('📍 시작 위치', prog().placedAt ? esc((ALL[LESSON_BY_ID[prog().placedAt]] || {}).title || '') + '부터' : '0단계(왕초보)부터', '<button class="btn small ghost" id="placeBtn">바꾸기</button>') : '') +
            setRow('📦 Daily English Quest 기록', di ? (rec && rec.at ? rec.at + '에 가져옴 · 새 기록이 있으면 더 가져와요' : 'Day ' + di.cleared.length + '개 · ' + di.xp + ' XP 기록이 이 기기에 있어요') : '이 브라우저엔 기록이 없어요 — 다른 기기의 DEQ 백업은 아래 "코드로 복원"에 붙여넣기', di ? '<button class="btn small" id="deqBtn">가져오기</button>' : '') +
            '</div>';
    }
    h += '<div class="card">' +
        setRow('⏰ 매일 알림', '휴대폰 캘린더에 매일 반복 일정 넣기 · <a href="' + esc(googleCalLink(store.settings.reminderTime)) + '" target="_blank" rel="noopener">Google 캘린더</a> · 아이폰은 사파리에서 · 다시 만들면 일정이 두 개가 될 수 있어요', '<input type="time" id="setRemind" value="' + esc(store.settings.reminderTime) + '" aria-label="알림 시각"> <button class="btn small ghost" id="icsBtn">📅 만들기</button>') +
        '</div>';
    h += '<div class="card">' +
        setRow('학습 데이터', '완료 ' + doneCount() + '레슨 · 단어장 ' + Object.keys(prog().srs).length + '장 · 이 브라우저에 저장됨',
            '<button class="btn small" id="resetBtn" style="background:var(--error)">초기화</button>') +
        '</div>';
    h += '<div class="card">' +
        '<div style="font-size:14px;font-weight:700;margin-bottom:2px">📦 진도 백업 · 다른 기기로 옮기기</div>' +
        '<div class="muted" style="margin-bottom:10px">배우는 모든 언어의 진도가 함께 백업돼요. 폰↔PC로 옮기거나 안전하게 백업하려면 코드를 사용하세요.</div>' +
        '<div style="display:flex;gap:8px">' +
        '<button class="btn small ghost" id="backupBtn" style="flex:1">백업 코드 만들기</button>' +
        '<button class="btn small ghost" id="restoreBtn" style="flex:1">코드로 복원하기</button>' +
        '</div>' + (function () {
            let snap = null; try { snap = JSON.parse(localStorage.getItem(LS_KEY + '_before_restore') || 'null'); } catch (e) { snap = null; }
            if (!snap || !snap.at || (Date.now() - Date.parse(snap.at)) > 7 * 86400000) return '';
            return '<button class="btn small gray block" id="undoRestore" style="margin-top:8px">↩ 복원 전 기록으로 되돌리기 (' + esc(snap.at.slice(0, 10)) + ')</button>';
        })() + '<div class="muted" style="margin-top:6px">마지막 백업: ' + esc(store.seen.lastBackup || '없음') + '</div><div id="backupArea"></div></div>';
    h += '<div class="muted" style="text-align:center;margin-top:16px">랭귀지 스타터 v2.0 · 오프라인에서도 동작해요 🌍<br>발음은 브라우저 내장 음성(TTS), 말하기 채점은 브라우저 음성 인식을 사용합니다</div>';
    $main.innerHTML = h;
    bindSubnav();

    document.getElementById('switchLangBtn').addEventListener('click', () => go('picker'));
    document.getElementById('setKoPron').addEventListener('change', e => { store.settings.koPron = e.target.value === 'auto' ? 'auto' : e.target.value === 'on'; save(); });
    $main.querySelectorAll('[data-rate]').forEach(b => b.addEventListener('click', () => { store.settings.rateByLang[CUR.code] = parseFloat(b.dataset.rate); save(); renderSettings(); speak(CUR.sampleWord, 0.95); }));
    document.getElementById('setFree').addEventListener('change', e => { store.settings.freeNav = e.target.checked; save(); });
    const sfs = document.getElementById('skipFromSet');
    if (sfs) sfs.addEventListener('click', () => startSkipTest(nextSkipUnit()));
    const pb = document.getElementById('placeBtn');
    if (pb) pb.addEventListener('click', showPlacement);
    const db = document.getElementById('deqBtn');
    if (db) db.addEventListener('click', () => {
        const info = readDeq(); if (!info) return;
        const r = importDeq(info); celebrate();
        showToast('📦 가져오기 완료! 레슨 ' + r.lessons + '개 · 카드 ' + r.cards + '장 · +' + r.xp + ' XP', 'gold', 3600);
        renderSettings();
    });
    document.getElementById('setGoal').addEventListener('change', e => { store.settings.dailyGoal = parseInt(e.target.value, 10) || 30; save(); showToast('🎯 하루 목표: ' + store.settings.dailyGoal + ' XP'); });
    document.getElementById('setBig').addEventListener('change', e => { store.settings.bigText = e.target.checked; save(); applyBigText(); });
    document.getElementById('setSfx').addEventListener('change', e => { store.settings.sfx = e.target.checked; save(); if (e.target.checked) sfx('ok'); });
    const vs = document.getElementById('setVoice');
    if (vs) vs.addEventListener('change', e => {
        if (!store.settings.voice) store.settings.voice = {};
        if (e.target.value) store.settings.voice[CUR.code] = e.target.value; else delete store.settings.voice[CUR.code];
        save(); speak(CUR.sampleWord, 0.95);
    });
    document.getElementById('setRemind').addEventListener('change', e => { store.settings.reminderTime = e.target.value || '21:00'; save(); });
    document.getElementById('icsBtn').addEventListener('click', () => {
        const t = document.getElementById('setRemind').value || store.settings.reminderTime || '21:00';
        store.settings.reminderTime = t; save();
        try { downloadIcs(t); } catch (err) { showToast('파일을 만들지 못했어요.'); }
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm('정말 ' + CUR.name + '의 학습 기록을 지울까요?\n(완료한 레슨, 복습 단어장, XP가 사라져요. 다른 언어의 진도와 전체 연속 기록은 유지됩니다)')) {
            delete store.byLang[CUR.code]; delete store.seen['welcome_' + CUR.code]; if (CUR.code === 'en') delete store.seen.deqOfferShown; save();
            go('home');
        }
    });
    const area = () => document.getElementById('backupArea');
    document.getElementById('backupBtn').addEventListener('click', () => {
        area().innerHTML = '<div class="muted" style="margin:12px 0 6px">아래 코드 전체를 복사해서, 다른 기기의 <b>[코드로 복원하기]</b>에 붙여넣으세요.</div>' +
            '<textarea id="backupCode" readonly style="width:100%;height:88px;font-size:11px;border:1px solid var(--border);border-radius:10px;padding:8px;font-family:monospace;background:#f8fafc"></textarea>' +
            '<button class="btn small block" id="copyBtn" style="margin-top:6px">📋 코드 복사하기</button>';
        const ta = document.getElementById('backupCode');
        ta.value = exportProgress();
        document.getElementById('copyBtn').addEventListener('click', () => { copyText(ta.value, '📋 백업 코드를 복사했어요!'); store.seen.lastBackup = todayStr(); save(); });
        area().insertAdjacentHTML('beforeend', '<button class="btn small ghost block" id="fileBtn" style="margin-top:6px">📥 파일로 저장하기</button>');
        document.getElementById('fileBtn').addEventListener('click', () => {
            try {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([ta.value], { type: 'text/plain' }));
                a.download = 'language-starter-backup-' + todayStr() + '.txt';
                document.body.appendChild(a); a.click(); a.remove();
                store.seen.lastBackup = todayStr(); save();
                showToast('📥 백업 파일을 저장했어요');
            } catch (e) { showToast('파일을 만들지 못했어요. 코드를 복사해 주세요'); }
        });
    });
    const ur = document.getElementById('undoRestore');
    if (ur) ur.addEventListener('click', () => {
        if (!confirm('복원하기 전 기록으로 되돌릴까요? 지금 기록은 그 기록으로 바뀌어요.')) return;
        try {
            const snap = JSON.parse(localStorage.getItem(LS_KEY + '_before_restore'));
            localStorage.setItem(LS_KEY, snap.raw);
            localStorage.removeItem(LS_KEY + '_before_restore');
            store = normalizeStore(JSON.parse(snap.raw));
            showToast('↩ 복원 전 기록으로 되돌렸어요', 'gold');
            if (store.active && LANGS[store.active]) activateLanguage(store.active); else go('picker');
        } catch (e) { showToast('되돌리지 못했어요'); }
    });
    if (S.openBackup) { S.openBackup = false; document.getElementById('backupBtn').click(); setTimeout(() => { const b = document.getElementById('backupArea'); if (b) b.scrollIntoView({ block: 'center' }); }, 60); }
    document.getElementById('restoreBtn').addEventListener('click', () => {
        area().innerHTML = '<div class="muted" style="margin:12px 0 6px">다른 기기에서 만든 백업 코드를 붙여넣으세요.<br>⚠️ 지금 이 기기의 진도는 코드의 내용으로 <b>덮어써집니다.</b></div>' +
            '<textarea id="restoreCode" placeholder="여기에 백업 코드(또는 Daily English Quest 백업)를 붙여넣으세요" style="width:100%;height:88px;font-size:11px;border:1px solid var(--border);border-radius:10px;padding:8px;font-family:monospace"></textarea>' +
            '<label class="muted" style="display:block;margin-top:4px">또는 백업 파일(.json) 고르기: <input type="file" id="restoreFile" accept=".json,application/json,text/plain"></label>' +
            '<button class="btn small block" id="doRestore" style="margin-top:6px">진도 복원하기</button>';
        document.getElementById('restoreFile').addEventListener('change', ev => {
            const f = ev.target.files && ev.target.files[0]; if (!f) return;
            const rd = new FileReader();
            rd.onload = () => { document.getElementById('restoreCode').value = String(rd.result || ''); showToast('파일을 읽었어요. "진도 복원하기"를 누르세요'); };
            rd.readAsText(f);
        });
        document.getElementById('doRestore').addEventListener('click', () => {
            const code = document.getElementById('restoreCode').value;
            // Daily English Quest 백업(JSON)은 덮어쓰기 복원이 아니라 영어 진도로 합치기
            const t = code.trim();
            if (t.startsWith('{')) {
                let obj = null; try { obj = JSON.parse(t); } catch (e) { obj = null; }
                const info = obj && obj.app === 'daily-english-quest' ? parseDeqState(obj.data) : null;
                if (!info) { showToast('이 파일은 읽을 수 없어요. 랭귀지 스타터 백업 코드나 Daily English Quest 백업을 넣어 주세요', '', 3600); return; }
                const run = () => { const r = importDeq(info); celebrate(); showToast('📦 DEQ 기록을 영어로 가져왔어요! 레슨 ' + r.lessons + '개 · 카드 ' + r.cards + '장', 'gold', 3600); S.openUnit = null; go('home'); };
                if (CUR.code === 'en') run(); else { showToast('영어로 바꾼 뒤 가져올게요'); activateLanguage('en').then(() => { if (CUR && CUR.code === 'en') { closeModal(true); run(); } }); }
                return;
            }
            if (storageFailed) { showToast('이 브라우저는 기록 저장이 안 돼요. 일반 창(크롬·사파리)에서 복원해 주세요', '', 3600); return; }
            let obj;
            try { obj = parseBackup(code); } catch (e) { showToast('복원하지 못했어요: ' + e.message, '', 3600); return; }
            const incoming = normalizeStore(obj.data);
            const sheet = openModal('<div class="sheet-head"><b>이 백업으로 바꿀까요?</b><button class="sheet-close" data-close-overlay aria-label="닫기">✕</button></div>' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px"><div class="card" style="margin:0"><b>📦 백업</b>' + storeSummary(incoming, typeof obj.exportedAt === 'string' ? esc(obj.exportedAt.slice(0, 10)) : '날짜 모름') + '</div>' +
                '<div class="card" style="margin:0"><b>📱 지금 이 기기</b>' + storeSummary(store) + '</div></div>' +
                '<div class="muted" style="margin-bottom:10px">바꾸기 전 기록은 7일 동안 보관돼서 설정에서 되돌릴 수 있어요.</div>' +
                '<div style="display:flex;gap:8px"><button class="btn block gray" data-close-overlay>취소</button><button class="btn block" id="restoreYes">바꾸기</button></div>');
            sheet.querySelector('#restoreYes').addEventListener('click', () => {
                try {
                    let raw = null; try { raw = localStorage.getItem(LS_KEY); } catch (e) { raw = null; }
                    if (raw) localStorage.setItem(LS_KEY + '_before_restore', JSON.stringify({ at: new Date().toISOString(), raw }));
                    const r = importProgress(code);
                    closeModal(true);
                    showToast('🎉 복원 완료! 완료 ' + r.lessons + '레슨 · 단어장 ' + r.cards + '장', 'gold', 3400);
                    if (store.active && LANGS[store.active]) activateLanguage(store.active); else go('picker');
                } catch (e) { showToast('복원하지 못했어요: ' + e.message, '', 3600); }
            });
        });
    });

    function setRow(title, desc, ctl) {
        return '<div class="set-row"><div><div class="s-title">' + title + '</div><div class="s-desc">' + desc + '</div></div><div class="s-ctl">' + ctl + '</div></div>';
    }
}

/* ═══════════════════ 스크린리더: 외국어 글자에 lang 붙이기 ═══════════════════ */
(function () {
    const tag = root => { if (!CUR || !root.querySelectorAll) return; root.querySelectorAll('.native:not([lang]), .unit-chip:not([lang])').forEach(el => el.setAttribute('lang', CUR.ttsLang)); };
    const mo = new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) { if (n.classList && n.classList.contains('native') && !n.hasAttribute('lang') && CUR) n.setAttribute('lang', CUR.ttsLang); tag(n); } })));
    ['main', 'modalRoot'].forEach(id => { const el = document.getElementById(id); if (el) mo.observe(el, { childList: true, subtree: true }); });
})();

/* ═══════════════════ 뒤로가기(브라우저·안드로이드) ═══════════════════ */
// 앱 안 화면 이동은 브라우저 기록에 남지 않으므로, 기록 한 칸을 '덫'으로 깔아 두고 뒤로가기를 가로챈다.
let backArmed = false;
function armBack() { if (backArmed) return; try { history.pushState({ lt: 1 }, ''); backArmed = true; } catch (e) { } }
function handleBack() {
    const root = document.getElementById('modalRoot');
    if (root && root.innerHTML) { closeModal(false, 'cancel'); return true; }
    if (S.view === 'lesson') {
        if (S.quiz && S.step === 4 && S.quiz.i > 0 && !confirm('퀴즈를 그만할까요? 푼 문제는 저장되지 않아요.')) return true;
        S.quiz = null; go('home'); return true;
    }
    if (S.view === 'storyRead') { S.story = null; go('story'); return true; }
    if (S.view === 'skipTest') { S.skip = null; S.quiz = null; go('home'); return true; }
    if (S.view === 'review' && (S.redo || S.match || S.review)) { S.redo = null; S.match = null; S.review = null; S.quiz = null; go('review'); return true; }
    if (S.view === 'trainer' && S.trainer) { S.trainer = null; go('trainer'); return true; }
    if (S.view !== 'home' && S.view !== 'picker' && DATA) { go('home'); return true; }
    return false;
}
window.addEventListener('popstate', () => {
    backArmed = false;
    if (handleBack()) armBack();
    else showToast('한 번 더 누르면 앱을 나가요');
});
document.addEventListener('click', armBack, { once: true, capture: true });

/* ═══════════════════ 시작 ═══════════════════ */
document.getElementById('langSwitchBtn').addEventListener('click', () => go('picker'));
document.getElementById('avatarBtn').addEventListener('click', () => go('picker'));
renderStorageWarning();
applyBigText();
const QP = new URLSearchParams(location.search);
const wantLang = QP.get('lang'), fromDeq = QP.get('from') === 'deq';
if (wantLang) { try { history.replaceState(null, '', location.pathname); } catch (e) { } }
let startLang = null;
if (wantLang && LANGS[wantLang]) {
    // 옛 DEQ 주소로 들어왔어도, 이미 다른 언어를 고른 사람은 가져올 기록이 남아 있을 때만 영어로
    if (fromDeq && store.active && store.active !== wantLang) {
        const rec = store.byLang.en && store.byLang.en.deqImport;
        const pending = !!readDeq() && !(rec && (rec.at || rec.declined));
        startLang = pending ? wantLang : store.active;
        if (!pending && store.seen.deqLinkToast !== todayStr()) { store.seen.deqLinkToast = todayStr(); save(); setTimeout(() => showToast('🗽 헬로 영어는 🔀 언어 버튼에서 언제든 고를 수 있어요', '', 3200), 900); }
    } else startLang = wantLang;
}
if (startLang) activateLanguage(startLang, { fromDeq: fromDeq && startLang === 'en' });
else if (store.active && LANGS[store.active]) activateLanguage(store.active);
else render();
</script>
</body>
</html>
