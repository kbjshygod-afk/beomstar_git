<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#c60b1e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="올라 스페인어가 랭귀지 스타터로 합쳐졌어요. 같은 브라우저라면 기록이 자동으로 이어져요." />
<meta property="og:title" content="랭귀지 스타터 · 올라 스페인어" />
<meta property="og:description" content="왕초보 외국어 회화 · 하루 10분 · 영어·중국어·일본어·스페인어·프랑스어" />
<meta property="og:image" content="https://kbjshygod-afk.github.io/beomstar_git/assets/og-image.png" />
<meta property="og:url" content="https://kbjshygod-afk.github.io/beomstar_git/language-teacher/?lang=es" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="../language-teacher/icons/favicon-32.png" />
<link rel="canonical" href="https://kbjshygod-afk.github.io/beomstar_git/language-teacher/?lang=es" />
<title>올라 스페인어 → 랭귀지 스타터</title>
<style>
  :root { --main: #c60b1e; --bg: #f8fafc; --text: #1e293b; --muted: #64748b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #8a0716, #c60b1e 60%, #ffc400 150%); min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; color: var(--text); }
  .card { background: var(--bg); border-radius: 22px; max-width: 440px; width: 100%; padding: 26px 20px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
  .ico { font-size: 50px; }
  h1 { font-size: 19px; margin: 10px 0 8px; line-height: 1.4; }
  p { font-size: 14px; line-height: 1.7; color: var(--muted); }
  ul { text-align: left; font-size: 13.5px; line-height: 1.8; margin: 12px 0 16px 18px; }
  .rec { background: #fff7e6; border: 1px solid #f2d98c; border-radius: 12px; padding: 10px 12px; font-size: 13.5px; font-weight: 700; margin: 0 0 14px; color: #7a5b00; }
  a.btn { display: block; width: 100%; border: none; background: var(--main); color: white; text-decoration: none; font-weight: 800; font-size: 16px; border-radius: 14px; padding: 14px; }
  .small { font-size: 12px; margin-top: 10px; }
  .note { background: #eef6ff; border: 1px solid #cfe3fa; border-radius: 12px; padding: 10px 12px; font-size: 12.5px; text-align: left; margin-top: 12px; color: var(--text); }
  .extra { font-size: 12.5px; margin-top: 14px; }
  .extra a { color: var(--muted); }
</style>
</head>
<body>
<main class="card">
  <div class="ico">💃</div>
  <h1>올라 스페인어가<br>랭귀지 스타터 「올라 스페인어」로 합쳐졌어요</h1>
  <p>같은 29개 레슨을 더 쉽고 재미있게 이어서 할 수 있어요.</p>
  <ul>
    <li>완료한 레슨·복습 단어가 자동으로 옮겨져요</li>
    <li>말하기 채점·역할극·보스 미션·복습 카드·XP·연속 기록이 더해졌어요</li>
    <li>영어·중국어·일본어·스페인어·프랑스어를 한 앱에서 골라 배워요</li>
  </ul>
  <div id="recBox"></div>
  <a class="btn" id="go" href="../language-teacher/index.html?lang=es&amp;from=legacy">올라 스페인어로 이동 →</a>
  <div id="extra"></div>
  <p class="small" id="countdown"></p>
  <noscript><p class="small">자동 이동이 안 되면 위 버튼을 눌러 주세요.</p></noscript>
</main>
<script>
  // 예전 기록(localStorage 'hola_es_v1')은 읽기만 하고 지우지 않는다. 같은 사이트의 랭귀지 스타터가 처음 열 때 그대로 이어받는다.
  (function () {
    var KEY = 'hola_es_v1';
    var go = document.getElementById('go');
    var ua = navigator.userAgent || '';
    var inApp = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|BAND\/|DaumApps|everytimeApp|Barcelona|musical_ly|BytedanceWebview/i.test(ua);
    var st = null;
    try { var raw = KEY ? localStorage.getItem(KEY) : null; st = raw ? JSON.parse(raw) : null; } catch (e) { st = null; }
    var lessons = st && st.completed && typeof st.completed === 'object' ? Object.keys(st.completed).length : 0;
    var cards = st && st.srs && typeof st.srs === 'object' ? Object.keys(st.srs).length : 0;
    var hasRec = lessons > 0 || cards > 0;
    if (inApp) {
      // 기록이 바로 이 앱 안 브라우저에 있으면, 옛 주소를 기본 브라우저로 열게 하지 않는다(그쪽엔 기록이 없어 0부터 시작하게 됨).
      // 먼저 랭귀지 스타터로 옮겨 이어받은 뒤, 앱 화면의 안내 버튼으로 기록을 들고 기본 브라우저로 간다
      var carry = /KAKAOTALK|Line\//i.test(ua);
      document.getElementById('extra').innerHTML = hasRec
        ? '<div class="note">📱 지금은 앱 안의 브라우저라서, 예전 기록은 <b>바로 이 브라우저</b>에 있어요. 위 버튼으로 이동해 기록을 먼저 이어받은 뒤, ' +
          (carry ? '앱 화면의 <b>📦 기록 들고 기본 브라우저로 열기</b>를 누르면 크롬·사파리로 기록이 함께 옮겨져요.'
            : '앱 화면의 <b>📋 기록 코드 복사</b>를 눌러 크롬·사파리 첫 화면 아래 「📦 다른 기기 기록 가져오기」에 붙여넣으면 기록이 옮겨져요.') + '</div>'
        : '<div class="note">📱 지금은 앱 안의 브라우저예요. 예전 기록이 있다면 <b>평소 쓰던 크롬·사파리</b>에 있을 거예요. 메뉴에서 <b>다른 브라우저로 열기</b>를 눌러 주세요.' +
          (/KAKAOTALK/i.test(ua) ? '<br><a href="kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href) + '">👉 기본 브라우저로 열기</a>' : '') + '</div>';
    }
    if (hasRec) document.getElementById('recBox').innerHTML = '<div class="rec">📦 이 기기에 기록이 있어요: 완료 레슨 ' + lessons + '개 · 복습 카드 ' + cards + '장<br><span style="font-weight:600">랭귀지 스타터가 처음 열 때 그대로 이어받아요</span></div>';
    if (inApp && hasRec) return;
    if (!hasRec && !document.getElementById('stayEmma')) { location.replace(go.href); return; }
    var left = 3, cd = document.getElementById('countdown'), timer = null;
    if (left <= 0) { location.replace(go.href); return; }
    function tick() {
      if (left <= 0) { location.replace(go.href); return; }
      cd.textContent = left + '초 뒤 자동으로 이동해요';
      left--; timer = setTimeout(tick, 1000);
    }
    tick();
    var stop = document.getElementById('stayEmma');
    if (stop) stop.addEventListener('click', function () { if (timer) clearTimeout(timer); });
  })();
</script>
</body>
</html>
